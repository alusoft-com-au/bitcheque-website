<script>
(function(){
const T=(en,zh,o)=>window.bcT(en,zh,o);
// Seed: 32 bytes of entropy as 24 BIP-39 words (256 bits + 8-bit checksum). The 32 bytes are the
// wallet's Domain seed (src/wallet.rs). Held in memory only, never stored.
const POOL=window.BIP39;
const sha=async b=>new Uint8Array(await crypto.subtle.digest('SHA-256',b));
async function toWords(ent){const h=await sha(ent);let bits='';for(const x of ent)bits+=x.toString(2).padStart(8,'0');bits+=h[0].toString(2).padStart(8,'0');
  return [...Array(24)].map((_,i)=>POOL[parseInt(bits.slice(i*11,i*11+11),2)])}
const hex=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
const ROLLS=99, MOVES=256;
// Printable parts and the registration file come from assets/book.js (bitcheque-print/src/book.js), the same
// code as the offline print page. A book is 256 cheques; this flow prints cheques 1..S.last and registers them.
const enc=new TextEncoder();
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
const SITE='https://bitcheque.org/',siteBase=()=>SITE;
async function download(part){const html=await BCBook.sheet({part,seed:unhex(S.ent),first:1,last:S.last,mod:await WASM,base:siteBase()});
  BCBook.save(`bitcheque-part-${part}-cheques-1-${S.last}.html`,html,'text/html')}
// a file that could not be made: book.js refuses a sheet whose cells differ from the wallet's own, and saves nothing
function failed(b,e){b.disabled=false;document.querySelectorAll('.task.run').forEach(x=>{x.classList.remove('run');x.querySelector('.icon').textContent='radio_button_unchecked'});
  const w=document.createElement('div');w.className='warn r';w.innerHTML='<span class="icon">error</span><span></span>';
  w.lastChild.textContent=/differs/.test(e&&e.message)?T('Nothing was saved: a cell drawn for the sheet did not match the wallet\'s own. Do not print from this computer; try again on another one.','什麼都沒存：為紙張畫出的一格和錢包自己算的不符。不要用這台電腦列印；請換一台再試。',{hans:"没有保存任何文件：为纸张画出的一格与钱包自己计算的不符。不要用这台电脑打印；请换一台再试。",es:"No se guardó nada: una casilla dibujada para la hoja no coincidió con la del propio monedero. No imprimas desde esta computadora; inténtalo en otra.",pt:"Nada foi salvo: uma célula desenhada para a folha não conferiu com a da própria carteira. Não imprima neste computador; tente em outro.",fr:"Rien n’a été enregistré : une case dessinée pour la feuille ne correspondait pas à celle du portefeuille. N’imprimez pas depuis cet ordinateur ; réessayez sur un autre.",de:"Es wurde nichts gespeichert: Ein für das Blatt gezeichnetes Feld passte nicht zu dem der Wallet. Drucke nicht von diesem Computer; versuche es an einem anderen.",it:"Non è stato salvato nulla: una casella disegnata per il foglio non corrispondeva a quella del wallet. Non stampare da questo computer; riprova su un altro.",ja:"何も保存されていません。用紙用に描いたマスがウォレット自身の計算と一致しませんでした。このコンピューターでは印刷せず、別のコンピューターでやり直してください。",ko:"아무것도 저장되지 않았습니다. 종이에 그린 칸이 지갑이 직접 계산한 것과 일치하지 않았습니다. 이 컴퓨터로 인쇄하지 말고 다른 컴퓨터에서 다시 시도하세요.",ru:"Ничего не сохранено: ячейка, нарисованная для листа, не совпала с ячейкой самого кошелька. Не печатайте с этого компьютера; попробуйте на другом.",tr:"Hiçbir şey kaydedilmedi: sayfa için çizilen bir hücre cüzdanın kendi hesabıyla eşleşmedi. Bu bilgisayardan yazdırmayın; başka bir bilgisayarda tekrar deneyin.",id:"Tidak ada yang disimpan: sebuah kotak yang digambar untuk lembar tidak cocok dengan milik dompet itu sendiri. Jangan mencetak dari komputer ini; coba lagi di komputer lain.",vi:"Chưa lưu gì cả: một ô vẽ cho tờ giấy không khớp với ô do chính ví tính ra. Đừng in từ máy tính này; hãy thử lại trên máy khác."}):T('The file could not be made, and nothing was saved. Reload the page and try again.','檔案無法產生，什麼都沒存。請重新載入頁面再試一次。',{hans:"无法生成文件，没有保存任何内容。请重新加载页面后重试。",es:"No se pudo crear el archivo y no se guardó nada. Recarga la página e inténtalo de nuevo.",pt:"Não foi possível criar o arquivo, e nada foi salvo. Recarregue a página e tente de novo.",fr:"Le fichier n’a pas pu être créé, et rien n’a été enregistré. Rechargez la page et réessayez.",de:"Die Datei konnte nicht erstellt werden, und es wurde nichts gespeichert. Lade die Seite neu und versuche es erneut.",it:"Non è stato possibile creare il file e non è stato salvato nulla. Ricarica la pagina e riprova.",ja:"ファイルを作成できず、何も保存されていません。ページを再読み込みして、もう一度お試しください。",ko:"파일을 만들 수 없어 아무것도 저장되지 않았습니다. 페이지를 새로 고친 뒤 다시 시도하세요.",ru:"Файл не удалось создать, ничего не сохранено. Перезагрузите страницу и попробуйте снова.",tr:"Dosya oluşturulamadı ve hiçbir şey kaydedilmedi. Sayfayı yeniden yükleyip tekrar deneyin.",id:"Berkas tidak dapat dibuat, dan tidak ada yang disimpan. Muat ulang halaman lalu coba lagi.",vi:"Không tạo được tệp, và chưa lưu gì cả. Hãy tải lại trang rồi thử lại."});
  (b.closest('.lkb,.regf')||b).after(w)}
// a new seed, a different count or a different range makes a different book: whatever was saved for the old one no longer counts
function resetPrint(){Object.assign(S,{printedA:false,printedB:false,reg:null,regSaved:false,sent:false,honest:false,hon2:null,code:null});S.checked.sB0=S.checked.sB1=false}
function resetMore(){Object.assign(S,{mA:false,mB:false,mR:false,reg:null,sent:false,honest:false,hon2:null,code:null});S.checked.mP0=S.checked.mP1=false}
// once the flow is past the print steps the seed is not needed again: drop it from memory (and so from the page)
function wipeSeed(){Object.assign(S,{seed:null,ent:'',rolls:'',moves:0,pool:[],mwords:'',mseed:null});for(const o of [S.quiz,S.qopts])for(const k in o)delete o[k]}
// The browser wallet: the node's own Rust (web/wasm) compiled to WebAssembly, so the registration and
// cheque 0 are built by exactly the code the chain checks them with. Inputs go in through `io`.
const WASM=fetch('assets/bitcheque.wasm?v=c49f032e').then(r=>r.arrayBuffer()).then(b=>WebAssembly.compile(b));
async function wcall(fn,input,raw){const x=(await WebAssembly.instantiate(await WASM,{})).exports;return wrun(x,fn,input,raw)}
function wrun(x,fn,input,raw){const p=x.io_reserve(input.length);new Uint8Array(x.memory.buffer,p,input.length).set(input);const n=x[fn]();if(!n)throw new Error(fn);
  const o=new Uint8Array(x.memory.buffer,x.io_ptr(),n).slice();return raw?o:new TextDecoder().decode(o)}
// the lookup code: the start of the account id (public), printed on the sheets and scanned to find the number once it is final
const fmtCode=c=>c.toUpperCase().match(/.{1,4}/g).join('-');
const findURL=c=>new URL('explorer.html#code='+fmtCode(c),SITE).href;   // for paper and QR codes: always the public site
// the link on this page: the site it was served from (a copy on another origin, or a local test), else the public one
const findHere=c=>new URL('explorer.html#code='+fmtCode(c),/^https?:$/.test(location.protocol)?location.href:SITE).href;
async function qrSvg(text,dark='#02050A'){const m=await wcall('qr',enc.encode(text),true),n=m[0],q=4;let d='';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(m[1+y*n+x])d+=`M${x+q} ${y+q}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+2*q} ${n+2*q}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path fill="${dark}" d="${d}"/></svg>`}
async function qrDownload(code){const svg=await qrSvg(findURL(code)),img=new Image(),c=document.createElement('canvas');c.width=c.height=720;
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);await img.decode();c.getContext('2d').drawImage(img,0,0,720,720);
  const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=`bitcheque-account-lookup-${fmtCode(code)}.png`;document.body.appendChild(a);a.click();a.remove()}
const qs=s=>document.querySelector(s);
// The public registration file: the unmined registration, cheque 0 (zero coins to nobody) and the lookup code. No seed.
async function saveReg(){if(!S.ent)return;S.reg=await BCBook.registration({seed:unhex(S.ent),first:0,last:S.last,mod:await WASM});S.code=S.reg.code;S.checked.rg0=false;
  BCBook.save(BCBook.regName(S.reg),JSON.stringify(S.reg),'application/json');S.regSaved=true;render()}
// A registration file holds the unmined registrations of every 16-cheque batch its cheques touch (`txs`), and cheque 0
// with the batch that holds it (`honesty`: its transactions as the print page's wallet gives them: one opening with all
// 18 columns, an opening and 5 pieces, or 18 pieces from wallets made before a cheque opened in one transaction).
const chq=n=>Number.isInteger(n)&&n>=0&&n<=255,hexes=a=>Array.isArray(a)&&a.every(t=>typeof t==='string'&&/^[0-9a-f]+$/.test(t));
const validReg=r=>r&&r.bitcheque==='registration'&&r.v===2&&typeof r.code==='string'&&/^[0-9a-f]{12}$/.test(r.code)&&chq(r.first)&&chq(r.last)&&r.first<=r.last&&hexes(r.txs)&&r.txs.length>0&&(r.honesty===undefined||(hexes(r.honesty)&&[1,6,18].includes(r.honesty.length)));
document.addEventListener('change',async e=>{if(e.target.id!=='regfile')return;const f=e.target.files[0];if(!f)return;
  let r=null;try{r=JSON.parse(await f.text())}catch(_){}
  // from the network reset on, an unmined registration ends with an empty anchor and nonce (41 zero bytes): a file
  // from before it no longer works
  if(validReg(r)&&anchored(await WASM)&&!r.txs.every(t=>t.endsWith('0'.repeat(82)))){qs('#regerr').textContent=T('This registration file was made before the network was reset, so it no longer works. Print your cheques again from your seed: a new file is saved with them.','這個登記檔是在網路重置之前產生的，已經不能用了。請用種子重新印出支票：新的登記檔會和它們一起存下。',{hans:"这个注册文件是在网络重置之前生成的，已经不能用了。请用种子重新打印支票：新的注册文件会和它们一起保存。",es:"Este archivo de registro se creó antes de que se reiniciara la red, así que ya no sirve. Vuelve a imprimir tus cheques con tu semilla: con ellos se guarda un archivo nuevo.",pt:"Este arquivo de registro foi criado antes de a rede ser reiniciada, então não funciona mais. Imprima seus cheques de novo a partir da sua semente: um arquivo novo é salvo junto com eles.",fr:"Ce fichier d’enregistrement a été créé avant la réinitialisation du réseau : il ne fonctionne plus. Réimprimez vos chèques à partir de votre graine : un nouveau fichier est enregistré avec eux.",de:"Diese Registrierungsdatei wurde erstellt, bevor das Netzwerk zurückgesetzt wurde, und funktioniert nicht mehr. Druck deine Schecks mit deinem Seed neu: Eine neue Datei wird mit ihnen gespeichert.",it:"Questo file di registrazione è stato creato prima che la rete venisse azzerata, quindi non funziona più. Ristampa i tuoi assegni dal seed: insieme a loro viene salvato un nuovo file.",ja:"この登録ファイルはネットワークのリセット前に作られたため、もう使えません。シードから小切手を印刷し直してください。新しいファイルが一緒に保存されます。",ko:"이 등록 파일은 네트워크가 초기화되기 전에 만들어져 더 이상 쓸 수 없습니다. 시드로 수표를 다시 인쇄하세요. 새 파일이 함께 저장됩니다.",ru:"Этот файл регистрации создан до сброса сети, поэтому больше не работает. Напечатайте чеки заново по сид-фразе: вместе с ними сохранится новый файл.",tr:"Bu kayıt dosyası ağ sıfırlanmadan önce oluşturuldu, bu yüzden artık çalışmıyor. Çeklerinizi tohumunuzdan yeniden basın: onlarla birlikte yeni bir dosya kaydedilir.",id:"Berkas pendaftaran ini dibuat sebelum jaringan diatur ulang, jadi sudah tidak berlaku. Cetak ulang cek Anda dari seed: berkas baru disimpan bersama cek tersebut.",vi:"Tệp đăng ký này được tạo trước khi mạng được đặt lại, nên không còn dùng được nữa. Hãy in lại séc từ hạt giống của bạn: một tệp mới sẽ được lưu cùng với chúng."});return}
  if(validReg(r)){S.reg=r;S.code=r.code;S.checked.rg0=false;render();return}
  qs('#regerr').textContent=T('That is not a Bitcheque registration file.','這不是 Bitcheque 登記檔。',{hans:"这不是 Bitcheque 注册文件。",es:"Eso no es un archivo de registro de Bitcheque.",pt:"Isso não é um arquivo de registro do Bitcheque.",fr:"Ce n’est pas un fichier d’enregistrement Bitcheque.",de:"Das ist keine Bitcheque-Registrierungsdatei.",it:"Questo non è un file di registrazione di Bitcheque.",ja:"これは Bitcheque の登録ファイルではありません。",ko:"Bitcheque 등록 파일이 아닙니다.",ru:"Это не файл регистрации Bitcheque.",tr:"Bu bir Bitcheque kayıt dosyası değil.",id:"Itu bukan berkas pendaftaran Bitcheque.",vi:"Đây không phải tệp đăng ký Bitcheque."})});
// Proof of work on every core: each worker grinds its own nonce range with the wasm miner and reports progress.
const WORKER=`let x;onmessage=async e=>{const d=e.data;if(d.mod){x=(await WebAssembly.instantiate(d.mod,{})).exports;const p=x.io_reserve(d.input.length);new Uint8Array(x.memory.buffer,p,d.input.length).set(d.input);postMessage({ready:x.reg_prepare()});return}
  let n=d.start;for(;;){const r=x.reg_mine(n>>>0,Math.floor(n/4294967296),d.step);if(r){postMessage({found:n+r-1});return}n+=d.step;postMessage({done:d.step})}}`;
// A batch or cheque 0 the chain already has is refused as a duplicate, which means it is done.
const DONE=['ok','already in mempool','account exists','batch overlaps','cheque number already consumed'];
// What the miner works on: the registration from the file, and the target. The wallet from the network reset on (its
// wasm has `commits`) ties the proof of work to a recent block, the node's tip, fetched now at mining time, so a
// registration file never goes stale: io = registration || anchor (32, GET /tip unhexed as given) || target (32).
const anchored=mod=>WebAssembly.Module.exports(mod).some(e=>e.name==='commits');
async function mineInput(base,mod,txHex,target){

ivo cerca de 2 horas após o registro.",fr:"Votre numéro de compte devient définitif environ 2 heures après l’enregistrement.",de:"Deine Kontonummer wird etwa 2 Stunden nach der Registrierung endgültig.",it:"Il tuo numero di account diventa definitivo circa 2 ore dopo la registrazione.",ja:"アカウント番号は、登録から約 2 時間後に確定します。",ko:"계정 번호는 등록 후 약 2시간이 지나면 확정됩니다.",ru:"Номер вашего аккаунта станет окончательным примерно через 2 часа после регистрации.",tr:"Hesap numaranız kayıttan yaklaşık 2 saat sonra kesinleşir.",id:"Nomor akun Anda menjadi final sekitar 2 jam setelah pendaftaran.",vi:"Số tài khoản của bạn sẽ cố định khoảng 2 giờ sau khi đăng ký."})}</p>

 <p class="faint">${T(`Each cheque is one transfer. Your book has 255 in all, on one account number: print the rest from your seed whenever you need them. ${S.last} cheques make ${BCBook.pages(1,S.last)} pages per part.`,`每張支票是一次轉帳。整本簿子共 255 張，都在同一個帳號：其餘的需要時再用種子印。${S.last} 張支票每部分 ${BCBook.pages(1,S.last)} 頁。`,{hans:`每张支票是一次转账。整本支票簿共 255 张，都在同一个账号下：其余的需要时再用种子打印。${S.last} 张支票每部分 ${BCBook.pages(1,S.last)} 页。`,es:`Cada cheque es una transferencia. Tu talonario tiene 255 en total, con un solo número de cuenta: imprime el resto desde tu semilla cuando los necesites. ${S.last} cheques ocupan ${BCBook.pages(1,S.last)} páginas por parte.`,pt:`Cada cheque é uma transferência. Seu talão tem 255 no total, com um único número da conta: imprima o resto a partir da sua semente quando precisar. ${S.last} cheques ocupam ${BCBook.pages(1,S.last)} páginas por parte.`,fr:`Chaque chèque est un transfert. Votre carnet en compte 255 au total, sur un seul numéro de compte : imprimez le reste depuis votre graine quand vous en avez besoin. ${S.last} chèques font ${BCBook.pages(1,S.last)} pages par partie.`,de:`Jeder Scheck ist eine Übertragung. Dein Scheckheft hat insgesamt 255, alle mit einer Kontonummer: Druck den Rest aus deinem Seed, wann immer du ihn brauchst. ${S.last} Schecks ergeben ${BCBook.pages(1,S.last)} Seiten pro Teil.`,it:`Ogni assegno è un trasferimento. Il tuo libretto ne ha 255 in tutto, con un solo numero di account: stampa il resto dal tuo seed quando ti serve. ${S.last} assegni occupano ${BCBook.pages(1,S.last)} pagine per parte.`,ja:`小切手一枚が一回の送付です。小切手帳には同じアカウント番号で全部で 255 枚あり、残りは必要なときにシードから印刷できます。${S.last} 枚の小切手は、パートごとに ${BCBook.pages(1,S.last)} ページになります。`,ko:`수표 한 장이 전송 한 번입니다. 수표책에는 하나의 계정 번호로 모두 255장이 있으며, 나머지는 필요할 때 시드로 인쇄하면 됩니다. 수표 ${S.last}장은 부분마다 ${BCBook.pages(1,S.last)}쪽입니다.`,ru:`Каждый чек — один перевод. В вашей книжке всего 255 чеков на одном номере аккаунта: остальные печатайте из сид-фразы, когда понадобятся. ${S.last} чеков — это ${BCBook.pages(1,S.last)} страниц на часть.`,tr:`Her çek bir transferdir. Defterinizde tek bir hesap numarasıyla toplam 255 çek var: kalanını ihtiyaç duydukça tohumunuzdan basın. ${S.last} çek, bölüm başına ${BCBook.pages(1,S.last)} sayfa eder.`,id:`Setiap cek adalah satu transfer. Buku Anda berisi 255 cek seluruhnya, dengan satu nomor akun: cetak sisanya dari seed Anda kapan pun Anda membutuhkannya. ${S.last} cek menjadi ${BCBook.pages(1,S.last)} halaman per bagian.`,vi:`Mỗi tờ séc là một lần chuyển. Sổ của bạn có tổng cộng 255 tờ, cùng một số tài khoản: in phần còn lại từ hạt giống bất cứ khi nào bạn cần. ${S.last} séc là ${BCBook.pages(1,S.last)} trang mỗi phần.`})}</p>
 <div class="warn y"><span class="icon">lightbulb</span><span>${T('Print part A and part B as separate print runs, ideally on different printers, and store them apart. The computer that holds your seed must be clean and offline.','A、B 兩部分要分開列印，最好用不同的印表機，並分開存放。持有種子的電腦必須乾淨且離線。',{hans:"把 A 部分和 B 部分分成两次打印，最好使用不同的打印机，并分开存放。保存你种子的电脑必须干净且离线。",es:"Imprime la parte A y la parte B en tiradas separadas, a ser posible en impresoras distintas, y guárdalas en lugares diferentes. La computadora que contiene tu semilla debe estar limpia y sin conexión.",pt:"Imprima a parte A e a parte B em impressões separadas, de preferência em impressoras diferentes, e guarde-as em lugares diferentes. O computador que guarda sua semente deve estar limpo e offline.",fr:"Imprimez la partie A et la partie B en deux tirages séparés, idéalement sur des imprimantes différentes, et rangez-les à part. L’ordinateur qui détient votre graine doit être propre et hors ligne.",de:"Drucke Teil A und Teil B als getrennte Druckvorgänge, idealerweise auf verschiedenen Druckern, und bewahre sie getrennt auf. Der Computer, der deinen Seed enthält, muss sauber und offline sein.",it:"Stampa la parte A e la parte B in due stampe separate, idealmente su stampanti diverse, e conservale in luoghi diversi. Il computer che contiene il tuo seed deve essere pulito e offline.",ja:"パート A とパート B は別々の印刷として、できれば別のプリンターで印刷し、別々に保管してください。シードを扱うコンピューターはクリーンでオフラインでなければなりません。",ko:"A 부분과 B 부분은 별도로 인쇄하고(가능하면 다른 프린터로), 따로 보관하세요. 시드를 다루는 컴퓨터는 깨끗하고 오프라인이어야 합니다.",ru:"Печатайте части A и B отдельно, лучше на разных принтерах, и храните их порознь. Компьютер, на котором находится ваша сид-фраза, должен быть чистым и офлайн.",tr:"A ve B bölümlerini ayrı baskılar olarak, mümkünse farklı yazıcılarda basın ve ayrı yerlerde saklayın. Tohumunuzu tutan bilgisayar temiz ve çevrimdışı olmalıdır.",id:"Cetak bagian A dan bagian B sebagai cetakan terpisah, idealnya dengan printer yang berbeda, dan simpan di tempat terpisah. Komputer yang menyimpan seed Anda harus bersih dan offline.",vi:"In phần A và phần B thành hai lần in riêng, tốt nhất trên các máy in khác nhau, và cất ở những nơi khác nhau. Máy tính giữ hạt giống của bạn phải sạch và ngoại tuyến."})}</span></div>${navRow()}`,

 <p class="sub">${T('Seeds and cells must never touch an online or everyday computer. Tick each item once it is done.','種子和格子絕不能碰到連網或日常使用的電腦。完成一項就勾一項。',{hans:"种子和格子绝不能接触联网的电脑或日常使用的电脑。每完成一项就勾选一项。",es:"Las semillas y las casillas nunca deben tocar una computadora conectada o de uso diario. Marca cada punto una vez hecho.",pt:"Sementes e células nunca devem passar por um computador online ou de uso diário. Marque cada item quando estiver feito.",fr:"Les graines et les cases ne doivent jamais toucher un ordinateur connecté ou d’usage courant. Cochez chaque point dès qu’il est fait.",de:"Seeds und Zellen dürfen nie mit einem Online- oder Alltagscomputer in Berührung kommen. Hake jeden Punkt ab, sobald er erledigt ist.",it:"Seed e caselle non devono mai toccare un computer online o di uso quotidiano. Spunta ogni voce quando l'hai completata.",ja:"シードとマスは、オンラインのコンピューターや普段使いのコンピューターに決して触れさせてはいけません。終わった項目から順にチェックを入れてください。",ko:"시드와 칸은 온라인 컴퓨터나 평소 쓰는 컴퓨터에 절대 닿으면 안 됩니다. 완료한 항목마다 체크하세요.",ru:"Сид-фраза и ячейки никогда не должны попадать на подключённый к сети или повседневный компьютер. Отмечайте каждый пункт, когда он выполнен.",tr:"Tohumlar ve hücreler asla çevrimiçi veya gündelik bir bilgisayara değmemelidir. Her maddeyi tamamladığınızda işaretleyin.",id:"Seed dan kotak sama sekali tidak boleh menyentuh komputer yang online atau komputer sehari-hari. Centang setiap butir setelah selesai.",vi:"Hạt giống và các ô không bao giờ được chạm vào máy tính trực tuyến hay máy dùng hằng ngày. Đánh dấu từng mục khi đã làm xong."})}</p></div>

  ['extension_off',T('Use a verified app','使用已驗證的 App',{hans:"使用经过验证的应用",es:"Usa una app verificada",pt:"Use um app verificado",fr:"Utilisez une application vérifiée",de:"Verifizierte App verwenden",it:"Usa un'app verificata",ja:"検証済みのアプリを使う",ko:"검증된 앱 사용",ru:"Используйте проверенное приложение",tr:"Doğrulanmış bir uygulama kullanın",id:"Gunakan aplikasi terverifikasi",vi:"Dùng ứng dụng đã xác minh"}),T('The official wallet with its checksum checked, or a clean browser with no extensions.','已驗證校驗碼的官方錢包，或沒有擴充功能的乾淨瀏覽器。',{hans:"已核对校验和的官方钱包，或没有安装任何扩展的干净浏览器。",es:"La app de cartera oficial, con su suma de verificación comprobada, o un navegador limpio sin extensiones.",pt:"A carteira oficial com o checksum conferido, ou um navegador limpo sem extensões.",fr:"Le portefeuille officiel avec sa somme de contrôle vérifiée, ou un navigateur propre sans extensions.",de:"Die offizielle Wallet mit geprüfter Prüfsumme oder ein sauberer Browser ohne Erweiterungen.",it:"Il wallet ufficiale con il checksum verificato, oppure un browser pulito senza estensioni.",ja:"チェックサムを確認した公式ウォレット、または拡張機能のないクリーンなブラウザー。",ko:"체크섬을 확인한 공식 지갑, 또는 확장 프로그램이 없는 깨끗한 브라우저.",ru:"Официальное приложение-кошелёк с проверенной контрольной суммой или чистый браузер без расширений.",tr:"Sağlama toplamı kontrol edilmiş resmî cüzdan veya eklentisiz temiz bir tarayıcı.",id:"Dompet resmi yang checksum-nya sudah diperiksa, atau browser bersih tanpa ekstensi.",vi:"Ví chính thức đã được kiểm tra checksum, hoặc một trình duyệt sạch không có tiện ích mở rộng."})],

 ${checks('dA',[T('The printer is connected by USB, not Wi-Fi or a network.','印表機以 USB 連接，不經 Wi-Fi 或網路。',{hans:"打印机通过 USB 连接，而不是 Wi-Fi 或网络。",es:"La impresora está conectada por USB, no por Wi-Fi ni por red.",pt:"A impressora está conectada por USB, não por Wi-Fi ou rede.",fr:"L’imprimante est connectée en USB, pas en Wi-Fi ni via un réseau.",de:"Der Drucker ist per USB angeschlossen, nicht per WLAN oder Netzwerk.",it:"La stampante è collegata via USB, non tramite Wi-Fi o rete.",ja:"プリンターは Wi-Fi やネットワークではなく USB で接続されている。",ko:"프린터는 Wi-Fi나 네트워크가 아니라 USB로 연결되어 있습니다.",ru:"Принтер подключён по USB, а не через Wi-Fi или сеть.",tr:"Yazıcı Wi-Fi veya ağ ile değil, USB ile bağlı.",id:"Printer tersambung lewat USB, bukan Wi-Fi atau jaringan.",vi:"Máy in được nối bằng USB, không qua Wi-Fi hay mạng."}),T('It is not a workplace printer, print shop or cloud print service.','不是公司印表機、影印店或雲端列印服務。',{hans:"它不是单位的打印机、打印店或云打印服务。",es:"No es una impresora del trabajo, una imprenta ni un servicio de impresión en la nube.",pt:"Não é uma impressora do trabalho, de gráfica nem um serviço de impressão na nuvem.",fr:"Il ne s’agit pas d’une imprimante de votre lieu de travail, d’une boutique de reprographie ni d’un service d’impression dans le cloud.",de:"Es ist kein Firmendrucker, kein Copyshop und kein Cloud-Druckdienst.",it:"Non è una stampante aziendale, una copisteria o un servizio di stampa cloud.",ja:"職場のプリンター、印刷所、クラウド印刷サービスではない。",ko:"회사 프린터, 인쇄소, 클라우드 인쇄 서비스가 아닙니다.",ru:"Это не рабочий принтер, не копицентр и не облачный сервис печати.",tr:"İş yeri yazıcısı, fotokopi dükkânı veya bulut baskı hizmeti değil.",id:"Ini bukan printer kantor, jasa percetakan, atau layanan cetak cloud.",vi:"Đó không phải máy in ở nơi làm việc, tiệm in hay dịch vụ in qua đám mây."}),(T('The printer has no Wi-Fi turned on and has never been set up with a cloud account.','印表機沒有開啟 Wi-Fi，也從未綁定雲端帳號。',{hans:"打印机没有开启 Wi-Fi，也从未绑定过云账号。",es:"La impresora no tiene el Wi-Fi activado y nunca se ha configurado con una cuenta en la nube.",pt:"A impressora não tem Wi-Fi ligado e nunca foi configurada com uma conta na nuvem.",fr:"Le Wi-Fi de l’imprimante n’est pas activé et elle n’a jamais été configurée avec un compte cloud.",de:"Am Drucker ist kein WLAN eingeschaltet, und er wurde nie mit einem Cloud-Konto eingerichtet.",it:"La stampante non ha il Wi-Fi attivo e non è mai stata configurata con un account cloud.",ja:"プリンターの Wi-Fi はオフで、クラウドアカウントに登録されたこともない。",ko:"프린터의 Wi-Fi가 꺼져 있으며, 클라우드 계정에 한 번도 연결된 적이 없습니다.",ru:"На принтере не включён Wi-Fi, и он никогда не привязывался к облачному аккаунту.",tr:"Yazıcının Wi-Fi'ı açık değil ve hiçbir zaman bir bulut hesabıyla kurulmadı.",id:"Wi-Fi pada printer tidak diaktifkan, dan printer belum pernah dihubungkan dengan akun cloud.",vi:"Máy in không bật Wi-Fi và chưa từng được thiết lập với tài khoản đám mây."})),T('Nobody and no camera can see the screen.','沒有人或鏡頭能看到螢幕。',{hans:"没有任何人或摄像头能看到屏幕。",es:"Nadie, ni ninguna cámara, puede ver la pantalla.",pt:"Nenhuma pessoa ou câmera consegue ver a tela.",fr:"Personne, ni aucune caméra, ne peut voir l’écran.",de:"Weder eine Person noch eine Kamera kann den Bildschirm sehen.",it:"Nessuno, e nessuna telecamera, può vedere lo schermo.",ja:"誰にも、どのカメラにも画面が見えない。",ko:"아무도, 어떤 카메라도 화면을 볼 수 없습니다.",ru:"Ни один человек и ни одна камера не видят экран.",tr:"Ekranı hiç kimse ve hiçbir kamera göremiyor.",id:"Tidak ada orang maupun kamera yang dapat melihat layar.",vi:"Không người nào hay camera nào có thể nhìn thấy màn hình."})])}

seedA:()=>`${offline()}<h1>${T('Create your seed','建立你的種子',{hans:"生成你的种子",es:"Crea tu semilla",pt:"Crie sua semente",fr:"Créez votre graine",de:"Seed erstellen",it:"Crea il tuo seed",ja:"シードを作る",ko:"시드 생성",ru:"Создайте сид-фразу",tr:"Tohumunuzu oluşturun",id:"Buat seed Anda",vi:"Tạo hạt giống của bạn"})}</h1>
 <p class="sub">${T('These 24 words recreate your whole book, both parts, and print more cheques later. Make them from real randomness, then write them on paper in order. Never type them anywhere but a clean, offline computer.','這 24 個字可以重建整本簿子的兩部分，之後也用來印更多支票。用真正的隨機來源產生，再照順序寫在紙上，只在乾淨、離線的電腦上輸入。',{hans:"这 24 个词可以重建整本支票簿的两部分，以后也用来打印更多支票。用真正的随机来源生成，再按顺序写在纸上。只在干净、离线的电脑上输入。",es:"Estas 24 palabras recrean todo tu talonario, ambas partes, y sirven para imprimir más cheques después. Genéralas con verdadera aleatoriedad y escríbelas en papel en orden. No las escribas nunca en otro lugar que no sea una computadora limpia y sin conexión.",pt:"Estas 24 palavras recriam todo o seu talão, as duas partes, e servem para imprimir mais cheques depois. Gere-as com aleatoriedade real e escreva-as no papel, em ordem. Nunca as digite em outro lugar que não seja um computador limpo e offline.",fr:"Ces 24 mots recréent tout votre carnet, les deux parties, et servent à imprimer plus de chèques plus tard. Créez-les à partir d’un vrai hasard, puis écrivez-les sur papier dans l’ordre. Ne les saisissez jamais ailleurs que sur un ordinateur propre et hors ligne.",de:"Diese 24 Wörter stellen dein ganzes Scheckheft wieder her, beide Teile, und damit druckst du später weitere Schecks. Erzeuge sie aus echtem Zufall und schreib sie der Reihe nach auf Papier. Gib sie nirgendwo anders ein als auf einem sauberen Offline-Computer.",it:"Queste 24 parole ricreano tutto il tuo libretto, entrambe le parti, e servono a stampare altri assegni in futuro. Generale in modo davvero casuale, poi scrivile su carta in ordine. Non digitarle mai altrove se non su un computer pulito e offline.",ja:"この 24 語で小切手帳全体を両パートとも作り直せ、後で小切手を追加印刷するのにも使います。本物の乱数から作り、順番どおり紙に書き写してください。クリーンでオフラインのコンピューター以外では決して入力しないでください。",ko:"이 24개 단어로 수표책 전체를 두 부분 모두 다시 만들 수 있고, 나중에 수표를 더 인쇄할 때도 씁니다. 진짜 무작위로 만들고 종이에 순서대로 적으세요. 깨끗한 오프라인 컴퓨터가 아닌 곳에는 절대 입력하지 마세요.",ru:"Эти 24 слова воссоздают всю книжку, обе части, и позволяют позже напечатать ещё чеки. Создайте их из настоящей случайности и запишите на бумаге по порядку. Никогда не вводите их нигде, кроме чистого компьютера без сети.",tr:"Bu 24 kelime defterinizin tamamını, iki bölümüyle birlikte yeniden oluşturur ve daha sonra daha fazla çek basmanızı sağlar. Gerçek rastgelelikten üretin, sonra kâğıda sırasıyla yazın. Temiz ve çevrimdışı bir bilgisayar dışında hiçbir yere yazmayın.",id:"24 kata ini membuat ulang seluruh buku Anda, kedua bagiannya, dan dipakai untuk mencetak cek lagi nanti. Buat dari keacakan sungguhan, lalu tulis di kertas secara berurutan. Jangan pernah mengetiknya di mana pun selain komputer yang bersih dan offline.",vi:"24 từ này tạo lại toàn bộ sổ của bạn, cả hai phần, và dùng để in thêm séc sau này. Hãy tạo chúng từ ngẫu nhiên thật, rồi chép ra giấy theo đúng thứ tự. Đừng bao giờ gõ chúng ở đâu khác ngoài một máy tính sạch, ngoại tuyến."})}</p>
 ${S.seed?`<div class="warn g"><span class="icon">check_circle</span><span>${S.src==='dice'?T(`Made from your ${S.rolls.length} dice rolls.`,`由你擲的 ${S.rolls.length} 次骰子產生。`,{hans:`由你掷出的 ${S.rolls.length} 次骰子生成。`,es:`Generada a partir de tus ${S.rolls.length} tiradas de dado.`,pt:`Gerada a partir dos seus ${S.rolls.length} lançamentos de dado.`,fr:`Générée à partir de vos ${S.rolls.length} lancers de dé.`,de:`Erzeugt aus deinen ${S.rolls.length} Würfelwürfen.`,it:`Generato dai tuoi ${S.rolls.length} lanci di dado.`,ja:`あなたが振った ${S.rolls.length} 回のサイコロから作成しました。`,ko:`주사위를 ${S.rolls.length}번 굴린 결과로 만들었습니다.`,ru:`Создана из ваших ${S.rolls.length} бросков кубика.`,tr:`${S.rolls.length} zar atışınızdan üretildi.`,id:`Dibuat dari ${S.rolls.length} lemparan dadu Anda.`,vi:`Được tạo từ ${S.rolls.length} lần gieo xúc xắc của bạn.`}):T('Made from your movements mixed with this computer’s randomness.','由你的移動軌跡混合這台電腦的亂數產生。',{hans:"由你的移动轨迹与这台电脑自身的随机数混合生成。",es:"Generada a partir de tus movimientos mezclados con la aleatoriedad de esta computadora.",pt:"Gerada a partir dos seus movimentos misturados com a aleatoriedade deste computador.",fr:"Générée à partir de vos mouvements mélangés à l’aléa de cet ordinateur.",de:"Erzeugt aus deinen Bewegungen, gemischt mit dem Zufall dieses Computers.",it:"Generato dai tuoi movimenti mescolati con la casualità di questo computer.",ja:"あなたの動きと、このコンピューターの乱数を混ぜて作成しました。",ko:"내 움직임과 이 컴퓨터의 무작위성을 섞어 만들었습니다.",ru:"Создана из ваших движений, смешанных со случайностью этого компьютера.",tr:"Hareketlerinizin bu bilgisayarın rastgeleliğiyle karıştırılmasıyla üretildi.",id:"Dibuat dari gerakan Anda yang dicampur dengan keacakan komputer ini.",vi:"Được tạo từ chuyển động của bạn trộn với tính ngẫu nhiên của máy tính này."})}</span></div>

 ${S.src==='dice'?`<details class="dice"><summary>${T('Check it on another offline computer','在另一台離線電腦上核對',{hans:"在另一台离线电脑上核对",es:"Compruébala en otra computadora sin conexión",pt:"Confira em outro computador offline",fr:"Vérifiez-la sur un autre ordinateur hors ligne",de:"Auf einem anderen Offline-Computer prüfen",it:"Verificalo su un altro computer offline",ja:"別のオフラインのコンピューターで確認する",ko:"다른 오프라인 컴퓨터에서 확인하기",ru:"Проверьте на другом офлайн-компьютере",tr:"Başka bir çevrimdışı bilgisayarda kontrol edin",id:"Periksa di komputer offline lain",vi:"Kiểm tra nó trên một máy tính ngoại tuyến khác"})}</summary><ol><li>${T(`Run <code>printf '%s' ROLLS | sha256sum</code> with your rolls in place of ROLLS.`,`執行 <code>printf '%s' ROLLS | sha256sum</code>，把 ROLLS 換成你的骰子結果。`,{hans:`运行 \u003ccode>printf '%s' ROLLS | sha256sum\u003c/code>，并把 ROLLS 替换为你的掷骰结果。`,es:`Ejecuta \u003ccode>printf '%s' ROLLS | sha256sum\u003c/code> con tus tiradas en lugar de ROLLS.`,pt:`Execute \u003ccode>printf '%s' ROLLS | sha256sum\u003c/code> com seus lançamentos no lugar de ROLLS.`,fr:`Exécutez \u003ccode>printf '%s' ROLLS | sha256sum\u003c/code> en remplaçant ROLLS par vos lancers.`,de:`Führe \u003ccode>printf '%s' ROLLS | sha256sum\u003c/code> aus, mit deinen Würfen anstelle von ROLLS.`,it:`Esegui \u003ccode>printf '%s' ROLLS | sha256sum\u003c/code> sostituendo ROLLS con i tuoi lanci.`,ja:`ROLLS をあなたのサイコロの結果に置き換えて、\u003ccode>printf '%s' ROLLS | sha256sum\u003c/code> を実行します。`,ko:`ROLLS 자리에 주사위 결과를 넣어 \u003ccode>printf '%s' ROLLS | sha256sum\u003c/code>을 실행하세요.`,ru:`Выполните \u003ccode>printf '%s' ROLLS | sha256sum\u003c/code>, подставив вместо ROLLS результаты своих бросков.`,tr:`ROLLS yerine kendi zar sonuçlarınızı yazarak \u003ccode>printf '%s' ROLLS | sha256sum\u003c/code> komutunu çalıştırın.`,id:`Jalankan \u003ccode>printf '%s' ROLLS | sha256sum\u003c/code> dengan hasil lemparan Anda sebagai pengganti ROLLS.`,vi:`Chạy \u003ccode>printf '%s' ROLLS | sha256sum\u003c/code> với kết quả gieo của bạn thay cho ROLLS.`})}</li><li>${T('It must print','結果必須是',{hans:"输出必须是",es:"Debe mostrar",pt:"O resultado deve ser",fr:"Le résultat doit être",de:"Die Ausgabe muss lauten",it:"Il risultato deve essere",ja:"出力は次と一致しなければなりません：",ko:"출력 결과는 다음과 같아야 합니다:",ru:"Команда должна вывести",tr:"Çıktı şu olmalı:",id:"Hasilnya harus berupa",vi:"Kết quả phải là"})} <code class="ent notranslate" translate="no">${S.ent}</code></li><li>${T('Those 32 bytes are your seed; the 24 words are the same bytes in BIP-39 form.','這 32 個位元組就是你的種子；24 個字是同一組位元組的 BIP-39 形式。',{hans:"这 32 个字节就是你的种子；24 个单词是同样这些字节的 BIP-39 形式。",es:"Esos 32 bytes son tu semilla; las 24 palabras son los mismos bytes en formato BIP-39.",pt:"Esses 32 bytes são sua semente; as 24 palavras são os mesmos bytes no formato BIP-39.",fr:"Ces 32 octets sont votre graine ; les 24 mots sont les mêmes octets au format BIP-39.",de:"Diese 32 Bytes sind dein Seed; die 24 Wörter sind dieselben Bytes im BIP-39-Format.",it:"Quei 32 byte sono il tuo seed; le 24 parole sono gli stessi byte in formato BIP-39.",ja:"この 32 バイトがあなたのシードです。24 個の単語は、同じバイト列を BIP-39 形式で表したものです。",ko:"이 32바이트가 시드이며, 24개 단어는 같은 바이트를 BIP-39 형식으로 나타낸 것입니다.",ru:"Эти 32 байта и есть ваша сид-фраза; 24 слова — те же байты в формате BIP-39.",tr:"Bu 32 bayt sizin tohumunuzdur; 24 kelime, aynı baytların BIP-39 biçimidir.",id:"32 byte itu adalah seed Anda; 24 kata tersebut adalah byte yang sama dalam bentuk BIP-39.",vi:"32 byte đó là hạt giống của bạn; 24 từ chính là các byte đó ở dạng BIP-39."})}</li></ol></details>`:''}

 ${checks('sA',[T('I wrote all 24 words on paper, in order.','我已把 24 個字依序寫在紙上。',{hans:"我已把全部 24 个单词按顺序写在纸上。",es:"He escrito las 24 palabras en papel, en orden.",pt:"Escrevi as 24 palavras no papel, em ordem.",fr:"J’ai écrit les 24 mots sur papier, dans l’ordre.",de:"Ich habe alle 24 Wörter der Reihe nach auf Papier geschrieben.",it:"Ho scritto tutte le 24 parole su carta, in ordine.",ja:"24 個の単語をすべて順番どおりに紙に書きました。",ko:"24개 단어를 모두 순서대로 종이에 적었습니다.",ru:"Все 24 слова записаны на бумаге по порядку.",tr:"24 kelimenin hepsini sırasıyla kâğıda yazdım.",id:"Saya sudah menulis ke-24 kata di kertas, secara berurutan.",vi:"Tôi đã viết cả 24 từ lên giấy, theo thứ tự."}),T('I understand that anyone with my seed, or with both parts of an unused cheque, can move my coins, and that losing the seed and the book together loses the account.','我明白任何人拿到我的種子，或同時拿到一張未用支票的兩部分，就能動用；種子和簿子同時遺失，帳戶就無法挽回。',{hans:"我明白：任何人拿到我的种子，或同时拿到一张未用支票的两个部分，都可以转移我的币；同时丢失种子和支票簿，就会失去这个账户。",es:"Entiendo que cualquiera que tenga mi semilla, o las dos partes de un cheque sin usar, puede mover mis monedas, y que perder la semilla y el talonario a la vez supone perder la cuenta.",pt:"Entendo que qualquer pessoa com minha semente, ou com as duas partes de um cheque não usado, pode mover minhas moedas, e que perder a semente e o talão juntos significa perder a conta.",fr:"Je comprends que quiconque possède ma graine, ou les deux parties d’un chèque inutilisé, peut transférer mes pièces, et que perdre la graine et le carnet ensemble fait perdre le compte.",de:"Mir ist klar, dass jeder mit meinem Seed oder mit beiden Teilen eines unbenutzten Schecks meine Coins bewegen kann und dass ich das Konto verliere, wenn ich Seed und Scheckheft zusammen verliere.",it:"Capisco che chiunque abbia il mio seed, o entrambe le parti di un assegno non usato, può muovere le mie monete, e che perdere insieme il seed e il libretto significa perdere l'account.",ja:"私のシード、または未使用の小切手の両方のパートを持つ人なら誰でも私のコインを動かせること、そしてシードと小切手帳を一緒になくすとアカウントを失うことを理解しています。",ko:"제 시드를 가진 사람, 또는 사용하지 않은 수표의 두 부분을 모두 가진 사람은 누구나 제 코인을 옮길 수 있으며, 시드와 수표책을 함께 잃으면 계정을 잃는다는 것을 이해합니다.",ru:"Я понимаю, что любой, у кого есть моя сид-фраза или обе части неиспользованного чека, может перевести мои монеты, а потеря сид-фразы вместе с книжкой означает потерю аккаунта.",tr:"Tohumuma veya kullanılmamış bir çekin iki bölümüne sahip olan herkesin coin'lerimi taşıyabileceğini ve tohumu ile defteri birlikte kaybetmenin hesabı kaybettireceğini anlıyorum.",id:"Saya memahami bahwa siapa pun yang memegang seed saya, atau kedua bagian dari cek yang belum terpakai, dapat memindahkan koin saya, dan bahwa kehilangan seed dan buku bersamaan berarti kehilangan akun.",vi:"Tôi hiểu rằng bất kỳ ai có hạt giống của tôi, hoặc có cả hai phần của một tờ séc chưa dùng, đều có thể chuyển coin của tôi đi, và mất cả hạt giống lẫn sổ là mất tài khoản."})])}

 ${S.src==='dice'?`<p class="hint">${T(`Roll a fair six-sided die ${ROLLS} times and type each result, 1 to 6. ${ROLLS} rolls carry 256 bits. The seed is the SHA-256 of your rolls, the same method SeedSigner uses, so you can check it on another computer.`,`擲一顆公正的六面骰 ${ROLLS} 次，每次輸入結果 1 到 6。${ROLLS} 次共 256 位元。種子是骰子結果的 SHA-256，與 SeedSigner 相同，可以在另一台電腦上核對。`,{hans:`掷一颗均匀的六面骰子 ${ROLLS} 次，每次输入结果（1 到 6）。${ROLLS} 次掷骰共携带 256 比特。种子是你掷骰结果的 SHA-256，与 SeedSigner 使用的方法相同，因此你可以在另一台电脑上核对。`,es:`Lanza un dado no trucado de seis caras ${ROLLS} veces y escribe cada resultado, del 1 al 6. ${ROLLS} tiradas aportan 256 bits. La semilla es el SHA-256 de tus tiradas, el mismo método que usa SeedSigner, así que puedes comprobarla en otra computadora.`,pt:`Lance um dado não viciado de seis faces ${ROLLS} vezes e digite cada resultado, de 1 a 6. ${ROLLS} lançamentos contêm 256 bits. A semente é o SHA-256 dos seus lançamentos, o mesmo método que o SeedSigner usa, então você pode conferi-la em outro computador.`,fr:`Lancez un dé équilibré à six faces ${ROLLS} fois et tapez chaque résultat, de 1 à 6. ${ROLLS} lancers contiennent 256 bits. La graine est le SHA-256 de vos lancers, selon la même méthode que SeedSigner, ce qui vous permet de la vérifier sur un autre ordinateur.`,de:`Wirf einen fairen sechsseitigen Würfel ${ROLLS}-mal und tippe jedes Ergebnis ein, 1 bis 6. ${ROLLS} Würfe enthalten 256 Bit. Der Seed ist der SHA-256-Hash deiner Würfe, dieselbe Methode wie bei SeedSigner, sodass du ihn auf einem anderen Computer prüfen kannst.`,it:`Lancia ${ROLLS} volte un dado a sei facce non truccato e digita ogni risultato, da 1 a 6. ${ROLLS} lanci contengono 256 bit. Il seed è lo SHA-256 dei tuoi lanci, lo stesso metodo usato da SeedSigner, così puoi verificarlo su un altro computer.`,ja:`公正な六面のサイコロを ${ROLLS} 回振り、毎回の結果を 1 から 6 で入力してください。${ROLLS} 回で 256 ビットになります。シードはサイコロの結果の SHA-256 で、SeedSigner と同じ方法なので、別のコンピューターで確認できます。`,ko:`공정한 육면체 주사위를 ${ROLLS}번 굴리고 각 결과를 1부터 6까지 입력하세요. ${ROLLS}번 굴리면 256비트가 됩니다. 시드는 굴린 결과의 SHA-256이며, SeedSigner와 같은 방식이므로 다른 컴퓨터에서 확인할 수 있습니다.`,ru:`Бросьте честный шестигранный кубик ${ROLLS} раз и вводите каждый результат, от 1 до 6. ${ROLLS} бросков дают 256 бит. Сид-фраза — это SHA-256 от ваших бросков, тот же метод, что использует SeedSigner, поэтому её можно проверить на другом компьютере.`,tr:`Hilesiz, altı yüzlü bir zarı ${ROLLS} kez atın ve her sonucu (1 ile 6 arası) yazın. ${ROLLS} atış 256 bit taşır. Tohum, zar sonuçlarınızın SHA-256'sıdır; bu, SeedSigner'ın kullandığı yöntemle aynıdır, böylece onu başka bir bilgisayarda kontrol edebilirsiniz.`,id:`Lempar dadu enam sisi yang adil sebanyak ${ROLLS} kali dan ketik setiap hasilnya, 1 sampai 6. ${ROLLS} lemparan memuat 256 bit. Seed adalah SHA-256 dari lemparan Anda, metode yang sama dengan yang dipakai SeedSigner, sehingga Anda dapat memeriksanya di komputer lain.`,vi:`Gieo một con xúc xắc sáu mặt cân đối ${ROLLS} lần và gõ từng kết quả, từ 1 đến 6. ${ROLLS} lần gieo mang 256 bit. Hạt giống là SHA-256 của các lần gieo, cùng phương pháp SeedSigner dùng, nên bạn có thể kiểm tra nó trên một máy tính khác.`})}</p>

 :`<p class="hint">${T('Move your mouse, or drag a finger, around the box until the bar fills. Your movements are mixed with this computer’s own randomness, so the seed is never weaker than the computer alone.','在框內移動滑鼠或用手指拖曳，直到進度條填滿。你的移動軌跡會和這台電腦本身的亂數混合，種子絕不會比電腦單獨產生的更弱。',{hans:"在框内移动鼠标或拖动手指，直到进度条填满。你的移动轨迹会与这台电脑自身的随机数混合，因此种子绝不会比电脑单独生成的更弱。",es:"Mueve el ratón, o arrastra un dedo, por el recuadro hasta que se llene la barra. Tus movimientos se mezclan con la propia aleatoriedad de esta computadora, así que la semilla nunca es más débil que la computadora por sí sola.",pt:"Mova o mouse, ou arraste um dedo, pelo quadro até a barra encher. Seus movimentos são misturados com a própria aleatoriedade deste computador, então a semente nunca é mais fraca do que o computador sozinho.",fr:"Déplacez votre souris, ou faites glisser un doigt, dans le cadre jusqu’à ce que la barre se remplisse. Vos mouvements sont mélangés à l’aléa propre de cet ordinateur, si bien que la graine n’est jamais plus faible que l’ordinateur seul.",de:"Bewege die Maus oder zieh einen Finger im Feld herum, bis der Balken voll ist. Deine Bewegungen werden mit dem eigenen Zufall dieses Computers gemischt, sodass der Seed nie schwächer ist als der Computer allein.",it:"Muovi il mouse, o trascina un dito, nel riquadro finché la barra non si riempie. I tuoi movimenti vengono mescolati con la casualità propria di questo computer, quindi il seed non è mai più debole del solo computer.",ja:"バーがいっぱいになるまで、枠の中でマウスを動かすか指でなぞってください。あなたの動きはこのコンピューター自身の乱数と混ぜ合わされるので、シードがコンピューター単独のものより弱くなることはありません。",ko:"막대가 다 찰 때까지 상자 안에서 마우스를 움직이거나 손가락으로 끌어 주세요. 움직임은 이 컴퓨터 자체의 무작위성과 섞이므로, 시드가 컴퓨터 혼자 만든 것보다 약해지는 일은 없습니다.",ru:"Двигайте мышью или водите пальцем по полю, пока полоса не заполнится. Ваши движения смешиваются с собственной случайностью этого компьютера, поэтому сид-фраза никогда не будет слабее, чем если бы её создал один компьютер.",tr:"Çubuk dolana kadar farenizi kutunun içinde gezdirin veya parmağınızı sürükleyin. Hareketleriniz bu bilgisayarın kendi rastgeleliğiyle karıştırılır; böylece tohum hiçbir zaman yalnızca bilgisayarın ürettiğinden daha zayıf olmaz.",id:"Gerakkan mouse, atau seret jari, di dalam kotak sampai bilahnya penuh. Gerakan Anda dicampur dengan keacakan komputer ini sendiri, sehingga seed tidak pernah lebih lemah daripada keacakan komputer itu saja.",vi:"Di chuột, hoặc kéo ngón tay, quanh khung cho đến khi thanh đầy. Chuyển động của bạn được trộn với tính ngẫu nhiên riêng của máy tính này, nên hạt giống không bao giờ yếu hơn so với chỉ dùng máy tính."})}</p>
  <div class="pad" id="pad"><span class="icon">gesture</span><b id="mcnt">${Math.min(100,Math.round(S.moves/MOVES*100))}%</b></div>
  <div class="meter"><i id="mbar" style="width:${Math.min(100,S.moves/MOVES*100)}%"></i></div>
  ${navRow(false,T('Keep moving to fill the bar','繼續移動直到填滿',{hans:"继续移动以填满进度条",es:"Sigue moviendo para llenar la barra",pt:"Continue movendo para encher a barra",fr:"Continuez vos mouvements pour remplir la barre",de:"Weiter bewegen, um den Balken zu füllen",it:"Continua a muoverti per riempire la barra",ja:"バーがいっぱいになるまで動かし続けてください",ko:"막대가 찰 때까지 계속 움직이세요",ru:"Продолжайте двигать, чтобы заполнить полосу",tr:"Çubuğu doldurmak için hareket etmeye devam edin",id:"Terus bergerak untuk mengisi bilah",vi:"Tiếp tục di chuyển để làm đầy thanh"}))}`}`}`,
confirmA:()=>`<h1>${T('Confirm your seed','確認你的種子',{hans:"确认你的种子",es:"Confirma tu semilla",pt:"Confirme sua semente",fr:"Confirmez votre graine",de:"Seed bestätigen",it:"Conferma il tuo seed",ja:"シードを確認する",ko:"시드 확인",ru:"Подтвердите сид-фразу",tr:"Tohumunuzu onaylayın",id:"Konfirmasi seed Anda",vi:"Xác nhận hạt giống của bạn"})}</h1><p class="sub">${T('Pick the right word from your paper.','從你的紙上找出正確的字。',{hans:"从你的纸上选出正确的单词。",es:"Elige la palabra correcta de tu papel.",pt:"Escolha a palavra certa, conforme o seu papel.",fr:"Choisissez le bon mot sur votre papier.",de:"Wähle das richtige Wort von deinem Papier.",it:"Scegli la parola giusta dal tuo foglio.",ja:"紙を見て正しい単語を選んでください。",ko:"종이에서 맞는 단어를 고르세요.",ru:"Выберите правильное слово со своего листа.",tr:"Kâğıdınızdaki doğru kelimeyi seçin.",id:"Pilih kata yang benar dari kertas Anda.",vi:"Chọn từ đúng theo tờ giấy của bạn."})}</p>${quiz(S.seed||[],'A',QA)}${navRow(quizDone('A',QA))}`,
printA:()=>`${offline()}<h1>${T('Print part A','印出 A 部分',{hans:"打印 A 部分",es:"Imprime la parte A",pt:"Imprimir a parte A",fr:"Imprimez la partie A",de:"Teil A drucken",it:"Stampa la parte A",ja:"パート A を印刷",ko:"A 부분 인쇄",ru:"Напечатайте часть A",tr:"A bölümünü basın",id:"Cetak bagian A",vi:"In phần A"})}</h1>
 <div class="warn r"><span class="icon">print_disabled</span><span>${T('USB cable only, printer Wi-Fi off, no cloud printing. Switch the printer off when done so its memory clears.','只用 USB 線、關閉印表機 Wi-Fi、不用雲端列印。完成後關掉印表機電源讓記憶體清空。',{hans:"只用 USB 线，关闭打印机的 Wi-Fi，不用云打印。打印完成后关闭打印机电源，以清空其内存。",es:"Solo cable USB, Wi-Fi de la impresora desactivado, sin impresión en la nube. Apaga la impresora al terminar para que se borre su memoria.",pt:"Só cabo USB, Wi-Fi da impressora desligado, sem impressão na nuvem. Desligue a impressora ao terminar para limpar a memória dela.",fr:"Câble USB uniquement, Wi-Fi de l’imprimante coupé, pas d’impression dans le cloud. Éteignez l’imprimante à la fin pour que sa mémoire s’efface.",de:"Nur USB-Kabel, WLAN des Druckers aus, kein Cloud-Druck. Schalte den Drucker danach aus, damit sein Speicher gelöscht wird.",it:"Solo cavo USB, Wi-Fi della stampante spento, niente stampa cloud. Alla fine spegni la stampante, così la sua memoria si svuota.",ja:"USB ケーブルのみ、プリンターの Wi-Fi はオフ、クラウド印刷は使用しないこと。終わったら、メモリが消えるようにプリンターの電源を切ります。",ko:"USB 케이블만 사용하고, 프린터 Wi-Fi는 끄고, 클라우드 인쇄는 쓰지 마세요. 끝나면 메모리가 지워지도록 프린터 전원을 끄세요.",ru:"Только USB-кабель, Wi-Fi принтера выключен, без облачной печати. После печати выключите принтер, чтобы очистить его память.",tr:"Yalnızca USB kablosu, yazıcının Wi-Fi'ı kapalı, bulut baskı yok. Belleğinin temizlenmesi için iş bittiğinde yazıcıyı kapatın.",id:"Hanya kabel USB, Wi-Fi printer mati, tanpa pencetakan cloud. Matikan printer setelah selesai agar memorinya terhapus.",vi:"Chỉ dùng cáp USB, tắt Wi-Fi của máy in, không in qua đám mây. Tắt máy in khi xong để bộ nhớ của nó được xóa."})}</span></div>
 <p class="sub">${T(`The computer derives every cell from your seed and saves part A, the recipient columns of cheques 1 to ${S.last}, as a file. Open it, print it, then delete it. Part B comes next, as a separate print run.`,`電腦由你的種子導出每一格，把 A 部分（第 1 到 ${S.last} 號支票的收件帳號欄）存成檔案。打開、列印，然後刪除。B 部分接著分開列印。`,{hans:`电脑根据你的种子派生出每一个格子，并把 A 部分（支票 1 到 ${S.last} 的接收方列）保存为文件。打开它、打印，然后删除。接下来单独打印 B 部分。`,es:`La computadora deriva cada casilla de tu semilla y guarda la parte A, las columnas del destinatario de los cheques 1 a ${S.last}, como archivo. Ábrelo, imprímelo y luego bórralo. La parte B viene después, en una tirada de impresión aparte.`,pt:`O computador deriva cada célula da sua semente e salva a parte A, as colunas do destinatário dos cheques 1 a ${S.last}, como um arquivo. Abra-o, imprima-o e depois apague-o. A parte B vem a seguir, em uma impressão separada.`,fr:`L’ordinateur dérive chaque case à partir de votre graine et enregistre la partie A, les colonnes du destinataire des chèques 1 à ${S.last}, dans un fichier. Ouvrez-le, imprimez-le, puis supprimez-le. La partie B suit, en un tirage séparé.`,de:`Der Computer leitet jede Zelle aus deinem Seed ab und speichert Teil A, die Empfängerspalten der Schecks 1 bis ${S.last}, als Datei. Öffne sie, drucke sie und lösche sie dann. Teil B folgt als getrennter Druckvorgang.`,it:`Il computer deriva ogni casella dal tuo seed e salva in un file la parte A, cioè le colonne del destinatario degli assegni da 1 a ${S.last}. Aprilo, stampalo, poi eliminalo. Segue la parte B, in una stampa separata.`,ja:`コンピューターはシードからすべてのマスを導出し、パート A（小切手 1 から ${S.last} の受取人の列）をファイルとして保存します。開いて印刷し、その後削除してください。続いてパート B を別の印刷として行います。`,ko:`컴퓨터가 시드로 모든 칸을 도출하고, A 부분(수표 1번부터 ${S.last}번까지의 수신인 열)을 파일로 저장합니다. 파일을 열어 인쇄한 뒤 삭제하세요. B 부분은 그다음에 별도로 인쇄합니다.`,ru:`Компьютер вычисляет каждую ячейку из вашей сид-фразы и сохраняет часть A — столбцы получателя чеков с 1 по ${S.last} — в файл. Откройте его, напечатайте, затем удалите. Далее идёт часть B, отдельной печатью.`,tr:`Bilgisayar her hücreyi tohumunuzdan türetir ve A bölümünü, yani 1 ile ${S.last} numaralı çeklerin alıcı sütunlarını bir dosya olarak kaydeder. Dosyayı açın, basın, sonra silin. Sırada ayrı bir baskı olarak B bölümü var.`,id:`Komputer menurunkan setiap kotak dari seed Anda dan menyimpan bagian A, yaitu kolom penerima dari cek 1 sampai ${S.last}, sebagai berkas. Buka, cetak, lalu hapus. Bagian B menyusul, sebagai cetakan terpisah.`,vi:`Máy tính tạo mọi ô từ hạt giống của bạn và lưu phần A, các cột người nhận của séc 1 đến ${S.last}, thành một tệp. Mở nó, in nó, rồi xóa nó. Tiếp theo là phần B, trong một lần in riêng.`})}</p>
 ${part('A',S.printedA)}
 <div class="warn g" ${S.printedA?'':'hidden'}><span class="icon">check_circle</span><span>${T('Part A saved. Print it, delete the file and empty the trash. Take the printout out of the room before you make part B.','A 部分已存檔。印出後刪除檔案並清空垃圾桶。做 B 部分之前，先把印好的紙拿出房間。',{hans:"A 部分已保存。打印出来后，删除文件并清空回收站。在制作 B 部分之前，先把打印件拿出房间。",es:"Parte A guardada. Imprímela, borra el archivo y vacía la papelera. Saca la copia impresa de la habitación antes de crear la parte B.",pt:"Parte A salva. Imprima-a, apague o arquivo e esvazie a lixeira. Leve a impressão para fora da sala antes de fazer a parte B.",fr:"Partie A enregistrée. Imprimez-la, supprimez le fichier et videz la corbeille. Sortez le tirage de la pièce avant de créer la partie B.",de:"Teil A gespeichert. Drucke ihn, lösche die Datei und leere den Papierkorb. Bring den Ausdruck aus dem Raum, bevor du Teil B erstellst.",it:"Parte A salvata. Stampala, elimina il file e svuota il cestino. Porta la stampa fuori dalla stanza prima di creare la parte B.",ja:"パート A を保存しました。印刷してからファイルを削除し、ごみ箱を空にしてください。パート B を作る前に、印刷物を部屋の外に持ち出してください。",ko:"A 부분이 저장되었습니다. 인쇄한 뒤 파일을 삭제하고 휴지통을 비우세요. B 부분을 만들기 전에 인쇄물을 방 밖으로 가져가세요.",ru:"Часть A сохранена. Напечатайте её, удалите файл и очистите корзину. Прежде чем создавать часть B, вынесите распечатку из комнаты.",tr:"A bölümü kaydedildi. Basın, dosyayı silin ve çöp kutusunu boşaltın. B bölümünü oluşturmadan önce çıktıyı odadan çıkarın.",id:"Bagian A tersimpan. Cetak, hapus berkasnya, dan kosongkan tempat sampah. Bawa hasil cetakan keluar ruangan sebelum Anda membuat bagian B.",vi:"Đã lưu phần A. In nó, xóa tệp và dọn sạch thùng rác. Mang bản in ra khỏi phòng trước khi bạn làm phần B."})}</span></div>

domainB:()=>`${img('printer')}<h1>${T('Print part B','印出 B 部分',{hans:"打印 B 部分",es:"Imprime la parte B",pt:"Imprimir a parte B",fr:"Imprimez la partie B",de:"Teil B drucken",it:"Stampa la parte B",ja:"パート B を印刷",ko:"B 부분 인쇄",ru:"Напечатайте часть B",tr:"B bölümünü basın",id:"Cetak bagian B",vi:"In phần B"})}</h1>
 <p class="sub">${T(`Same computer, same seed: now save part B, the amount, exponent and fee columns of cheques 1 to ${S.last}. Use a different printer if you can.`,`同一台電腦、同一組種子：現在存下 B 部分，也就是第 1 到 ${S.last} 號支票的金額、指數和手續費欄。可以的話換一台印表機。`,{hans:`同一台电脑、同一组种子：现在保存 B 部分，即支票 1 到 ${S.last} 的金额、指数和手续费列。如有条件，请换一台打印机。`,es:`Misma computadora, misma semilla: ahora guarda la parte B, las columnas de cantidad, exponente y comisión de los cheques 1 a ${S.last}. Usa otra impresora si puedes.`,pt:`Mesmo computador, mesma semente: agora salve a parte B, as colunas de valor, expoente e taxa dos cheques 1 a ${S.last}. Use outra impressora, se puder.`,fr:`Même ordinateur, même graine : enregistrez maintenant la partie B, les colonnes du montant, de l’exposant et des frais des chèques 1 à ${S.last}. Utilisez une autre imprimante si vous le pouvez.`,de:`Gleicher Computer, gleicher Seed: Speichere jetzt Teil B, die Spalten für Betrag, Exponent und Gebühr der Schecks 1 bis ${S.last}. Verwende, wenn möglich, einen anderen Drucker.`,it:`Stesso computer, stesso seed: ora salva la parte B, cioè le colonne di importo, esponente e commissione degli assegni da 1 a ${S.last}. Usa una stampante diversa, se puoi.`,ja:`同じコンピューター、同じシードで、今度はパート B（小切手 1 から ${S.last} の数量・指数・手数料の列）を保存します。できれば別のプリンターを使ってください。`,ko:`같은 컴퓨터, 같은 시드: 이제 B 부분, 즉 수표 1번부터 ${S.last}번까지의 수량, 지수, 수수료 열을 저장하세요. 가능하면 다른 프린터를 사용하세요.`,ru:`Тот же компьютер, та же сид-фраза: теперь сохраните часть B — столбцы суммы, экспоненты и комиссии чеков с 1 по ${S.last}. По возможности используйте другой принтер.`,tr:`Aynı bilgisayar, aynı tohum: şimdi B bölümünü, yani 1 ile ${S.last} numaralı çeklerin miktar, üs ve ücret sütunlarını kaydedin. Mümkünse farklı bir yazıcı kullanın.`,id:`Komputer yang sama, seed yang sama: sekarang simpan bagian B, yaitu kolom jumlah, eksponen, dan biaya dari cek 1 sampai ${S.last}. Gunakan printer lain jika bisa.`,vi:`Cùng máy tính, cùng hạt giống: giờ hãy lưu phần B, các cột số lượng, số mũ và phí của séc 1 đến ${S.last}. Dùng một máy in khác nếu có thể.`})}</p>

 ${S.printedB?`<div class="regf"><span class="icon">description</span><span><b>${T('Save the registration file','儲存登記檔',{hans:"保存注册文件",es:"Guardar el archivo de registro",pt:"Salvar o arquivo de registro",fr:"Sauvegarder le fichier d’enregistrement",de:"Registrierungsdatei speichern",it:"Salva il file di registrazione",ja:"登録ファイルを保存",ko:"등록 파일 저장",ru:"Сохраните файл регистрации",tr:"Kayıt dosyasını kaydedin",id:"Simpan berkas pendaftaran",vi:"Lưu tệp đăng ký"})}</b><span class="d">${T('It holds only public hashes and your lookup code, never the seed. Carry it to any online computer to register.','檔案只有公開的雜湊值和你的查詢碼，從不包含種子。帶到任何連網的電腦就能登記。',{hans:"它只包含公开的哈希值和你的查询码，绝不包含种子。把它带到任何联网的电脑上即可注册。",es:"Solo contiene hashes públicos y tu código de consulta, nunca la semilla. Llévalo a cualquier computadora conectada para registrar.",pt:"Ele contém apenas hashes públicos e o seu código de consulta, nunca a semente. Leve-o a qualquer computador online para fazer o registro.",fr:"Il ne contient que des hachages publics et votre code de recherche, jamais la graine. Apportez-le sur n’importe quel ordinateur connecté pour enregistrer le carnet.",de:"Sie enthält nur öffentliche Hashes und deinen Suchcode, nie den Seed. Bring sie zu einem beliebigen Online-Computer, um zu registrieren.",it:"Contiene solo hash pubblici e il tuo codice di ricerca, mai il seed. Portalo su qualsiasi computer online per registrare.",ja:"含まれるのは公開ハッシュと照会コードだけで、シードは決して含まれません。オンラインのコンピューターならどれでも、持っていけば登録できます。",ko:"공개 해시와 조회 코드만 담겨 있으며, 시드는 절대 들어 있지 않습니다. 온라인 컴퓨터라면 어디로든 가져가서 등록하세요.",ru:"Он содержит только публичные хеши и ваш код поиска, но никогда не сид-фразу. Перенесите его на любой компьютер с доступом в интернет, чтобы зарегистрироваться.",tr:"Yalnızca açık hash'leri ve sorgu kodunuzu içerir, tohumu asla içermez. Kaydolmak için onu çevrimiçi herhangi bir bilgisayara götürün.",id:"Berkas ini hanya berisi hash publik dan kode pencarian Anda, tidak pernah seed. Bawa ke komputer online mana saja untuk mendaftar.",vi:"Tệp chỉ chứa các mã băm công khai và mã tra cứu của bạn, không bao giờ chứa hạt giống. Mang nó tới bất kỳ máy tính trực tuyến nào để đăng ký."})}</span></span><button class="btn ${S.regSaved?'ghost':'primary'}" data-act="savereg">${S.regSaved?T('Saved','已儲存',{hans:"已保存",es:"Guardado",pt:"Salvo",fr:"Sauvegardé",de:"Gespeichert",it:"Salvato",ja:"保存しました",ko:"저장됨",ru:"Сохранено",tr:"Kaydedildi",id:"Tersimpan",vi:"Đã lưu"}):T('Save file','儲存檔案',{hans:"保存文件",es:"Guardar archivo",pt:"Salvar arquivo",fr:"Sauvegarder le fichier",de:"Datei speichern",it:"Salva file",ja:"ファイルを保存",ko:"파일 저장",ru:"Сохранить файл",tr:"Dosyayı kaydet",id:"Simpan berkas",vi:"Lưu tệp"})}</button></div>`:''}
 ${S.printedB&&S.regSaved?checks('sB',[T('Part B is printed and stored in a different place from part A.','B 部分已印好，並與 A 部分存放在不同地方。',{hans:"B 部分已打印，并与 A 部分存放在不同的地方。",es:"La parte B está impresa y guardada en un lugar distinto al de la parte A.",pt:"A parte B está impressa e guardada em um lugar diferente da parte A.",fr:"La partie B est imprimée et rangée dans un autre lieu que la partie A.",de:"Teil B ist gedruckt und an einem anderen Ort als Teil A aufbewahrt.",it:"La parte B è stampata e conservata in un luogo diverso dalla parte A.",ja:"パート B を印刷し、パート A とは別の場所に保管しました。",ko:"B 부분을 인쇄했고 A 부분과 다른 곳에 보관했습니다.",ru:"Часть B напечатана и хранится в другом месте, отдельно от части A.",tr:"B bölümü basıldı ve A bölümünden farklı bir yerde saklanıyor.",id:"Bagian B sudah dicetak dan disimpan di tempat yang berbeda dari bagian A.",vi:"Phần B đã được in và cất ở một nơi khác với phần A."}),T('I deleted both print files, emptied the trash, and switched the computer and printers off.','我已刪除兩個列印檔、清空垃圾桶，並關掉電腦和印表機。',{hans:"我已删除两个打印文件、清空回收站，并关闭了电脑和打印机。",es:"He borrado ambos archivos de impresión, he vaciado la papelera y he apagado la computadora y las impresoras.",pt:"Apaguei os dois arquivos de impressão, esvaziei a lixeira e desliguei o computador e as impressoras.",fr:"J’ai supprimé les deux fichiers d’impression, vidé la corbeille, et éteint l’ordinateur et les imprimantes.",de:"Ich habe beide Druckdateien gelöscht, den Papierkorb geleert und Computer und Drucker ausgeschaltet.",it:"Ho eliminato entrambi i file di stampa, svuotato il cestino e spento computer e stampanti.",ja:"両方の印刷ファイルを削除し、ごみ箱を空にして、コンピューターとプリンターの電源を切りました。",ko:"두 인쇄 파일을 모두 삭제하고, 휴지통을 비우고, 컴퓨터와 프린터를 껐습니다.",ru:"Оба файла для печати удалены, корзина очищена, компьютер и принтеры выключены.",tr:"İki baskı dosyasını da sildim, çöp kutusunu boşalttım, bilgisayarı ve yazıcıları kapattım.",id:"Saya sudah menghapus kedua berkas cetak, mengosongkan tempat sampah, dan mematikan komputer serta printer.",vi:"Tôi đã xóa cả hai tệp in, dọn sạch thùng rác, và tắt máy tính lẫn các máy in."})]):''}

register:()=>`${img('register')}<h1>${T('Register the book','登記簿子',{hans:"注册支票簿",es:"Registra el talonario",pt:"Registrar o talão",fr:"Enregistrez le carnet",de:"Scheckheft registrieren",it:"Registra il libretto",ja:"小切手帳を登録する",ko:"수표책 등록",ru:"Зарегистрируйте книжку",tr:"Defteri kaydedin",id:"Daftarkan buku",vi:"Đăng ký sổ"})}</h1><p class="sub">${T('Any online computer can do this. It only sees the public registration file.','任何連網的電腦都能做這一步，它只看得到公開的登記檔。',{hans:"任何联网的电脑都能完成这一步。它只能看到公开的注册文件。",es:"Cualquier computadora conectada puede hacer esto. Solo ve el archivo de registro público.",pt:"Qualquer computador online pode fazer isso. Ele só vê o arquivo de registro público.",fr:"N’importe quel ordinateur connecté peut le faire. Il ne voit que le fichier d’enregistrement public.",de:"Das kann jeder Online-Computer. Er sieht nur die öffentliche Registrierungsdatei.",it:"Qualsiasi computer online può farlo. Vede solo il file di registrazione pubblico.",ja:"この手順はオンラインのコンピューターならどれでも行えます。見えるのは公開の登録ファイルだけです。",ko:"온라인 컴퓨터라면 어떤 것이든 이 작업을 할 수 있습니다. 컴퓨터가 보는 것은 공개 등록 파일뿐입니다.",ru:"Это может сделать любой компьютер с доступом в интернет. Он видит только публичный файл регистрации.",tr:"Bunu çevrimiçi herhangi bir bilgisayar yapabilir. Yalnızca açık kayıt dosyasını görür.",id:"Komputer online mana saja bisa melakukan ini. Komputer itu hanya melihat berkas pendaftaran publik.",vi:"Bất kỳ máy tính trực tuyến nào cũng làm được bước này. Nó chỉ thấy tệp đăng ký công khai."})}</p>
 ${S.sent?(S.reg.honesty?lookupPanel(true):`<div class="warn g"><span class="icon">check_circle</span><span>${T(`Cheques ${window.bcEsc(S.reg.first)} to ${window.bcEsc(S.reg.last)} sent. They can be used once the next block includes them; the explorer shows them under your account.`,`第 ${window.bcEsc(S.reg.first)} 到 ${window.bcEsc(S.reg.last)} 號支票已送出。下一個區塊收錄後即可使用；區塊瀏覽器會在你的帳戶下顯示。`,{hans:`第 ${window.bcEsc(S.reg.first)} 到 ${window.bcEsc(S.reg.last)} 号支票已发送。下一个区块收录后即可使用；区块浏览器会在你的账户下显示它们。`,es:`Cheques ${window.bcEsc(S.reg.first)} a ${window.bcEsc(S.reg.last)} enviados. Podrás usarlos cuando el próximo bloque los incluya; el explorador los muestra en tu cuenta.`,pt:`Cheques ${window.bcEsc(S.reg.first)} a ${window.bcEsc(S.reg.last)} enviados. Poderão ser usados quando o próximo bloco os incluir; o explorador os mostra na sua conta.`,fr:`Chèques ${window.bcEsc(S.reg.first)} à ${window.bcEsc(S.reg.last)} envoyés. Ils sont utilisables dès que le prochain bloc les inclut ; l’explorateur les affiche sous votre compte.`,de:`Schecks ${window.bcEsc(S.reg.first)} bis ${window.bcEsc(S.reg.last)} gesendet. Sie sind nutzbar, sobald der nächste Block sie enthält; der Explorer zeigt sie unter deinem Konto.`,it:`Assegni da ${window.bcEsc(S.reg.first)} a ${window.bcEsc(S.reg.last)} inviati. Potrai usarli quando il prossimo blocco li includerà; l'explorer li mostra sotto il tuo account.`,ja:`小切手 ${window.bcEsc(S.reg.first)}〜${window.bcEsc(S.reg.last)} を送信しました。次のブロックに含まれると使えます。エクスプローラーのあなたのアカウントに表示されます。`,ko:`수표 ${window.bcEsc(S.reg.first)}번부터 ${window.bcEsc(S.reg.last)}번까지 보냈습니다. 다음 블록에 포함되면 사용할 수 있으며, 탐색기의 내 계정에 표시됩니다.`,ru:`Чеки с ${window.bcEsc(S.reg.first)} по ${window.bcEsc(S.reg.last)} отправлены. Ими можно пользоваться, когда их включит следующий блок; обозреватель покажет их в вашем аккаунте.`,tr:`${window.bcEsc(S.reg.first)} ile ${window.bcEsc(S.reg.last)} numaralı çekler gönderildi. Bir sonraki blok onları içerdiğinde kullanılabilirler; gezgin bunları hesabınızın altında gösterir.`,id:`Cek ${window.bcEsc(S.reg.first)} sampai ${window.bcEsc(S.reg.last)} terkirim. Cek ini bisa dipakai setelah blok berikutnya memuatnya; penjelajah blok menampilkannya di akun Anda.`,vi:`Đã gửi séc ${window.bcEsc(S.reg.first)} đến ${window.bcEsc(S.reg.last)}. Có thể dùng khi khối tiếp theo chứa chúng; trình khám phá hiển thị chúng trong tài khoản của bạn.`})}</span></div>`):S.reg?`<div class="choices"><div class="choice fixed"><span class="icon">memory</span><span><b>${T('Proof of work','工作量證明',{hans:"工作量证明",es:"Prueba de trabajo",pt:"Prova de trabalho",fr:"Preuve de travail",de:"Proof of Work",it:"Proof of work",ja:"プルーフ・オブ・ワーク",ko:"작업 증명",ru:"Доказательство работы",tr:"İş kanıtı",id:"Proof-of-work",vi:"Bằng chứng công việc"})}</b><span class="d">${S.reg.txs.length>1?T(`About a minute or two of computing per 16 cheques: ${S.reg.txs.length} batches. No coins needed.`,`每 16 張支票約需運算一兩分鐘：共 ${S.reg.txs.length} 批。不需要幣。`,{hans:`每 16 张支票约需运算一两分钟：共 ${S.reg.txs.length} 批。不需要币。`,es:`Uno o dos minutos de cálculo por cada 16 cheques: ${S.reg.txs.length} lotes. No hacen falta monedas.`,pt:`Um ou dois minutos de cálculo a cada 16 cheques: ${S.reg.txs.length} lotes. Não é preciso ter moedas.`,fr:`Une ou deux minutes de calcul par tranche de 16 chèques : ${S.reg.txs.length} lots. Aucune pièce nécessaire.`,de:`Etwa ein bis zwei Minuten Rechenzeit pro 16 Schecks: ${S.reg.txs.length} Stapel. Keine Coins nötig.`,it:`Circa uno o due minuti di calcolo ogni 16 assegni: ${S.reg.txs.length} lotti. Non servono monete.`,ja:`小切手 16 枚ごとに一、二分ほどの計算：${S.reg.txs.length} バッチ。コインは不要です。`,ko:`수표 16장마다 한두 분 정도 계산: 묶음 ${S.reg.txs.length}개. 코인은 필요 없습니다.`,ru:`Около одной-двух минут вычислений на каждые 16 чеков: пакетов — ${S.reg.txs.length}. Монеты не нужны.`,tr:`Her 16 çek için yaklaşık bir iki dakikalık hesaplama: ${S.reg.txs.length} grup. Coin gerekmez.`,id:`Sekitar satu atau dua menit perhitungan per 16 cek: ${S.reg.txs.length} kelompok. Tidak perlu koin.`,vi:`Khoảng một hai phút tính toán cho mỗi 16 séc: ${S.reg.txs.length} đợt. Không cần coin.`}):T('A minute or two of computing on this computer covers registration. No coins needed.','這台電腦運算一兩分鐘就能完成登記，不需要幣。',{hans:"在这台电脑上计算一两分钟即可完成注册。不需要币。",es:"Uno o dos minutos de cálculo en esta computadora bastan para el registro. No hacen falta monedas.",pt:"Um ou dois minutos de cálculo neste computador bastam para o registro. Não são necessárias moedas.",fr:"Une ou deux minutes de calcul sur cet ordinateur suffisent pour l’enregistrement. Aucune pièce nécessaire.",de:"Ein, zwei Minuten Rechenzeit auf diesem Computer decken die Registrierung ab. Keine Coins nötig.",it:"Un paio di minuti di calcolo su questo computer bastano per la registrazione. Non servono monete.",ja:"このコンピューターで一、二分計算すれば登録できます。コインは必要ありません。",ko:"이 컴퓨터에서 일이 분 계산하면 등록할 수 있습니다. 코인은 필요하지 않습니다.",ru:"Регистрацию обеспечивает минута-две вычислений на этом компьютере. Монеты не нужны.",tr:"Bu bilgisayarda bir iki dakikalık hesaplama kayıt için yeterlidir. Coin gerekmez.",id:"Satu atau dua menit komputasi di komputer ini sudah cukup untuk pendaftaran. Tidak perlu koin.",vi:"Một hai phút tính toán trên máy tính này là đủ để đăng ký. Không cần coin."})}</span></span></div></div>

  ${S.flow==='more'?`<p class="hint nofile"><span class="icon">help</span>${T('No file yet? Print your cheques first: the registration file is saved with them.','還沒有檔案？請先印出支票：登記檔會和它們一起存下。',{hans:"还没有文件？请先打印支票：注册文件会和它们一起保存。",es:"¿Aún no tienes el archivo? Imprime primero tus cheques: el archivo de registro se guarda con ellos.",pt:"Ainda não tem o arquivo? Imprima seus cheques primeiro: o arquivo de registro é salvo junto com eles.",fr:"Pas encore de fichier ? Imprimez d’abord vos chèques : le fichier d’enregistrement est sauvegardé avec eux.",de:"Noch keine Datei? Druck zuerst deine Schecks: Die Registrierungsdatei wird mit ihnen gespeichert.",it:"Non hai ancora il file? Stampa prima i tuoi assegni: il file di registrazione viene salvato insieme a loro.",ja:"まだファイルがありませんか？先に小切手を印刷してください。登録ファイルは一緒に保存されます。",ko:"아직 파일이 없나요? 먼저 수표를 인쇄하세요. 등록 파일은 수표와 함께 저장됩니다.",ru:"Файла ещё нет? Сначала напечатайте чеки: файл регистрации сохраняется вместе с ними.",tr:"Henüz dosyanız yok mu? Önce çeklerinizi basın: kayıt dosyası onlarla birlikte kaydedilir.",id:"Belum punya berkas? Cetak cek Anda dulu: berkas pendaftaran disimpan bersamanya.",vi:"Chưa có tệp? Hãy in séc trước: tệp đăng ký được lưu cùng với chúng."})} <button class="btn ghost sm" data-act="tomore">${T('Print more cheques','印更多支票',{hans:"打印更多支票",es:"Imprimir más cheques",pt:"Imprimir mais cheques",fr:"Imprimer plus de chèques",de:"Weitere Schecks drucken",it:"Stampa altri assegni",ja:"小切手をさらに印刷",ko:"수표 더 인쇄하기",ru:"Напечатать ещё чеки",tr:"Daha fazla çek basın",id:"Cetak cek lagi",vi:"In thêm séc"})}</button></p>`:''}`}

 return `${img('check')}<h1>${T('Honesty check','誠實檢查',{hans:"诚实检查",es:"Prueba de honestidad",pt:"Verificação de honestidade",fr:"Contrôle d’honnêteté",de:"Ehrlichkeitsprüfung",it:"Verifica di onestà",ja:"誠実性チェック",ko:"정직성 확인",ru:"Проверка честности",tr:"Dürüstlük kontrolü",id:"Uji kejujuran",vi:"Kiểm tra trung thực"})}</h1><p class="sub">${T('Cheque 0 was sent with the registration: zero coins, to nobody. When it confirms, every cell of it matched the hash your book registered.','第 0 號支票已隨登記送出：零幣、不給任何人。確認後，代表它的每一格都和簿子登記的雜湊值吻合。',{hans:"支票 0 已随注册一起发送：零币，不发给任何人。它得到确认时，说明它的每个格子都与你的支票簿注册的哈希值相符。",es:"El cheque 0 se envió con el registro: cero monedas, a nadie. Cuando se confirme, significa que cada casilla coincidió con el hash que registró tu talonario.",pt:"O cheque 0 foi enviado com o registro: zero moedas, para ninguém. Quando ele for confirmado, significa que cada célula dele conferiu com o hash que seu talão registrou.",fr:"Le chèque 0 a été envoyé avec l’enregistrement : zéro pièce, à personne. Quand il est confirmé, c’est que chacune de ses cases correspondait au hachage que votre carnet a enregistré.",de:"Scheck 0 wurde mit der Registrierung gesendet: null Coins, an niemanden. Wird er bestätigt, passte jede seiner Zellen zu dem Hash, den dein Scheckheft registriert hat.",it:"L'assegno 0 è stato inviato con la registrazione: zero monete, a nessuno. Quando viene confermato, significa che ogni sua casella corrispondeva all'hash registrato dal tuo libretto.",ja:"小切手 0 は登録と一緒に送信されました。コインはゼロで、宛先はありません。これが承認されれば、すべてのマスが小切手帳の登録したハッシュと一致したことになります。",ko:"수표 0번이 등록과 함께 보내졌습니다. 코인은 없고 받는 사람도 없습니다. 이것이 확인되면 모든 칸이 수표책이 등록한 해시와 일치한 것입니다.",ru:"Чек 0 отправлен вместе с регистрацией: ноль монет, никому. Когда он подтвердится, это значит, что каждая его ячейка совпала с хешем, который зарегистрировала ваша книжка.",tr:"0 numaralı çek kayıtla birlikte gönderildi: sıfır coin, hiç kimseye. Onaylandığında, her hücresi defterinizin kaydettiği hash'le eşleşmiş demektir.",id:"Cek 0 dikirim bersama pendaftaran: nol koin, tidak kepada siapa pun. Saat terkonfirmasi, berarti setiap kotaknya cocok dengan hash yang didaftarkan buku Anda.",vi:"Séc 0 đã được gửi cùng lần đăng ký: số lượng bằng không, không gửi cho ai. Khi séc được xác nhận, mọi ô của nó đều đã khớp với mã băm mà sổ của bạn đã đăng ký."})}</p>

 ${S.honest?`<div class="warn g"><span class="icon">verified</span><span>${T('Cheque 0 confirmed on the chain. Your book is registered and honest.','第 0 號支票已在鏈上確認。你的簿子已登記且誠實可靠。',{hans:"支票 0 已在链上确认。你的支票簿已注册，且真实可靠。",es:"Cheque 0 confirmado en la cadena. Tu talonario está registrado y es honesto.",pt:"Cheque 0 confirmado na cadeia. Seu talão está registrado e é honesto.",fr:"Chèque 0 confirmé sur la chaîne. Votre carnet est enregistré et fidèle.",de:"Scheck 0 auf der Chain bestätigt. Dein Scheckheft ist registriert und ehrlich.",it:"Assegno 0 confermato sulla catena. Il tuo libretto è registrato e onesto.",ja:"小切手 0 がチェーン上で承認されました。小切手帳は登録済みで、正しいものです。",ko:"수표 0번이 체인에서 확인되었습니다. 수표책이 등록되었고 정직합니다.",ru:"Чек 0 подтверждён в блокчейне. Ваша книжка зарегистрирована и честная.",tr:"0 numaralı çek zincirde onaylandı. Defteriniz kayıtlı ve dürüst.",id:"Cek 0 terkonfirmasi di rantai. Buku Anda terdaftar dan jujur.",vi:"Séc 0 đã được xác nhận trên chuỗi. Sổ của bạn đã được đăng ký và trung thực."})}${S.hon2==='same'?' '+T('A second node agrees.','第二個節點也確認了。',{hans:"第二个节点也确认了。",es:"Un segundo nodo lo confirma.",pt:"Um segundo nó confirma.",fr:"Un deuxième nœud le confirme.",de:"Ein zweiter Knoten bestätigt es.",it:"Un secondo nodo lo conferma.",ja:"もう一つのノードも同じ結果です。",ko:"두 번째 노드도 확인했습니다.",ru:"Второй узел это подтверждает.",tr:"İkinci bir düğüm de onaylıyor.",id:"Node kedua juga mengonfirmasi.",vi:"Một nút thứ hai cũng xác nhận."}):''}</span></div>${S.hon2==='differ'?`<div class="warn y"><span class="icon">warning</span><span>${T('A second node does not show cheque 0 yet. Wait a minute: if it still disagrees, check your account with another node before you trust this book.','第二個節點還沒顯示第 0 號支票。請等一分鐘：若仍不一致，信任這本簿子之前，請用另一個節點查你的帳戶。',{hans:"第二个节点还没有显示支票 0。请等一分钟：如果仍不一致，在信任这本支票簿之前，请用另一个节点查看你的账户。",es:"Un segundo nodo todavía no muestra el cheque 0. Espera un minuto: si sigue sin coincidir, revisa tu cuenta con otro nodo antes de confiar en este talonario.",pt:"Um segundo nó ainda não mostra o cheque 0. Espere um minuto: se ainda não bater, verifique sua conta com outro nó antes de confiar neste talão.",fr:"Un deuxième nœud n’affiche pas encore le chèque 0. Attendez une minute : s’il n’est toujours pas d’accord, vérifiez votre compte avec un autre nœud avant de faire confiance à ce carnet.",de:"Ein zweiter Knoten zeigt Scheck 0 noch nicht. Warte eine Minute: Wenn er weiter widerspricht, prüfe dein Konto mit einem anderen Knoten, bevor du diesem Scheckheft vertraust.",it:"Un secondo nodo non mostra ancora l’assegno 0. Aspetta un minuto: se non concorda ancora, controlla il tuo account con un altro nodo prima di fidarti di questo libretto.",ja:"もう一つのノードにはまだ小切手 0 が表示されていません。少し待ってください。それでも食い違う場合は、この小切手帳を信頼する前に別のノードでアカウントを確認してください。",ko:"두 번째 노드에는 아직 수표 0번이 보이지 않습니다. 잠시 기다리세요. 그래도 다르면 이 수표책을 믿기 전에 다른 노드로 계정을 확인하세요.",ru:"Второй узел пока не показывает чек 0. Подождите минуту: если он всё ещё не согласен, проверьте свой аккаунт через другой узел, прежде чем доверять этой книжке.",tr:"İkinci bir düğüm 0 numaralı çeki henüz göstermiyor. Bir dakika bekleyin: hâlâ uyuşmuyorsa, bu deftere güvenmeden önce hesabınızı başka bir düğümle kontrol edin.",id:"Node kedua belum menampilkan cek 0. Tunggu sebentar: jika masih tidak sama, periksa akun Anda dengan node lain sebelum memercayai buku ini.",vi:"Một nút thứ hai vẫn chưa hiển thị séc 0. Hãy đợi một phút: nếu vẫn không khớp, hãy kiểm tra tài khoản của bạn bằng một nút khác trước khi tin cuốn sổ này."})}</span></div>`:''}`:`<p class="faint mono" style="text-align:center;font-size:13px" id="hon-l">${T('Waiting for the next block…','等待下一個區塊…',{hans:"等待下一个区块…",es:"Esperando el siguiente bloque…",pt:"Aguardando o próximo bloco…",fr:"En attente du prochain bloc…",de:"Warten auf den nächsten Block…",it:"In attesa del prossimo blocco…",ja:"次のブロックを待っています…",ko:"다음 블록을 기다리는 중…",ru:"Ожидание следующего блока…",tr:"Bir sonraki blok bekleniyor…",id:"Menunggu blok berikutnya…",vi:"Đang chờ khối tiếp theo…"})}</p>`}
