const DAMM=[[0,3,1,7,5,9,8,6,4,2],[7,0,9,2,1,5,4,8,6,3],[4,2,0,6,8,7,1,3,5,9],[1,7,5,0,9,8,3,4,2,6],[6,1,2,3,0,4,5,9,7,8],[3,6,7,4,2,0,9,5,8,1],[5,8,6,9,7,2,0,1,3,4],[8,9,4,5,3,6,2,0,1,7],[9,4,3,8,6,1,7,2,0,5],[2,5,8,1,4,3,6,7,9,0]];
const damm=s=>[...s].reduce((i,c)=>DAMM[i][+c],0);
// Seed: 32 bytes of entropy as 24 BIP-39 words (256 bits + 8-bit checksum). The 32 bytes are the

const POOL=window.BIP39;
const sha=async b=>new Uint8Array(await crypto.subtle.digest('SHA-256',b));
async function toWords(ent){const h=await sha(ent);let bits='';for(const x of ent)bits+=x.toString(2).padStart(8,'0');bits+=h[0].toString(2).padStart(8,'0');
  return [...Array(24)].map((_,i)=>POOL[parseInt(bits.slice(i*11,i*11+11),2)])}
const hex=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join('');

// Printable parts, derived here and saved straight to disk (src/wallet.rs, make_sample.py):

const enc=new TextEncoder(), cat=(...a)=>{const o=new Uint8Array(a.reduce((n,x)=>n+x.length,0));let i=0;for(const x of a){o.set(x,i);i+=x.length}return o};
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function words12(b){const h=await sha(b);let bits='';for(const x of b)bits+=x.toString(2).padStart(8,'0');bits+=(h[0]>>4).toString(2).padStart(4,'0');
  return [...Array(12)].map((_,i)=>POOL[parseInt(bits.slice(i*11,i*11+11),2)])}
const COLN=[...Array(12)].map((_,i)=>'P'+(i+1)).concat(['D1','D2','D3','D4','E','F']);
const LOGO_SVG='<svg class="lg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path fill="#02050A" fill-rule="evenodd" d="M33.750 60.750 L60.237 34.263 Q62.500 32.000 60.237 29.737 L34.263 3.763 Q32.000 1.500 29.737 3.763 L3.763 29.737 Q1.500 32.000 3.763 34.263 L30.250 60.750 L30.250 33.864 A6.6 6.6 0 1 1 33.750 33.864 Z"/></svg>';
const SHEET_CSS=`@page{size:A4 landscape;margin:8mm}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#02050A;background:#E9ECF1}

.lk{margin-left:auto;display:flex;align-items:center;gap:2mm;font-size:2.4mm;color:#555}.lk svg{width:18mm;height:18mm}.lk b{display:block;font:700 3mm ui-monospace,Menlo,Consolas,monospace;color:#02050A;letter-spacing:.2mm}
.stamp{font:700 2.6mm ui-monospace,Menlo,Consolas,monospace;letter-spacing:.3mm;color:#D9601F;border:.4mm solid #D9601F;border-radius:1mm;padding:1mm 2mm}

thead th{font:700 2.4mm ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2mm;padding:.8mm 0;text-align:center}thead tr:first-child th{border-bottom:.35mm solid #02050A;text-align:left}
th.rw{width:5mm;font:600 2.8mm ui-monospace,Menlo,Consolas,monospace;color:#666}

.cno{display:flex;flex-direction:column;align-items:center;justify-content:center;border:.6mm solid #02050A;border-radius:1.6mm;padding:.6mm 3mm;min-width:16mm}.cno span{font:700 2mm ui-monospace,Menlo,Consolas,monospace;letter-spacing:.4mm}.cno b{font:800 9mm/1 system-ui,-apple-system,"Segoe UI",sans-serif}
td.qc{text-align:center}td.cut .pos{color:#9aa0a8}.tpl td.cut{border-style:solid;border-color:#c9ced6}.qc .pos{text-align:left}.qc .cq{width:11.2mm;height:11.2mm;display:block;margin:.1mm auto 0}
.ws{display:flex;flex-direction:column;min-width:0;font:500 1.72mm/1.12 ui-monospace,Menlo,Consolas,monospace}.ws span{white-space:nowrap;overflow:hidden}
footer{display:flex;flex-direction:column;gap:.6mm;margin-top:2.5mm;font-size:2.5mm;color:#444}`;
async function sheet(part){const seed=unhex(S.ent),cols=part==='A'?[...Array(12).keys()]:[12,13,14,15,16,17];let pages='';
  const code=await wcall('lookup_code',seed),qr=await qrSvg(findURL(code));
  // each cell also as a QR code: its 16 bytes as 32 hex digits, at the highest error correction so the box's
  // position (cheque · column · row) can be printed in the middle and a cut-out box still says where it came from
  const QX=(await WebAssembly.instantiate(await WASM,{})).exports;
  const cellQR=(b,label)=>{const m=wrun(QX,'qr_h',enc.encode(hex(b).toUpperCase()),true),n=m[0],c=n/2+2;let d='';
    for(let y=0;y<n;y++)for(let x=0;x<n;){if(!m[1+y*n+x]){x++;continue}let k=x;while(k<n&&m[1+y*n+k])k++;d+=`M${x+2} ${y+2}h${k-x}v1h${x-k}z`;x=k}
    return `<svg class="cq" viewBox="0 0 ${n+4} ${n+4}" shape-rendering="crispEdges"><path d="${d}"/><rect x="${c-6.5}" y="${c-3.5}" width="13" height="7" fill="#fff"/><text x="${c}" y="${c+1.45}" text-anchor="middle" textLength="11.6" lengthAdjust="spacingAndGlyphs" font-size="4.3" font-weight="800" font-family="ui-monospace,Menlo,Consolas,monospace" shape-rendering="geometricPrecision">${label}</text></svg>`};
  for(let n=1;n<=11;n++){const key=   // cheque 0 is the honesty check: sent from the seed with the registration, never printed
    await sha(cat(enc.encode('bitcheque/key'),seed,new Uint8Array([n&255,n>>8])));let rows='',qrows='';
    for(let r=0;r<10;r++){rows+=`<tr><th class="rw">${r}</th>`;
      qrows+=`<tr><th class="rw">${r}</th>`;
      for(const c of cols){const cell=(await sha(cat(enc.encode('bitcheque/cell'),key,new Uint8Array([c,r])))).slice(0,16),w=await words12(cell);
        rows+=`<td><div class="in"><div class="pos">${COLN[c]}·${r}</div><div class="ws">${[0,2,4,6,8,10].map(i=>`<span>${w[i]} ${w[i+1]}</span>`).join('')}</div></div></td>`;
        qrows+=`<td class="qc"><div class="in"><div class="pos">${COLN[c]}·${r}</div>${cellQR(cell,`${n}·${COLN[c]}·${r}`)}</div></td>`}
      rows+='</tr>';qrows+='</tr>'}
    const groups=part==='A'?`<th></th><th colspan="12">RECIPIENT ACCOUNT · 11 digits + check digit</th>`:`<th></th><th colspan="4">AMOUNT · 4 digits</th><th>EXP</th><th>FEE</th>`;
    const page=(qrPage,body)=>`<section class="pg p${part}${qrPage?' pq':''}"><header><div class="cno"><span>CHEQUE</span><b>${n}</b></div><div class="brand">${LOGO_SVG}<b>Bitcheque</b></div>
<div class="ttl"><b>${part==='A'?'Part A · recipient':'Part B · amount, exponent, fee'}${qrPage?' · QR codes':''}</b><span>Cheque ${n} of 1–11${n===11?' · LAST CHEQUE: sweep to a new book only':''}</span></div>
<div class="acct">Account <span class="blank"></span></div><div class="lk">${qr}<span>Find your account number<b>${fmtCode(code)}</b></span></div><div class="stamp">${n===11?'LAST CHEQUE · SWEEP ONLY':'KEEP SECRET'}</div></header>
<table><thead><tr>${groups}</tr><tr><th></th>${cols.map(c=>`<th>${COLN[c]}${c===11?' ✓':''}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>
<footer>${n===11?'<span><b>This is the last cheque in the book.</b> Use it only to sweep the whole balance to a new book: amount 0000, exponent 9. Spent on anything else, whatever is left in this account can never move again.</span>':''}<span>Part ${part} of 2. Printed separately from part ${part==='A'?'B':'A'}. Keep the two parts in different places.</span>${qrPage?'<span><b>The same boxes as the word page before it, as QR codes.</b> Scan one box at a time through the cutting template; never photograph the whole page.</span>':'<span><b>To sign:</b> find the row of each digit in its column, then copy that box\'s 12 words or scan its QR code on the next page. Cross out each cheque once used.</span>'}</footer></section>`;
    pages+=page(false,rows)+page(true,qrows)}   // each word page is followed by its QR twin
  // last page: an empty grid laid out exactly like the QR pages. Cut holes where the boxes you need are, lay it
  // over a QR page, and a camera sees only those boxes. It holds no secret.
  const blank=[...Array(10)].map((_,r)=>`<tr><th class="rw">${r}</th>${cols.map(c=>`<td class="qc cut"><div class="in"><div class="pos">${COLN[c]}·${r}</div></div></td>`).join('')}</tr>`).join('');
  pages+=`<section class="pg p${part} pq tpl"><header><div class="cno"><span>CUT</span><b>✂</b></div><div class="brand">${LOGO_SVG}<b>Bitcheque</b></div>
<div class="ttl"><b>${part==='A'?'Part A · recipient':'Part B · amount, exponent, fee'} · cutting template</b><span>For any cheque in this part</span></div>
<div class="acct">Account <span class="blank"></span></div><div class="lk">${qr}<span>Find your account number<b>${fmtCode(code)}</b></span></div><div class="stamp">NO SECRETS</div></header>
<table><thead><tr>${part==='A'?`<th></th><th colspan="12">RECIPIENT ACCOUNT · 11 digits + check digit</th>`:`<th></th><th colspan="4">AMOUNT · 4 digits</th><th>EXP</th><th>FEE</th>`}</tr><tr><th></th>${cols.map(c=>`<th>${COLN[c]}${c===11?' ✓':''}</th>`).join('')}</tr></thead><tbody>${blank}</tbody></table>
<footer><span><b>A mask for scanning.</b> Cut out the boxes your cheque needs, lay this sheet over that cheque's QR page so the edges line up, and scan through the holes one box at a time. The camera never sees the other boxes.</span><span>Print it on the same printer and paper as the QR pages so the boxes line up.</span></footer></section>`;
  return `<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bitcheque part ${part}</title><style>${SHEET_CSS}</style><body>
<div class="bar"><span><b>Secret.</b> This file holds part ${part} of your cheque book. Print it, then delete the file and empty the trash.</span><button onclick="print()">Print part ${part}</button></div>${pages}</body></html>`}
async function download(part){const html=await sheet(part),url=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  const a=document.createElement('a');a.href=url;a.download=`bitcheque-part-${part}.html`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
// The browser wallet: the node's own Rust (web/wasm) compiled to WebAssembly, so the registration and
// cheque 0 are built by exactly the code the chain checks them with. Inputs go in through `io`.
const WASM=fetch('assets/bitcheque.wasm').then(r=>r.arrayBuffer()).then(b=>WebAssembly.compile(b));
async function wcall(fn,input,raw){const x=(await WebAssembly.instantiate(await WASM,{})).exports;return wrun(x,fn,input,raw)}
function wrun(x,fn,input,raw){const p=x.io_reserve(input.length);new Uint8Array(x.memory.buffer,p,input.length).set(input);const n=x[fn]();if(!n)throw new Error(fn);
  const o=new Uint8Array(x.memory.buffer,x.io_ptr(),n).slice();return raw?o:new TextDecoder().decode(o)}
// the lookup code: the start of the account id (public), printed on the sheets and scanned to find the number once it is final
const fmtCode=c=>c.toUpperCase().match(/.{1,4}/g).join('-');
const findURL=c=>new URL('explorer.html#code='+fmtCode(c),/^https?:/.test(location.protocol)?location.href:'https://bitcheque.example/web/').href;
async function qrSvg(text,dark='#02050A'){const m=await wcall('qr',enc.encode(text),true),n=m[0],q=4;let d='';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(m[1+y*n+x])d+=`M${x+q} ${y+q}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+2*q} ${n+2*q}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path fill="${dark}" d="${d}"/></svg>`}
async function qrDownload(code){const svg=await qrSvg(findURL(code)),img=new Image(),c=document.createElement('canvas');c.width=c.height=720;
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);await img.decode();c.getContext('2d').drawImage(img,0,0,720,720);
  const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=`bitcheque-account-lookup-${fmtCode(code)}.png`;document.body.appendChild(a);a.click();a.remove()}
const qs=s=>document.querySelector(s);
// The public registration file: the unmined registration, cheque 0 (zero coins to nobody) and the lookup code. No seed.
async function saveReg(){const seed=unhex(S.ent);
  S.reg={bitcheque:'registration',v:1,code:await wcall('lookup_code',seed),tx:await wcall('reg_tx',seed),honesty:(await wcall('honesty',seed)).split('\n')};S.code=S.reg.code;
  const url=URL.createObjectURL(new Blob([JSON.stringify(S.reg)],{type:'application/json'})),l=document.createElement('a');
  l.href=url;l.download=`bitcheque-registration-${fmtCode(S.code)}.json`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);S.regSaved=true;render()}
document.addEventListener('change',async e=>{if(e.target.id!=='regfile')return;const f=e.target.files[0];if(!f)return;
  try{const r=JSON.parse(await f.text());if(r.bitcheque!=='registration'||!/^[0-9a-f]+$/.test(r.tx)||!Array.isArray(r.honesty)||r.honesty.length!==18)throw 0;S.reg=r;S.code=r.code;render()}
  catch(_){qs('#regerr').textContent=T('That is not a Bitcheque registration file.','這不是 Bitcheque 登記檔。',{hans:"这不是 Bitcheque 注册文件。",es:"Eso no es un archivo de registro de Bitcheque.",pt:"Isso não é um arquivo de registro do Bitcheque.",fr:"Ce n’est pas un fichier d’enregistrement Bitcheque.",de:"Das ist keine Bitcheque-Registrierungsdatei.",it:"Questo non è un file di registrazione di Bitcheque.",ja:"これは Bitcheque の登録ファイルではありません。",ko:"Bitcheque 등록 파일이 아닙니다.",ru:"Это не файл регистрации Bitcheque.",tr:"Bu bir Bitcheque kayıt dosyası değil.",id:"Itu bukan berkas pendaftaran Bitcheque.",vi:"Đây không phải tệp đăng ký Bitcheque."})}});

const WORKER=`let x;onmessage=async e=>{const d=e.data;if(d.mod){x=(await WebAssembly.instantiate(d.mod,{})).exports;const p=x.io_reserve(d.input.length);new Uint8Array(x.memory.buffer,p,d.input.length).set(d.input);postMessage({ready:x.reg_prepare()});return}
  let n=d.start;for(;;){const r=x.reg_mine(n>>>0,Math.floor(n/4294967296),d.step);if(r){postMessage({found:n+r-1});return}n+=d.step;postMessage({done:d.step})}}`;
async function register(btn){const l=qs('#pow-l'),bar=qs('#pow');

    const limbs=(await (await fetch(base+'/regtarget')).text()).trim().split(/\s+/);
    const target=Uint8Array.from(limbs.flatMap(h=>h.match(/../g).reverse().map(x=>parseInt(x,16))));
    const expect=Math.pow(2,256)/limbs.reduceRight((a,h)=>a*2**64+parseInt(h,16),0);
    const input=Uint8Array.from([...unhex(S.reg.tx),...target]),mod=await WASM;
    const cores=Math.max(1,Math.min(16,(navigator.hardwareConcurrency||4)-1)),url=URL.createObjectURL(new Blob([WORKER],{type:'text/javascript'}));

      for(let k=0;k<cores;k++){const w=new Worker(url);ws.push(w);
        w.onmessage=e=>{const d=e.data;
          if('ready' in d){if(!d.ready){ws.forEach(x=>x.terminate());bad(new Error('prepare'))}else w.postMessage({start:k*2**36,step:200000})}
          else if(d.done){done+=d.done;const s=(Date.now()-t0)/1000,rate=done/s;bar.style.width=Math.min(97,done/expect*100)+'%';
            const tries=(done/1e6).toFixed(0),secs=Math.max(1,Math.round((expect-done)/rate));l.textContent=T(`Computing: ${tries} million tries, about ${secs} s left`,`運算中：已試 ${tries} 百萬次，約剩 ${secs} 秒`,{hans:`计算中：已尝试 ${tries} 百万次，约剩 ${secs} 秒`,es:`Calculando: ${tries} millones de intentos, quedan unos ${secs} s`,pt:`Calculando: ${tries} milhões de tentativas, faltam cerca de ${secs} s`,fr:`Calcul : ${tries} millions d’essais, environ ${secs} s restantes`,de:`Berechnung: ${tries} Millionen Versuche, noch etwa ${secs} s`,it:`Calcolo: ${tries} milioni di tentativi, circa ${secs} s rimanenti`,ja:`計算中：${tries} 百万回試行、残り約 ${secs} 秒`,ko:`계산 중: ${tries}백만 회 시도, 약 ${secs}초 남음`,ru:`Вычисление: ${tries} млн попыток, осталось около ${secs} с`,tr:`Hesaplanıyor: ${tries} milyon deneme, yaklaşık ${secs} sn kaldı`,id:`Menghitung: ${tries} juta percobaan, sekitar ${secs} dtk lagi`,vi:`Đang tính: ${tries} triệu lần thử, còn khoảng ${secs} giây`})}

    const x=(await WebAssembly.instantiate(mod,{})).exports;wrun(x,'reg_prepare',input,true);

    const len=x.reg_result(),reg=new TextDecoder().decode(new Uint8Array(x.memory.buffer,x.io_ptr(),len).slice());   // read memory only after the call: it may grow and move
    bar.style.width='100%';l.textContent=T('Sending…','送出中…',{hans:"发送中…",es:"Enviando…",pt:"Enviando…",fr:"Envoi…",de:"Wird gesendet…",it:"Invio…",ja:"送信中…",ko:"보내는 중…",ru:"Отправка…",tr:"Gönderiliyor…",id:"Mengirim…",vi:"Đang gửi…"});

  catch(e){btn.disabled=false;l.textContent=T(`Not registered: ${e.message}. Check the connection and try again.`,`未登記：${e.message}。請檢查連線後再試一次。`,{hans:`未注册：${e.message}。请检查网络连接后重试。`,es:`No registrado: ${e.message}. Comprueba la conexión e inténtalo de nuevo.`,pt:`Não registrado: ${e.message}. Verifique a conexão e tente de novo.`,fr:`Non enregistré : ${e.message}. Vérifiez la connexion et réessayez.`,de:`Nicht registriert: ${e.message}. Prüfe die Verbindung und versuche es erneut.`,it:`Non registrato: ${e.message}. Controlla la connessione e riprova.`,ja:`登録されませんでした：${e.message}。接続を確認して、もう一度お試しください。`,ko:`등록되지 않았습니다: ${e.message}. 연결을 확인하고 다시 시도하세요.`,ru:`Не зарегистрировано: ${e.message}. Проверьте подключение и попробуйте снова.`,tr:`Kayıt yapılamadı: ${e.message}. Bağlantıyı kontrol edip tekrar deneyin.`,id:`Tidak terdaftar: ${e.message}. Periksa koneksi dan coba lagi.`,vi:`Chưa đăng ký được: ${e.message}. Hãy kiểm tra kết nối và thử lại.`})}}

 <p class="sub">${T('These 24 words recreate your whole book, both parts. Make them from real randomness, then write them on paper in order. Never type them anywhere else.','這 24 個字可以重建整本簿子的兩部分。用真正的隨機來源產生，再照順序寫在紙上，絕不在其他地方輸入。',{hans:"这 24 个单词可以重建你的整本支票簿，包括两个部分。请用真正的随机来源生成它们，然后按顺序写在纸上。切勿在其他任何地方输入。",es:"Estas 24 palabras recrean todo tu talonario, ambas partes. Genéralas con aleatoriedad real y luego escríbelas en papel, en orden. Nunca las teclees en ningún otro sitio.",pt:"Estas 24 palavras recriam o talão inteiro, as duas partes. Gere-as com aleatoriedade real e depois escreva-as no papel, em ordem. Nunca as digite em nenhum outro lugar.",fr:"Ces 24 mots recréent tout votre carnet, les deux parties comprises. Générez-les à partir d’un vrai hasard, puis écrivez-les sur papier dans l’ordre. Ne les tapez jamais ailleurs.",de:"Diese 24 Wörter stellen dein ganzes Scheckheft wieder her, beide Teile. Erzeuge sie aus echtem Zufall und schreib sie dann der Reihe nach auf Papier. Tippe sie nirgendwo sonst ein.",it:"Queste 24 parole ricreano l'intero libretto, entrambe le parti. Creale a partire da vera casualità, poi scrivile su carta in ordine. Non digitarle mai da nessun'altra parte.",ja:"この 24 個の単語で、小切手帳全体を両方のパートとも再作成できます。本物の乱数から作り、順番どおりに紙に書き写してください。ほかの場所には決して入力しないでください。",ko:"이 24개 단어로 두 부분을 포함한 수표책 전체를 다시 만들 수 있습니다. 진짜 무작위성으로 만든 뒤 종이에 순서대로 적으세요. 다른 곳에는 절대 입력하지 마세요.",ru:"Эти 24 слова восстанавливают всю вашу книжку, обе части. Создайте их из настоящей случайности, затем запишите на бумаге по порядку. Никогда и нигде больше их не вводите.",tr:"Bu 24 kelime, iki bölümüyle birlikte tüm defterinizi yeniden oluşturur. Onları gerçek rastgelelikten üretin, sonra sırasıyla kâğıda yazın. Onları asla başka bir yere yazmayın.",id:"24 kata ini membuat ulang seluruh buku Anda, kedua bagiannya. Hasilkan dari keacakan sejati, lalu tulis di kertas secara berurutan. Jangan pernah mengetiknya di tempat lain.",vi:"24 từ này tái tạo cả cuốn sổ của bạn, cả hai phần. Hãy tạo chúng từ nguồn ngẫu  ${S.src==='dice'?`<details class="dice"><summary>${T('Check it on another offline computer','在另一台離線電腦上核對',{hans:"在另一台离线电脑上核对",es:"Compruébala en otra computadora sin conexión",pt:"Confira em outro computador offline",fr:"Vérifiez-la sur un autre ordinateur hors ligne",de:"Auf einem anderen Offline-Computer prüfen",it:"Verificalo su un altro computer offline",ja:"別のオフラインのコンピューターで確認する",ko:"다른 오프라인 컴퓨터에서 확인하기",ru:"Проверьте на другом офлайн-компьютере",tr:"Başka bir çevrimdışı bilgisayarda kontrol edin",id:"Periksa di komputer offline lain",vi:"Kiểm tra nó trên một máy tính ngoại tuyến khác"})}</summary><ol><li>${T(`Run <code>printf '%s' ROLLS | sha256sum</code> with your rolls in place of ROLLS.`,`執行 <code>printf '%s' ROLLS | sha256sum</code>，把 ROLLS 換成你的骰子結果。`,{hans:`运行 <code>printf '%s' ROLLS | sha256sum</code>，并把 ROLLS 替换为你的掷骰结果。`,es:`Ejecuta <code>printf '%s' ROLLS | sha256sum</code> con tus tiradas en lugar de ROLLS.`,pt:`Execute <code>printf '%s' ROLLS | sha256sum</code> com seus lançamentos no lugar de ROLLS.`,fr:`Exécutez <code>printf '%s' ROLLS | sha256sum</code> en remplaçant ROLLS par vos lancers.`,de:`Führe <code>printf '%s' ROLLS | sha256sum</code> aus, mit deinen Würfen anstelle von ROLLS.`,it:`Esegui <code>printf '%s' ROLLS | sha256sum</code> sostituendo ROLLS con i tuoi lanci.`,ja:`ROLLS をあなたのサイコロの結果に置き換えて、<code>printf '%s' ROLLS | sha256sum</code> を実行します。`,ko:`ROLLS 자리에 주사위 결과를 넣어 <code>printf '%s' ROLLS | sha256sum</code>을 실행하세요.`,ru:`Выполните <code>printf '%s' ROLLS | sha256sum</code>, подставив вместо ROLLS результаты своих бросков.`,tr:`ROLLS yerine kendi zar sonuçlarınızı yazarak <code>printf '%s' ROLLS | sha256sum</code> komutunu çalıştırın.`,id:`Jalankan <code>printf '%s' ROLLS | sha256sum</code> dengan hasil lemparan Anda sebagai pengganti ROLLS.`,vi:`Chạy <code>printf '%s' ROLLS | sha256sum</code> với kết quả gieo của bạn thay cho ROLLS.`})}</li><li>${T('It must print','結果必須是',{hans:"输出必须是",es:"Debe mostrar",pt:"O resultado deve ser",fr:"Le résultat doit être",de:"Die Ausgabe muss lauten",it:"Il risultato deve essere",ja:"出力は次と一致しなければなりません：",ko:"출력 결과는 다음과 같아야 합니다:",ru:"Команда должна вывести",tr:"Çıktı şu olmalı:",id:"Hasilnya harus berupa",vi:"Kết quả phải là"})} <code class="ent">${S.ent}</code></li><li>${T('Those 32 bytes are your seed; the 24 words are the same bytes in BIP-39 form.','這 32 個位元組就是你的種子；24 個字是同一組位元組的 BIP-39 形式。',{hans:"这 32 个字节就是你的种子；24 个单词是同样这些字节的 BIP-39 形式。",es:"Esos 32 bytes son tu semilla; las 24 palabras son los mismos bytes en formato BIP-39.",pt:"Esses 32 bytes são sua semente; as 24 palavras são os mesmos bytes no formato BIP-39.",fr:"Ces 32 octets sont votre graine ; les 24 mots sont les mêmes octets au format BIP-39.",de:"Diese 32 Bytes sind dein Seed; die 24 Wörter sind dieselben Bytes im BIP-39-Format.",it:"Quei 32 byte sono il tuo seed; le 24 parole sono gli stessi byte in formato BIP-39.",ja:"この 32 バイトがあなたのシードです。24 個の単語は、同じバイト列を BIP-39 形式で表したものです。",ko:"이 32바이트가 시드이며, 24개 단어는 같은 바이트를 BIP-39 형식으로 나타낸 것입니다.",ru:"Эти 32 байта и есть ваша сид-фраза; 24 слова — те же байты в формате BIP-39.",tr:"Bu 32 bayt sizin tohumunuzdur; 24 kelime, aynı baytların BIP-39 biçimidir.",id:"32 byte itu adalah seed Anda; 24 kata tersebut adalah byte yang sama dalam bentuk BIP-39.",vi:"32 byte đó là hạt giống của bạn; 24 từ chính là các byte đó ở dạng BIP-39."})}</li></ol></details>`:''}

 ${checks('sA',[T('I wrote all 24 words on paper, in order.','我已把 24 個字依序寫在紙上。',{hans:"我已把全部 24 个单词按顺序写在纸上。",es:"He escrito las 24 palabras en papel, en orden.",pt:"Escrevi as 24 palavras no papel, em ordem.",fr:"J’ai écrit les 24 mots sur papier, dans l’ordre.",de:"Ich habe alle 24 Wörter der Reihe nach auf Papier geschrieben.",it:"Ho scritto tutte le 24 parole su carta, in ordine.",ja:"24 個の単語をすべて順番どおりに紙に書きました。",ko:"24개 단어를 모두 순서대로 종이에 적었습니다.",ru:"Все 24 слова записаны на бумаге по порядку.",tr:"24 kelimenin hepsini sırasıyla kâğıda yazdım.",id:"Saya sudah menulis ke-24 kata di kertas, secara berurutan.",vi:"Tôi đã viết cả 24 từ lên giấy, theo thứ tự."}),T('I understand that anyone with my seed, or with both parts of an unused cheque, can move my coins, and that losing the seed and the book together loses the account.','我明白任何人拿到我的種子，或同時拿到一張未用支票的兩部分，就能動用；種子和簿子同時遺失，帳戶就無法挽回。',{hans:"我明白：任何人拿到我的种子，或同时拿到一张未用支票的两个部分，都可以转移我的币；同时丢失种子和支票簿，就会失去这个账户。",es:"Entiendo que cualquiera que tenga mi semilla, o las dos partes de un cheque sin usar, puede mover mis monedas, y que perder la semilla y el talonario a la vez supone perder la cuenta.",pt:"Entendo que qualquer pessoa com minha semente, ou com as duas partes de um cheque não usado, pode mover minhas moedas, e que perder a semente e o talão juntos significa perder a conta.",fr:"Je comprends que quiconque possède ma graine, ou les deux parties d’un chèque inutilisé, peut transférer mes pièces, et que perdre la graine et le carnet ensemble fait perdre le compte.",de:"Mir ist klar, dass jeder mit meinem Seed oder mit beiden Teilen eines unbenutzten Schecks meine Coins bewegen kann und dass ich das Konto verliere, wenn ich Seed und Scheckheft zusammen verliere.",it:"Capisco che chiunque abbia il mio seed, o entrambe le parti di un assegno non usato, può muovere le mie monete, e che perdere insieme il seed e il libretto significa perdere l'account.",ja:"私のシード、または未使用の小切手の両方のパートを持つ人なら誰でも私のコインを動かせること、そしてシードと小切手帳を一緒になくすとアカウントを失うことを理解しています。",ko:"제 시드를 가진 사람, 또는 사용하지 않은 수표의 두 부분을 모두 가진 사람은 누구나 제 코인을 옮길 수 있으며, 시드와 수표책을 함께 잃으면 계정을 잃는다는 것을 이해합니다.",ru:"Я понимаю, что любой, у кого есть моя сид-фраза или обе части неиспользованного чека, может перевести мои монеты, а потеря сид-фразы вместе с книжкой означает потерю аккаунта.",tr:"Tohumuma veya kullanılmamış bir çekin iki bölümüne sahip olan herkesin coin'lerimi taşıyabileceğini ve tohumu ile defteri birlikte kaybetmenin hesabı kaybettireceğini anlıyorum.",id:"Saya memahami bahwa siapa pun yang memegang seed saya, atau kedua bagian dari cek yang belum terpakai, dapat memindahkan koin saya, dan bahwa kehilangan seed dan buku bersamaan berarti kehilangan akun.",vi:"Tôi hiểu rằng bất kỳ ai có hạt giống của tôi, hoặc có cả hai phần của một tờ séc chưa dùng, đều có thể chuyển coin của tôi đi, và mất cả hạt giống lẫn sổ là mất tài khoản."})])}

 ${S.src==='dice'?`<p class="hint">${T(`Roll a fair six-sided die ${ROLLS} times and type each result, 1 to 6. ${ROLLS} rolls carry 256 bits. The seed is the SHA-256 of your rolls, the same method SeedSigner uses, so you can check it on another computer.`,`擲一顆公正的六面骰 ${ROLLS} 次，每次輸入結果 1 到 6。${ROLLS} 次共 256 位元。種子是骰子結果的 SHA-256，與 SeedSigner 相同，可以在另一台電腦上核對。`,{hans:`掷一颗均匀的六面骰子 ${ROLLS} 次，每次输入结果（1 到 6）。${ROLLS} 次掷骰共携带 256 比特。种子是你掷骰结果的 SHA-256，与 SeedSigner 使用的方法相同，因此你可以在另一台电脑上核对。`,es:`Lanza un dado no trucado de seis caras ${ROLLS} veces y escribe cada resultado, del 1 al 6. ${ROLLS} tiradas aportan 256 bits. La semilla es el SHA-256 de tus tiradas, el mismo método que usa SeedSigner, así que puedes comprobarla en otra computadora.`,pt:`Lance um dado não viciado de seis faces ${ROLLS} vezes e digite cada resultado, de 1 a 6. ${ROLLS} lançamentos contêm 256 bits. A semente é o SHA-256 dos seus lançamentos, o mesmo método que o SeedSigner usa, então você pode conferi-la em outro computador.`,fr:`Lancez un dé équilibré à six faces ${ROLLS} fois et tapez chaque résultat, de 1 à 6. ${ROLLS} lancers contiennent 256 bits. La graine est le SHA-256 de vos lancers, selon la même méthode que SeedSigner, ce qui vous permet de la vérifier sur un autre ordinateur.`,de:`Wirf einen fairen sechsseitigen Würfel ${ROLLS}-mal und tippe jedes Ergebnis ein, 1 bis 6. ${ROLLS} Würfe enthalten 256 Bit. Der Seed ist der SHA-256-Hash deiner Würfe, dieselbe Methode wie bei SeedSigner, sodass du ihn auf einem anderen Computer prüfen kannst.`,it:`Lancia ${ROLLS} volte un dado a sei facce non truccato e digita ogni risultato, da 1 a 6. ${ROLLS} lanci contengono 256 bit. Il seed è lo SHA-256 dei tuoi lanci, lo stesso metodo usato da SeedSigner, così puoi verificarlo su un altro computer.`,ja:`公正な六面のサイコロを ${ROLLS} 回振り、毎回の結果を 1 から 6 で入力してください。${ROLLS} 回で 256 ビットになります。シードはサイコロの結果の SHA-256 で、SeedSigner と同じ方法なので、別のコンピューターで確認できます。`,ko:`공정한 육면체 주사위를 ${ROLLS}번 굴리고 각 결과를 1부터 6까지 입력하세요. ${ROLLS}번 굴리면 256비트가 됩니다. 시드는 굴린 결과의 SHA-256이며, SeedSigner와 같은 방식이므로 다른 컴퓨터에서 확인할 수 있습니다.`,ru:`Бросьте честный шестигранный кубик ${ROLLS} раз и вводите каждый результат, от 1 до 6. ${ROLLS} бросков дают 256 бит. Сид-фраза — это SHA-256 от ваших бросков, тот же метод, что использует SeedSigner, поэтому её можно проверить на другом компьютере.`,tr:`Hilesiz, altı yüzlü bir zarı ${ROLLS} kez atın ve her sonucu (1 ile 6 arası) yazın. ${ROLLS} atış 256 bit taşır. Tohum, zar sonuçlarınızın SHA-256'sıdır; bu, SeedSigner'ın kullandığı yöntemle aynıdır, böylece onu başka bir bilgisayarda kontrol edebilirsiniz.`,id:`Lempar dadu enam sisi yang adil sebanyak ${ROLLS} kali dan ketik setiap hasilnya, 1 sampai 6. ${ROLLS} lemparan memuat 256 bit. Seed adalah SHA-256 dari lemparan Anda, metode yang sama dengan yang dipakai SeedSigner, sehingga Anda dapat memeriksanya di komputer lain.`,vi:`Gieo một con xúc xắc sáu mặt cân đối ${ROLLS} lần và gõ từng kết quả, từ 1 đến 6. ${ROLLS} lần gieo mang 256 bit. Hạt giống là SHA-256 của các lần gieo, cùng phương pháp SeedSigner dùng, nên bạn có thể kiểm tra nó trên một máy tính khác.`})}</p>

  ${navRow(S.rolls.length>=ROLLS,T('Make my seed','產生我的種子',{hans:"生成我的种子",es:"Crear mi semilla",pt:"Gerar minha semente",fr:"Générer ma graine",de:"Meinen Seed erzeugen",it:"Crea il mio seed",ja:"シードを作成",ko:"내 시드 만들기",ru:"Создать сид-фразу",tr:"Tohumumu oluştur",id:"Buat seed saya",vi:"Tạo hạt giống của tôi"})).replace('data-act="next"','data-act="mkdice"')}`
 :`<p class="hint">${T('Move your mouse, or drag a finger, around the box until the bar fills. Your movements are mixed with this computer’s own randomness, so the seed is never weaker than the computer alone.','在框內移動滑鼠或用手指拖曳，直到進度條填滿。你的移動軌跡會和這台電腦本身的亂數混合，種子絕不會比電腦單獨產生的更弱。',{hans:"在框内移动鼠标或拖动手指，直到进度条填满。你的移动轨迹会与这台电脑自身的随机数混合，因此种子绝不会比电脑单独生成的更弱。",es:"Mueve el ratón, o arrastra un dedo, por el recuadro hasta que se llene la barra. Tus movimientos se mezclan con la propia aleatoriedad de esta computadora, así que la semilla nunca es más débil que la computadora por sí sola.",pt:"Mova o mouse, ou arraste um dedo, pelo quadro até a barra encher. Seus movimentos são misturados com a própria aleatoriedade deste computador, então a semente nunca é mais fraca do que o computador sozinho.",fr:"Déplacez votre souris, ou faites glisser un doigt, dans le cadre jusqu’à ce que la barre se remplisse. Vos mouvements sont mélangés à l’aléa propre de cet ordinateur, si bien que la graine n’est jamais plus faible que l’ordinateur seul.",de:"Bewege die Maus oder zieh einen Finger im Feld herum, bis der Balken voll ist. Deine Bewegungen werden mit dem eigenen Zufall dieses Computers gemischt, sodass der Seed nie schwächer ist als der Computer allein.",it:"Muovi il mouse, o trascina un dito, nel riquadro finché la barra non si riempie. I tuoi movimenti vengono mescolati con la casualità propria di questo computer, quindi il seed non è mai più debole del solo computer.",ja:"バーがいっぱいになるまで、枠の中でマウスを動かすか指でなぞってください。あなたの動きはこのコンピューター自身の乱数と混ぜ合わされるので、シードがコンピューター単独のものより弱くなることはありません。",ko:"막대가 다 찰 때까지 상자 안에서 마우스를 움직이거나 손가락으로 끌어 주세요. 움직임은 이 컴퓨터 자체의 무작위성과 섞이므로, 시드가 컴퓨터 혼자 만든 것보다 약해지는 일은 없습니다.",ru:"Двигайте мышью или водите пальцем по полю, пока полоса не заполнится. Ваши движения смешиваются с собственной случайностью этого компьютера, поэтому сид-фраза никогда не будет слабее, чем если бы её создал один компьютер.",tr:"Çubuk dolana kadar farenizi kutunun içinde gezdirin veya parmağınızı sürükleyin. Hareketleriniz bu bilgisayarın kendi rastgeleliğiyle karıştırılır; böylece tohum hiçbir zaman yalnızca bilgisayarın ürettiğinden daha zayıf olmaz.",id:"Gerakkan mouse, atau seret jari, di dalam kotak sampai bilahnya penuh. Gerakan Anda dicampur dengan keacakan komputer ini sendiri, sehingga seed tidak pernah lebih lemah daripada keacakan komputer itu saja.",vi:"Di chuột, hoặc kéo ngón tay, quanh khung cho đến khi thanh đầy. Chuyển động của bạn được trộn với tính ngẫu nhiên riêng của máy tính này, nên hạt giống không bao giờ yếu hơn so với chỉ dùng máy tính."})}</p>
  <div class="pad" id="pad"><span class="icon">gesture</span><b id="mcnt">${Math.min(100,Math.round(S.moves/MOVES*100))}%</b></div>

confirmA:()=>`<h1>${T('Confirm your seed','確認你的種子',{hans:"确认你的种子",es:"Confirma tu semilla",pt:"Confirme sua semente",fr:"Confirmez votre graine",de:"Seed bestätigen",it:"Conferma il tuo seed",ja:"シードを確認する",ko:"시드 확인",ru:"Подтвердите сид-фразу",tr:"Tohumunuzu onaylayın",id:"Konfirmasi seed Anda",vi:"Xác nhận hạt giống của bạn"})}</h1><p class="sub">${T('Pick the right word from your paper.','從你的紙上找出正確的字。',{hans:"从你的纸上选出正确的单词。",es:"Elige la palabra correcta de tu papel.",pt:"Escolha a palavra certa, conforme o seu papel.",fr:"Choisissez le bon mot sur votre papier.",de:"Wähle das richtige Wort von deinem Papier.",it:"Scegli la parola giusta dal tuo foglio.",ja:"紙を見て正しい単語を選んでください。",ko:"종이에서 맞는 단어를 고르세요.",ru:"Выберите правильное слово со своего листа.",tr:"Kâğıdınızdaki doğru kelimeyi seçin.",id:"Pilih kata yang benar dari kertas Anda.",vi:"Chọn từ đúng theo tờ giấy của bạn."})}</p>${quiz(S.seed||[],'A',QA)}${navRow(quizDone('A',QA))}`,
printA:()=>`${offline()}<h1>${T('Print part A','印出 A 部分',{hans:"打印 A 部分",es:"Imprime la parte A",pt:"Imprimir a parte A",fr:"Imprimez la partie A",de:"Teil A drucken",it:"Stampa la parte A",ja:"パート A を印刷",ko:"A 부분 인쇄",ru:"Напечатайте часть A",tr:"A bölümünü basın",id:"Cetak bagian A",vi:"In phần A"})}</h1>
 <div class="warn r"><span class="icon">print_disabled</span><span>${T('USB cable only, printer Wi-Fi off, no cloud printing. Switch the printer off when done so its memory clears.','只用 USB 線、關閉印表機 Wi-Fi、不用雲端列印。完成後關掉印表機電源讓記憶體清空。',{hans:"只用 USB 线，关闭打印机的 Wi-Fi，不用云打印。打印完成后关闭打印机电源，以清空其内存。",es:"Solo cable USB, Wi-Fi de la impresora desactivado, sin impresión en la nube. Apaga la impresora al terminar para que se borre su memoria.",pt:"Só cabo USB, Wi-Fi da impressora desligado, sem impressão na nuvem. Desligue a impressora ao terminar para limpar a memória dela.",fr:"Câble USB uniquement, Wi-Fi de l’imprimante coupé, pas d’impression dans le cloud. Éteignez l’imprimante à la fin pour que sa mémoire s’efface.",de:"Nur USB-Kabel, WLAN des Druckers aus, kein Cloud-Druck. Schalte den Drucker danach aus, damit sein Speicher gelöscht wird.",it:"Solo cavo USB, Wi-Fi della stampante spento, niente stampa cloud. Alla fine spegni la stampante, così la sua memoria si svuota.",ja:"USB ケーブルのみ、プリンターの Wi-Fi はオフ、クラウド印刷は使用しないこと。終わったら、メモリが消えるようにプリンターの電源を切ります。",ko:"USB 케이블만 사용하고, 프린터 Wi-Fi는 끄고, 클라우드 인쇄는 쓰지 마세요. 끝나면 메모리가 지워지도록 프린터 전원을 끄세요.",ru:"Только USB-кабель, Wi-Fi принтера выключен, без облачной печати. После печати выключите принтер, чтобы очистить его память.",tr:"Yalnızca USB kablosu, yazıcının Wi-Fi'ı kapalı, bulut baskı yok. Belleğinin temizlenmesi için iş bittiğinde yazıcıyı kapatın.",id:"Hanya kabel USB, Wi-Fi printer mati, tanpa pencetakan cloud. Matikan printer setelah selesai agar memorinya terhapus.",vi:"Chỉ dùng cáp USB, tắt Wi-Fi của máy in, không in qua đám mây. Tắt máy in khi xong để bộ nhớ của nó được xóa."})}</span></div>
 <p class="sub">${T('The computer derives every cell from your seed and saves part A, the recipient columns of cheques 1 to 11, as a file. Open it, print it, then delete it. Part B comes next, as a separate print run.','電腦由你的種子導出每一格，把 A 部分（第 1 到 11 號支票的收件帳號欄）存成檔案。打開、列印，然後刪除。B 部分接著分開列印。',{hans:"电脑根据你的种子派生出每一个格子，并把 A 部分（支票 1 到 11 的接收方列）保存为文件。打开它、打印，然后删除。接下来单独打印 B 部分。",es:"La computadora deriva cada casilla de tu semilla y guarda la parte A, las columnas del destinatario de los cheques 1 a 11, como archivo. Ábrelo, imprímelo y luego bórralo. La parte B viene después, en una tirada de impresión aparte.",pt:"O computador deriva cada célula da sua semente e salva a parte A, as colunas do destinatário dos cheques 1 a 11, como um arquivo. Abra-o, imprima-o e depois apague-o. A parte B vem a seguir, em uma impressão separada.",fr:"L’ordinateur dérive chaque case à partir de votre graine et enregistre la partie A, les colonnes du destinataire des chèques 1 à 11, dans un fichier. Ouvrez-le, imprimez-le, puis supprimez-le. La partie B suit, en un tirage séparé.",de:"Der Computer leitet jede Zelle aus deinem Seed ab und speichert Teil A, die Empfängerspalten der Schecks 1 bis 11, als Datei. Öffne sie, drucke sie und lösche sie dann. Teil B folgt als getrennter Druckvorgang.",it:"Il computer deriva ogni casella dal tuo seed e salva in un file la parte A, cioè le colonne del destinatario degli assegni da 1 a 11. Aprilo, stampalo, poi eliminalo. Segue la parte B, in una stampa separata.",ja:"コンピューターはシードからすべてのマスを導出し、パート A（小切手 1 から 11 の受取人の列）をファイルとして保存します。開いて印刷し、その後削除してください。続いてパート B を別の印刷として行います。",ko:"컴퓨터가 시드로 모든 칸을 생성하고, A 부분(수표 1번부터 11번까지의 수신인 열)을 파일로 저장합니다. 파일을 열어 인쇄한 뒤 삭제하세요. B 부분은 그다음에 별도로 인쇄합니다.",ru:"Компьютер вычисляет каждую ячейку из вашей сид-фразы и сохраняет часть A — столбцы получателя чеков с 1 по 11 — в файл. Откройте его, напечатайте, затем удалите. Далее идёт часть B, отдельной печатью.",tr:"Bilgisayar her hücreyi tohumunuzdan türetir ve A bölümünü, yani 1 ile 11 numaralı çeklerin alıcı sütunlarını bir dosya olarak kaydeder. Dosyayı açın, basın, sonra silin. Sırada ayrı bir baskı olarak B bölümü var.",id:"Komputer menurunkan setiap kotak dari seed Anda dan menyimpan bagian A, yaitu kolom penerima dari cek 1 sampai 11, sebagai berkas. Buka, cetak, lalu hapus. Bagian B menyusul, sebagai cetakan terpisah.",vi:"Máy tính tạo mọi ô từ hạt giống của bạn và lưu phần A, các cột người nhận của séc 1 đến 11, thành một tệp. Mở nó, in nó, rồi xóa nó. Tiếp theo là phần B, trong một lần in riêng."})}</p>

 <div class="warn g" ${S.printedA?'':'hidden'}><span class="icon">check_circle</span><span>${T('Part A saved. Print it, delete the file and empty the trash. Take the printout out of the room before you make part B.','A 部分已存檔。印出後刪除檔案並清空垃圾桶。做 B 部分之前，先把印好的紙拿出房間。',{hans:"A 部分已保存。打印出来后，删除文件并清空回收站。在制作 B 部分之前，先把打印件拿出房间。",es:"Parte A guardada. Imprímela, borra el archivo y vacía la papelera. Saca la copia impresa de la habitación antes de crear la parte B.",pt:"Parte A salva. Imprima-a, apague o arquivo e esvazie a lixeira. Leve a impressão para fora da sala antes de fazer a parte B.",fr:"Partie A enregistrée. Imprimez-la, supprimez le fichier et videz la corbeille. Sortez le tirage de la pièce avant de créer la partie B.",de:"Teil A gespeichert. Drucke ihn, lösche die Datei und leere den Papierkorb. Bring den Ausdruck aus dem Raum, bevor du Teil B erstellst.",it:"Parte A salvata. Stampala, elimina il file e svuota il cestino. Porta la stampa fuori dalla stanza prima di creare la parte B.",ja:"パート A を保存しました。印刷してからファイルを削除し、ごみ箱を空にしてください。パート B を作る前に、印刷物を部屋の外に持ち出してください。",ko:"A 부분이 저장되었습니다. 인쇄한 뒤 파일을 삭제하고 휴지통을 비우세요. B 부분을 만들기 전에 인쇄물을 방 밖으로 가져가세요.",ru:"Часть A сохранена. Напечатайте её, удалите файл и очистите корзину. Прежде чем создавать часть B, вынесите распечатку из комнаты.",tr:"A bölümü kaydedildi. Basın, dosyayı silin ve çöp kutusunu boşaltın. B bölümünü oluşturmadan önce çıktıyı odadan çıkarın.",id:"Bagian A tersimpan. Cetak, hapus berkasnya, dan kosongkan tempat sampah. Bawa hasil cetakan keluar ruangan sebelum Anda membuat bagian B.",vi:"Đã lưu phần A. In nó, xóa tệp và dọn sạch thùng rác. Mang bản in ra khỏi phòng trước khi bạn làm phần B."})}</span></div>

 <p class="sub">${T('Same computer, same seed: now save part B, the amount, exponent and fee columns of cheques 1 to 11. Use a different printer if you can.','同一台電腦、同一組種子：現在存下 B 部分，也就是第 1 到 11 號支票的金額、指數和手續費欄。可以的話換一台印表機。',{hans:"同一台电脑、同一组种子：现在保存 B 部分，即支票 1 到 11 的金额、指数和手续费列。如有条件，请换一台打印机。",es:"Misma computadora, misma semilla: ahora guarda la parte B, las columnas de cantidad, exponente y comisión de los cheques 1 a 11. Usa otra impresora si puedes.",pt:"Mesmo computador, mesma semente: agora salve a parte B, as colunas de valor, expoente e taxa dos cheques 1 a 11. Use outra impressora, se puder.",fr:"Même ordinateur, même graine : enregistrez maintenant la partie B, les colonnes du montant, de l’exposant et des frais des chèques 1 à 11. Utilisez une autre imprimante si vous le pouvez.",de:"Gleicher Computer, gleicher Seed: Speichere jetzt Teil B, die Spalten für Betrag, Exponent und Gebühr der Schecks 1 bis 11. Verwende, wenn möglich, einen anderen Drucker.",it:"Stesso computer, stesso seed: ora salva la parte B, cioè le colonne di importo, esponente e commissione degli assegni da 1 a 11. Usa una stampante diversa, se puoi.",ja:"同じコンピューター、同じシードで、今度はパート B（小切手 1 から 11 の数量・指数・手数料の列）を保存します。できれば別のプリンターを使ってください。",ko:"같은 컴퓨터, 같은 시드: 이제 B 부분, 즉 수표 1번부터 11번까지의 수량, 지수, 수수료 열을 저장하세요. 가능하면 다른 프린터를 사용하세요.",ru:"Тот же компьютер, та же сид-фраза: теперь сохраните часть B — столбцы суммы, экспоненты и комиссии чеков с 1 по 11. По возможности используйте другой принтер.",tr:"Aynı bilgisayar, aynı tohum: şimdi B bölümünü, yani 1 ile 11 numaralı çeklerin miktar, üs ve ücret sütunlarını kaydedin. Mümkünse farklı bir yazıcı kullanın.",id:"Komputer yang sama, seed yang sama: sekarang simpan bagian B, yaitu kolom jumlah, eksponen, dan biaya dari cek 1 sampai 11. Gunakan printer lain jika bisa.",vi:"Cùng máy tính, cùng hạt giống: giờ hãy lưu phần B, các cột số lượng, số mũ và phí của séc 1 đến 11. Dùng một máy in khác nếu có thể."})}</p>

 ${S.printedB?`<div class="regf"><span class="icon">description</span><span><b>${T('Save the registration file','儲存登記檔',{hans:"保存注册文件",es:"Guardar el archivo de registro",pt:"Salvar o arquivo de registro",fr:"Sauvegarder le fichier d’enregistrement",de:"Registrierungsdatei speichern",it:"Salva il file di registrazione",ja:"登録ファイルを保存",ko:"등록 파일 저장",ru:"Сохраните файл регистрации",tr:"Kayıt dosyasını kaydedin",id:"Simpan berkas pendaftaran",vi:"Lưu tệp đăng ký"})}</b><span class="d">${T('It holds only public hashes and your lookup code, never the seed. Carry it to any online computer to register.','檔案只有公開的雜湊值和你的查詢碼，從不包含種子。帶到任何連網的電腦就能登記。',{hans:"它只包含公开的哈希值和你的查询码，绝不包含种子。把它带到任何联网的电脑上即可注册。",es:"Solo contiene hashes públicos y tu código de consulta, nunca la semilla. Llévalo a cualquier computadora conectada para registrar.",pt:"Ele contém apenas hashes públicos e o seu código de consulta, nunca a semente. Leve-o a qualquer computador online para fazer o registro.",fr:"Il ne contient que des hachages publics et votre code de recherche, jamais la graine. Apportez-le sur n’importe quel ordinateur connecté pour enregistrer le carnet.",de:"Sie enthält nur öffentliche Hashes und deinen Suchcode, nie den Seed. Bring sie zu einem beliebigen Online-Computer, um zu registrieren.",it:"Contiene solo hash pubblici e il tuo codice di ricerca, mai il seed. Portalo su qualsiasi computer online per registrare.",ja:"含まれるのは公開ハッシュと照会コードだけで、シードは決して含まれません。オンラインのコンピューターならどれでも、持っていけば登録できます。",ko:"공개 해시와 조회 코드만 담겨 있으며, 시드는 절대 들어 있지 않습니다. 온라인 컴퓨터라면 어디로든 가져가서 등록하세요.",ru:"Он содержит только публичные хеши и ваш код поиска, но никогда не сид-фразу. Перенесите его на любой компьютер с доступом в интернет, чтобы зарегистрироваться.",tr:"Yalnızca açık hash'leri ve sorgu kodunuzu içerir, tohumu asla içermez. Kaydolmak için onu çevrimiçi herhangi bir bilgisayara götürün.",id:"Berkas ini hanya berisi hash publik dan kode pencarian Anda, tidak pernah seed. Bawa ke komputer online mana saja untuk mendaftar.", function render(){
  if(S.step===0){landing();return}
  const st=steps(), cur=st[S.step];
  qs('#back').hidden=false; qs('#prog').hidden=false;
  qs('#prog').innerHTML=st.slice(1).map((_,i)=>`<i class="${i<S.step?'on':''}"></i>`).join('');
  qs('#view').className='inner step';
  qs('#view').innerHTML=R[cur.id]();
  qs('#view').querySelectorAll('[data-qr]').forEach(async el=>{el.innerHTML=await qrSvg(el.dataset.qr)});
  if(cur.id==='honesty')watchHonesty();
  if(cur.id==='register')window.bcNodeNote(qs('#ob-node'));   // drawn by the wasm encoder after the step is on screen
  if(cur.id==='restoreSeeds') restoreCount();
  qs('.dbody').scrollTop=0;
}
function restoreCount(){const a=(qs('#ra').value.trim().split(/\s+/).filter(Boolean)).length;
  qs('#rcount').textContent=`${a}/24`;S.restoreOk=a===24;const n=qs('[data-act="next"]');if(n)n.disabled=!S.restoreOk}
function go(d){S.step=Math.max(0,Math.min(steps().length-1,S.step+d));render()}
qs('#back').onclick=()=>go(-1);
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-q]');if(!b)return;
  if(b.dataset.q){if(b.dataset.w===b.dataset.ans){S.quiz[b.dataset.q]=b.dataset.w;render()}else{b.classList.remove('no');void b.offsetWidth;b.classList.add('no')}return}
  const a=b.dataset.act;
  if(a==='next')go(1); else if(a==='back')go(-1);
  else if(a==='flow'){S.flow=b.dataset.flow;S.step=1;render()}
  else if(a==='dl'){const p=b.dataset.part;b.disabled=true;const t=document.querySelectorAll('.task');t.forEach(x=>{x.classList.add('run');x.querySelector('.icon').textContent='progress_activity'});
    download(p).then(()=>{S['printed'+p]=true;render()}).catch(()=>{b.disabled=false;t.forEach(x=>x.classList.remove('run'))})}
  else if(a==='src'){S.src=b.dataset.src;render()}
  else if(a==='mkdice'){b.disabled=true;makeSeed(new TextEncoder().encode(S.rolls))}
  else if(a==='reseed'){Object.assign(S,{seed:null,ent:'',rolls:'',moves:0,pool:[]});for(const k in S.quiz)if(k[0]==='A')delete S.quiz[k];S.checked.sA0=S.checked.sA1=false;render()}
  else if(a==='reveal'){qs('#'+b.dataset.target).classList.remove('blur')}
  else if(a==='doreg'){b.disabled=true;register(b)}
  else if(a==='savereg'){saveReg()}
  else if(a==='qrdl'){qrDownload(S.code)}
});
document.addEventListener('change',e=>{const c=e.target.closest('[data-ck]');if(!c)return;S.checked[c.dataset.ck]=c.checked;const lab=c.closest('.pi');if(lab)lab.classList.toggle('on',c.checked);const st=steps()[S.step].id;
  const need={clean:['cl',4],domainA:['dA',4],seedA:['sA',2],domainB:['sB',2],reprintRule:['rr',2]}[st];if(!need)return;
  let ok=allChecked(need[0],need[1]);qs('[data-act="next"]').disabled=!ok});
document.addEventListener('input',e=>{if(e.target.id==='ra'){S.restoreA=e.target.value;restoreCount()}
  if(e.target.id==='rolls'){const t=e.target,v=t.value.replace(/[^1-6]/g,'');S.rolls=v;if(t.value.replace(/\s/g,'')!==v)t.value=v;
    qs('#rcnt').textContent=`${v.length} / ${ROLLS}`;qs('#rbar').style.width=Math.min(100,v.length/ROLLS*100)+'%';qs('[data-act="mkdice"]').disabled=v.length<ROLLS}});
// dice: seed = SHA-256(ASCII rolls). mouse: seed = SHA-256(movements || 32 bytes from the system CSPRNG).
async function makeSeed(bytes){const e=await sha(bytes);S.ent=hex(e);S.seed=await toWords(e);render()}
let lastMv=null;
document.addEventListener('pointermove',e=>{if(S.seed||S.src!=='mouse'||!e.target.closest('#pad'))return;
  const k=e.clientX+','+e.clientY;if(k===lastMv)return;lastMv=k;S.pool.push(e.clientX,e.clientY,performance.now(),e.pressure||0);S.moves++;
  const p=Math.min(100,S.moves/MOVES*100);qs('#mbar').style.width=p+'%';qs('#mcnt').textContent=Math.round(p)+'%';
  if(S.moves===MOVES){const sys=crypto.getRandomValues(new Uint8Array(32)),mv=new Uint8Array(new Float64Array(S.pool).buffer),all=new Uint8Array(mv.length+32);all.set(mv);all.set(sys,mv.length);S.pool=[];makeSeed(all)}});

let cur=0, startT=performance.now(), paused=false;
const DUR=5200;
function drawSlides(){const sl=SL();
  qs('#slides').innerHTML=sl.map((s,i)=>`<div class="slide ${i===cur?'on':''}"><div class="scene">${s.html}</div><p class="cap">${s.cap}<small>${s.sub}</small></p></div>`).join('');
  qs('#st').textContent=String(sl.length).padStart(2,'0');show();
  const [pv,nx]=qs('#segs').querySelectorAll('button');pv.setAttribute('aria-label',T('Previous slide','上一張',{hans:"上一张",es:"Diapositiva anterior",pt:"Slide anterior",fr:"Diapositive précédente",de:"Vorherige Folie",it:"Diapositiva precedente",ja:"前のスライド",ko:"이전 슬라이드",ru:"Предыдущий слайд",tr:"Önceki slayt",id:"Slide sebelumnya",vi:"Trang trước"}));nx.setAttribute('aria-label',T('Next slide','下一張',{hans:"下一张",es:"Diapositiva siguiente",pt:"Próximo slide",fr:"Diapositive suivante",de:"Nächste Folie",it:"Diapositiva successiva",ja:"次のスライド",ko:"다음 슬라이드",ru:"Следующий слайд",tr:"Sonraki slayt",id:"Slide berikutnya",vi:"Trang tiếp"}))}
qs('#segs').querySelectorAll('button').forEach(b=>b.onclick=()=>{const n=SL().length;cur=(cur+ +b.dataset.d+n)%n;startT=performance.now();show()});
function show(){qs('#sn').textContent=String(cur+1).padStart(2,'0');qs('#slides').querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('on',i===cur));qs('#story').classList.toggle('alt',cur%2===1)}
function tick(now){
  if(!paused){const p=(now-startT)/DUR;if(p>=1){cur=(cur+1)%SL().length;startT=now;show()}}
  requestAnimationFrame(tick)}
const story=qs('#story');story.addEventListener('mouseenter',()=>{paused=true;story._pt=performance.now()});story.addEventListener('mouseleave',()=>{paused=false;startT+=performance.now()-(story._pt||performance.now())});

document.addEventListener('langchange',()=>{drawSlides();render()});
if(location.hash==='#restore'){S.flow='restore';S.step=1}
else{const i=CREATE.findIndex(s=>'#'+s.id===location.hash);if(i>0)S.step=i}
document.addEventListener('DOMContentLoaded',()=>{drawSlides();render();if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(tick)});
})();
</script>
