 return `${img('check')}<h1>${T('Check your paper','檢查你的紙本',{hans:"检查你的纸本",es:"Comprueba tu papel",pt:"Verifique o seu papel",fr:"Vérifiez votre papier",de:"Prüf dein Papier",it:"Verifica la tua carta",ja:"紙をチェックする",ko:"종이 확인",ru:"Проверьте бумагу",tr:"Kâğıdınızı kontrol edin",id:"Periksa kertas Anda",vi:"Kiểm tra giấy của bạn"})}</h1>
 <p class="sub">${T('Cheque 0 showed that your book was registered honestly. This step checks the paper itself: type six boxes from your printed sheets, picked at random, and this page compares them with what the chain holds for your book.','第 0 號支票證明了你的簿子登記得誠實。這一步檢查紙本本身：從印好的紙上輸入隨機挑出的六格，這個頁面會把它們和鏈上你的簿子比對。',{hans:"支票 0 证明了你的簿子是诚实登记的。这一步检查纸本本身：从打印好的纸上输入随机挑出的六个格子，这个页面会把它们和链上你的簿子比对。",es:"El cheque 0 demostró que tu talonario se registró de forma honesta. Este paso comprueba el propio papel: escribe seis casillas de tus hojas impresas, elegidas al azar, y esta página las compara con lo que la cadena guarda de tu talonario.",pt:"O cheque 0 mostrou que o seu talão foi registrado de forma honesta. Esta etapa verifica o próprio papel: digite seis quadros das suas folhas impressas, escolhidos ao acaso, e esta página os compara com o que a cadeia guarda do seu talão.",fr:"Le chèque 0 a montré que votre carnet a été enregistré honnêtement. Cette étape vérifie le papier lui-même : saisissez six cases de vos feuilles imprimées, choisies au hasard, et cette page les compare à ce que la chaîne détient pour votre carnet.",de:"Scheck 0 hat gezeigt, dass dein Scheckheft ehrlich registriert wurde. Dieser Schritt prüft das Papier selbst: Tipp sechs zufällig gewählte Felder von deinen gedruckten Blättern ein, und diese Seite vergleicht sie mit dem, was die Chain für dein Scheckheft hält.",it:"L’assegno 0 ha mostrato che il tuo libretto è stato registrato onestamente. Questo passaggio verifica la carta stessa: digita sei caselle dei tuoi fogli stampati, scelte a caso, e questa pagina le confronta con ciò che la catena conserva per il tuo libretto.",ja:"小切手 0 で、あなたの小切手帳が誠実に登録されたことがわかりました。このステップでは紙そのものをチェックします。印刷した用紙からランダムに選ばれた六つのマスを入力すると、このページがチェーン上のあなたの小切手帳と照合します。",ko:"수표 0번으로 수표책이 정직하게 등록되었음을 확인했습니다. 이 단계에서는 종이 자체를 확인합니다. 인쇄한 종이에서 무작위로 고른 여섯 칸을 입력하면, 이 페이지가 체인에 있는 수표책과 비교합니다.",ru:"Чек 0 показал, что ваша книжка зарегистрирована честно. Этот шаг проверяет саму бумагу: введите шесть ячеек с напечатанных листов, выбранных случайно, и эта страница сравнит их с тем, что хранит цепочка для вашей книжки.",tr:"0 numaralı çek, defterinizin dürüstçe kaydedildiğini gösterdi. Bu adım kâğıdın kendisini kontrol eder: yazdırılmış kâğıtlarınızdan rastgele seçilen altı kutuyu yazın; bu sayfa onları zincirin defteriniz için tuttuklarıyla karşılaştırır.",id:"Cek 0 menunjukkan bahwa buku Anda didaftarkan dengan jujur. Langkah ini memeriksa kertasnya sendiri: ketik enam kotak dari lembar cetakan Anda, yang dipilih secara acak, dan halaman ini membandingkannya dengan yang disimpan rantai untuk buku Anda.",vi:"Séc 0 đã cho thấy sổ séc của bạn được đăng ký một cách trung thực. Bước này kiểm tra chính tờ giấy: hãy nhập sáu ô từ các tờ đã in, được chọn ngẫu nhiên, và trang này sẽ so chúng với những gì chuỗi lưu cho sổ séc của bạn."})}</p>
 <div class="warn y"><span class="icon">info</span><span>${T('The boxes are picked at random, so a computer or printer that changed some boxes cannot know which ones you will check. If one box in four were printed wrong, six boxes would catch it about 82 times in 100; if half were wrong, 98 times in 100. Recommended, but you can skip it.','格子是隨機挑選的，所以改動了某些格子的電腦或印表機無法知道你會檢查哪幾格。如果四格中有一格印錯，六格大約 100 次能抓到 82 次；如果一半印錯，100 次能抓到 98 次。建議做，但可以略過。',{hans:"格子是随机挑选的，所以改动过某些格子的电脑或打印机无法知道你会检查哪几格。如果每四格就有一格印错，检查六格大约 100 次能发现 82 次；如果一半印错，100 次能发现 98 次。建议做，但也可以跳过。",es:"Las casillas se eligen al azar, así que un ordenador o una impresora que hubiera cambiado algunas no puede saber cuáles vas a comprobar. Si una casilla de cada cuatro estuviera mal impresa, seis casillas lo detectarían unas 82 veces de cada 100; si la mitad estuviera mal, 98 de cada 100. Recomendado, pero puedes saltarlo.",pt:"Os quadros são escolhidos ao acaso, então um computador ou impressora que tenha alterado alguns quadros não tem como saber quais você vai verificar. Se um quadro em cada quatro estivesse impresso errado, seis quadros perceberiam isso cerca de 82 vezes em 100; se metade estivesse errada, 98 vezes em 100. Recomendado, mas você pode pular.",fr:"Les cases sont choisies au hasard : un ordinateur ou une imprimante qui aurait modifié certaines cases ne peut pas savoir lesquelles vous allez vérifier. Si une case sur quatre était mal imprimée, six cases le détecteraient environ 82 fois sur 100 ; si la moitié l’était, 98 fois sur 100. Recommandé, mais vous pouvez passer cette étape.",de:"Die Felder werden zufällig gewählt, also kann ein Computer oder Drucker, der einige Felder verändert hat, nicht wissen, welche du prüfst. Wäre eines von vier Feldern falsch gedruckt, würden sechs Felder das etwa 82 von 100 Mal entdecken; wäre die Hälfte falsch, 98 von 100 Mal. Empfohlen, aber du kannst es überspringen.",it:"Le caselle sono scelte a caso, quindi un computer o una stampante che avesse cambiato alcune caselle non può sapere quali verificherai. Se una casella su quattro fosse stampata male, sei caselle se ne accorgerebbero circa 82 volte su 100; se fosse sbagliata la metà, 98 volte su 100. Consigliato, ma puoi saltarlo.",ja:"マスはランダムに選ばれるので、いくつかのマスを書き換えたコンピューターやプリンターにも、あなたがどのマスをチェックするかはわかりません。四つに一つのマスが誤って印刷されていれば、六つのマスで約 82/100 の確率で見つかります。半分が誤っていれば 98/100 です。おすすめですが、飛ばすこともできます。",ko:"칸은 무작위로 고르므로, 일부 칸을 바꾼 컴퓨터나 프린터는 어떤 칸을 확인할지 알 수 없습니다. 네 칸 중 한 칸이 잘못 인쇄되었다면 여섯 칸으로 100번 중 약 82번 잡아냅니다. 절반이 잘못되었다면 100번 중 98번입니다. 권장하지만 건너뛸 수도 있습니다.",ru:"Ячейки выбираются случайно, поэтому компьютер или принтер, изменивший какие-то ячейки, не может знать, какие вы проверите. Если бы каждая четвёртая ячейка была напечатана неверно, шесть ячеек обнаружили бы это примерно 82 раза из 100; если бы неверной была половина — 98 раз из 100. Рекомендуется, но можно пропустить.",tr:"Kutular rastgele seçilir; bu yüzden bazı kutuları değiştirmiş bir bilgisayar ya da yazıcı hangilerini kontrol edeceğinizi bilemez. Her dört kutudan biri yanlış basılmış olsaydı, altı kutu bunu 100 seferde yaklaşık 82 kez yakalardı; yarısı yanlış olsaydı 100 seferde 98 kez. Önerilir, ama atlayabilirsiniz.",id:"Kotak dipilih secara acak, jadi komputer atau printer yang mengubah beberapa kotak tidak bisa tahu kotak mana yang akan Anda periksa. Jika satu dari empat kotak salah cetak, enam kotak akan menangkapnya sekitar 82 kali dari 100; jika separuhnya salah, 98 kali dari 100. Disarankan, tetapi boleh dilewati.",vi:"Các ô được chọn ngẫu nhiên, nên một máy tính hay máy in đã thay đổi vài ô không thể biết bạn sẽ kiểm tra ô nào. Nếu cứ bốn ô có một ô in sai, sáu ô sẽ phát hiện ra khoảng 82 lần trên 100; nếu một nửa bị sai, 98 lần trên 100. Nên làm, nhưng bạn có thể bỏ qua."})}</span></div>
 <div class="warn r"><span class="icon">content_cut</span><span>${T(`All six boxes come from cheque ${P.q}. Typed into this computer they are no longer secret, so this check uses up cheque ${P.q}: cross it out on both parts. The cheque page in this browser will refuse it.`,`六格都來自第 ${P.q} 號支票。輸入這台電腦後它們就不再是秘密，所以這個檢查會用掉第 ${P.q} 號支票：請在兩部分上都把它劃掉。這個瀏覽器的支票頁面會拒絕它。`,{hans:`六个格子都来自支票 ${P.q}。输入这台电脑后它们就不再是秘密，所以这个检查会用掉支票 ${P.q}：请在两个部分上都把它划掉。这个浏览器的支票页面会拒绝它。`,es:`Las seis casillas son del cheque ${P.q}. Escritas en este ordenador ya no son secretas, así que esta comprobación gasta el cheque ${P.q}: táchalo en las dos partes. La página del cheque en este navegador lo rechazará.`,pt:`Os seis quadros são do cheque ${P.q}. Digitados neste computador, eles deixam de ser secretos, então esta verificação gasta o cheque ${P.q}: risque-o nas duas partes. A página de cheques deste navegador vai recusá-lo.`,fr:`Les six cases viennent du chèque ${P.q}. Saisies sur cet ordinateur, elles ne sont plus secrètes, donc ce contrôle consomme le chèque ${P.q} : barrez-le sur les deux parties. La page des chèques de ce navigateur le refusera.`,de:`Alle sechs Felder stammen von Scheck ${P.q}. In diesen Computer getippt, sind sie nicht mehr geheim, also verbraucht diese Prüfung Scheck ${P.q}: Streich ihn auf beiden Teilen durch. Die Scheckseite in diesem Browser lehnt ihn ab.`,it:`Tutte e sei le caselle vengono dall’assegno ${P.q}. Digitate su questo computer non sono più segrete, quindi questa verifica consuma l’assegno ${P.q}: barralo su entrambe le parti. La pagina degli assegni di questo browser lo rifiuterà.`,ja:`六つのマスはすべて小切手 ${P.q} のものです。このコンピューターに入力するともう秘密ではなくなるため、このチェックで小切手 ${P.q} は使用済みになります。両方のパートで線を引いて消してください。このブラウザの小切手ページはこの小切手を受け付けません。`,ko:`여섯 칸 모두 수표 ${P.q}번에서 나옵니다. 이 컴퓨터에 입력하면 더 이상 비밀이 아니므로, 이 확인으로 수표 ${P.q}번은 사용됩니다. 두 부분 모두에서 줄을 그어 지우세요. 이 브라우저의 수표 페이지는 이 수표를 거부합니다.`,ru:`Все шесть ячеек взяты из чека ${P.q}. Введённые на этом компьютере, они больше не секретны, поэтому эта проверка расходует чек ${P.q}: зачеркните его на обеих частях. Страница чеков в этом браузере его не примет.`,tr:`Altı kutunun hepsi ${P.q} numaralı çekten. Bu bilgisayara yazıldıklarında artık gizli değiller, bu yüzden bu kontrol ${P.q} numaralı çeki harcar: iki bölümde de üzerini çizin. Bu tarayıcıdaki çek sayfası onu reddeder.`,id:`Keenam kotak berasal dari cek ${P.q}. Setelah diketik di komputer ini, kotak itu tidak lagi rahasia, jadi pemeriksaan ini menghabiskan cek ${P.q}: coret cek itu di kedua bagian. Halaman cek di peramban ini akan menolaknya.`,vi:`Cả sáu ô đều thuộc séc ${P.q}. Khi đã nhập vào máy tính này, chúng không còn bí mật nữa, nên bước kiểm tra này dùng hết séc ${P.q}: hãy gạch bỏ nó trên cả hai phần. Trang séc trong trình duyệt này sẽ từ chối nó.`})}</span></div>

  <button class="choice" data-act="toreg"><span class="icon">upload_file</span><span><b>${T('I have the registration file','我已有登記檔',{hans:"我已有注册文件",es:"Tengo el archivo de registro",pt:"Tenho o arquivo de registro",fr:"J’ai le fichier d’enregistrement",de:"Ich habe die Registrierungsdatei",it:"Ho il file di registrazione",ja:"登録ファイルを持っています",ko:"등록 파일이 있습니다",ru:"У меня есть файл регистрации",tr:"Kayıt dosyası elimde",id:"Saya punya berkas pendaftaran",vi:"Tôi đã có tệp đăng ký"})}</b><span class="d">${T('Printed already? Register those cheques now, on any online computer.','已經印好了？現在就在任何連網的電腦上登記那些支票。',{hans:"已经打印好了？现在就在任何联网电脑上注册这些支票。",es:"¿Ya los imprimiste? Registra esos cheques ahora, en cualquier computadora con conexión.",pt:"Já imprimiu? Registre esses cheques agora, em qualquer computador online.",fr:"Déjà imprimés ? Enregistrez ces chèques maintenant, depuis n’importe quel ordinateur en ligne.",de:"Schon gedruckt? Registriere diese Schecks jetzt, auf einem beliebigen Online-Computer.",it:"Già stampati? Registra ora quegli assegni, da qualsiasi computer online.",ja:"もう印刷しましたか？オンラインのコンピューターで今すぐその小切手を登録してください。",ko:"이미 인쇄했나요? 지금 아무 온라인 컴퓨터에서나 그 수표를 등록하세요.",ru:"Уже напечатали? Зарегистрируйте эти чеки сейчас на любом компьютере с сетью.",tr:"Zaten bastınız mı? Bu çekleri şimdi herhangi bir çevrimiçi bilgisayarda kaydedin.",id:"Sudah dicetak? Daftarkan cek tersebut sekarang, di komputer online mana pun.",vi:"Đã in rồi? Đăng ký các séc đó ngay bây giờ, trên bất kỳ máy tính trực tuyến nào."})}</span></span></button>

 <div class="warn y"><span class="icon">lightbulb</span><span>${T('Reprinting a lost book works the same way, but a reprint has exactly the same cells as the lost copy. If that copy may be in someone else\'s hands, reprint only to move away: make a new book with a new seed, then sweep the whole balance to it with the next unused cheque, straight away.','重印遺失的簿子也一樣，但重印本和遺失的那本格子完全相同。如果那本可能落在別人手上，重印只為了搬走：用新種子做一本新簿子，然後立刻用下一張未用的支票把全部餘額掃過去。',{hans:"重印遗失的支票簿也是同样的步骤，但重印本与遗失的那本格子完全相同。如果那本可能落在别人手里，重印只为了搬走：用新种子做一本新支票簿，然后立即用下一张未用的支票把全部余额转过去。",es:"Reimprimir un talonario perdido funciona igual, pero una reimpresión tiene exactamente las mismas casillas que la copia perdida. Si esa copia puede estar en manos de otra persona, reimprime solo para mudarte: crea un talonario nuevo con una semilla nueva y, de inmediato, transfiere todo el saldo a él con el siguiente cheque sin usar.",pt:"Reimprimir um talão perdido funciona do mesmo jeito, mas uma reimpressão tem exatamente as mesmas células da cópia perdida. Se essa cópia pode estar nas mãos de outra pessoa, reimprima só para se mudar: crie um talão novo com uma semente nova e transfira todo o saldo para ele com o próximo cheque não usado, imediatamente.",fr:"Réimprimer un carnet perdu fonctionne de la même façon, mais une réimpression a exactement les mêmes cases que la copie perdue. Si cette copie peut être entre les mains de quelqu’un d’autre, réimprimez uniquement pour partir : créez un nouveau carnet avec une nouvelle graine, puis transférez-y tout le solde avec le prochain chèque inutilisé, sans attendre.",de:"Ein verlorenes Scheckheft nachzudrucken geht genauso, aber ein Nachdruck hat genau dieselben Felder wie die verlorene Kopie. Wenn diese Kopie in fremden Händen sein könnte, drucke nur nach, um umzuziehen: Erstelle ein neues Scheckheft mit einem neuen Seed und überweise sofort das ganze Guthaben mit dem nächsten unbenutzten Scheck dorthin.",it:"Ristampare un libretto perso funziona allo stesso modo, ma una ristampa ha esattamente le stesse caselle della copia persa. Se quella copia può essere nelle mani di qualcun altro, ristampa solo per trasferirti: crea un nuovo libretto con un nuovo seed, poi sposta subito tutto il saldo su di esso con il prossimo assegno non usato.",ja:"紛失した小切手帳の再印刷も同じ手順ですが、再印刷したものは紛失したものとまったく同じマスを持ちます。紛失した小切手帳が誰かの手に渡っているおそれがあるなら、再印刷は移行のためだけにしてください。新しいシードで新しい小切手帳を作り、次の未使用の小切手ですぐに残高をすべてそちらへ移します。",ko:"잃어버린 수표책의 재인쇄도 같은 방식이지만, 재인쇄본은 잃어버린 수표책과 칸이 완전히 같습니다. 그 수표책이 다른 사람 손에 있을 수 있다면, 옮기기 위해서만 재인쇄하세요. 새 시드로 새 수표책을 만들고, 사용하지 않은 다음 수표로 잔액 전체를 곧바로 그쪽으로 옮기세요.",ru:"Перепечатка потерянной книжки делается так же, но в перепечатке ровно те же ячейки, что и в потерянной копии. Если эта копия может оказаться в чужих руках, перепечатывайте только для переезда: создайте новую книжку с новой сид-фразой и сразу переведите на неё весь баланс следующим неиспользованным чеком.",tr:"Kayıp bir defteri yeniden basmak da aynı şekilde yapılır, ama yeniden basılan defter kayıp kopyayla tamamen aynı hücrelere sahiptir. O kopya başkasının elinde olabilirse, yalnızca taşınmak için yeniden basın: yeni bir tohumla yeni bir defter oluşturun, ardından sıradaki kullanılmamış çekle tüm bakiyeyi hemen ona aktarın.",id:"Mencetak ulang buku yang hilang caranya sama, tetapi cetakan ulang memiliki kotak yang persis sama dengan salinan yang hilang. Jika salinan itu mungkin ada di tangan orang lain, cetak ulang hanya untuk pindah: buat buku baru dengan seed baru, lalu segera sapu seluruh saldo ke buku itu dengan cek berikutnya yang belum terpakai.",vi:"In lại sổ bị mất cũng làm như vậy, nhưng bản in lại có các ô giống hệt bản bị mất. Nếu bản đó có thể đang nằm trong tay người khác, chỉ in lại để chuyển đi: tạo một sổ mới bằng hạt giống mới, rồi dùng tờ séc chưa dùng tiếp theo chuyển toàn bộ số dư sang đó ngay lập tức."})}</span></div>`,
mseed:()=>`${offline()}<h1>${T('Type your seed','輸入你的種子',{hans:"输入你的种子",es:"Escribe tu semilla",pt:"Digite sua semente",fr:"Saisissez votre graine",de:"Seed eingeben",it:"Inserisci il seed",ja:"シードを入力",ko:"시드 입력",ru:"Введите сид-фразу",tr:"Tohumunuzu yazın",id:"Ketik seed Anda",vi:"Nhập hạt giống"})}</h1>
 <p class="sub">${T('The 24 words of the book you are adding to, in order. Only on this clean, offline computer; they are never saved or sent.','你要加印的那本簿子的 24 個字，依序輸入。只在這台乾淨、離線的電腦上；它們不會被儲存或傳送。',{hans:"你要加印的那本支票簿的 24 个词，按顺序输入。只在这台干净、离线的电脑上输入；它们不会被保存或发送。",es:"Las 24 palabras del talonario al que añades cheques, en orden. Solo en esta computadora limpia y sin conexión; nunca se guardan ni se envían.",pt:"As 24 palavras do talão ao qual você está adicionando cheques, em ordem. Só neste computador limpo e offline; elas nunca são salvas nem enviadas.",fr:"Les 24 mots du carnet que vous complétez, dans l’ordre. Uniquement sur cet ordinateur propre et hors ligne ; ils ne sont jamais enregistrés ni envoyés.",de:"Die 24 Wörter des Scheckhefts, das du erweiterst, der Reihe nach. Nur auf diesem sauberen Offline-Computer; sie werden nie gespeichert oder gesendet.",it:"Le 24 parole del libretto a cui aggiungi assegni, in ordine. Solo su questo computer pulito e offline; non vengono mai salvate né inviate.",ja:"小切手を追加する小切手帳の 24 語を順番どおりに。このクリーンなオフラインのコンピューターでだけ入力し、保存も送信もされません。",ko:"수표를 추가할 수표책의 24개 단어를 순서대로 입력하세요. 이 깨끗한 오프라인 컴퓨터에서만 입력하며, 저장되거나 전송되지 않습니다.",ru:"24 слова книжки, к которой вы добавляете чеки, по порядку. Только на этом чистом компьютере без сети; они нигде не сохраняются и не отправляются.",tr:"Çek eklediğiniz defterin 24 kelimesi, sırasıyla. Yalnızca bu temiz, çevrimdışı bilgisayarda; asla kaydedilmez veya gönderilmez.",id:"24 kata dari buku yang Anda tambahkan ceknya, berurutan. Hanya di komputer yang bersih dan offline ini; kata-kata itu tidak pernah disimpan atau dikirim.",vi:"24 từ của sổ bạn đang in thêm, theo đúng thứ tự. Chỉ nhập trên máy tính sạch, ngoại tuyến này; chúng không bao giờ được lưu hay gửi đi."})}</p>

ampai 255. Mulailah setelah cek tertinggi yang sudah Anda miliki: penjelajah blok menampilkan cek terakhir yang Anda pakai, dan nomor yang sama atau lebih kecil tidak akan pernah bisa dipakai lagi.",vi:"Một sổ có séc số 1 đến 255. Hãy bắt đầu sau séc có số lớn nhất bạn đang có: trình khám phá hiển thị séc bạn dùng gần nhất, và số bằng hoặc nhỏ hơn số đó không bao giờ dùng lại được."})}</p>

function render(){
  if(S.step===0){landing();return}
  const st=steps(), cur=st[S.step];
  qs('#back').hidden=false; qs('#prog').hidden=false;
  qs('#prog').innerHTML=st.slice(1).map((_,i)=>`<i class="${i<S.step?'on':''}"></i>`).join('');
  qs('#view').className='inner step';
  qs('#view').innerHTML=R[cur.id]();
  qs('#view').querySelectorAll('[data-qr]').forEach(async el=>{el.innerHTML=await qrSvg(el.dataset.qr)});
  if(cur.id==='honesty'){watchHonesty();if(S.hon2==='differ'){clearTimeout(honTimer);honTimer=setTimeout(recheck,10000)}}
  if(cur.id==='register')window.bcNodeNote(qs('#ob-node'));   // drawn by the wasm encoder after the step is on screen
  qs('.dbody').scrollTop=0;
}
function go(d){do{S.step=Math.max(0,Math.min(steps().length-1,S.step+d))}while(skip(steps()[S.step].id)&&S.step>0&&S.step<steps().length-1);
  const id=steps()[S.step].id;if(['register','honesty','paper','done','mdone'].includes(id))wipeSeed();
  if(!S.seed&&['confirmA','printA','domainB'].includes(id))S.step=CREATE.findIndex(s=>s.id==='seedA');
  if(!S.mseed&&id==='mprint')S.step=MORE.findIndex(s=>s.id==='mseed');
  render()}
qs('#back').onclick=()=>go(-1);
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-q]');if(!b)return;
  // quiz: the right word is looked up in memory, never kept in the page
  if(b.dataset.q){if(S.seed&&b.dataset.w===S.seed[+b.dataset.q.slice(1)]){S.quiz[b.dataset.q]=b.dataset.w;render()}else{b.classList.remove('no');void b.offsetWidth;b.classList.add('no');const k=b.dataset.q;setTimeout(()=>{delete S.qopts[k];render()},600)}return}
  const a=b.dataset.act;
  if(a==='next')go(1); else if(a==='back')go(-1);
  else if(a==='flow'){S.flow=b.dataset.flow;S.step=1;render()}
  else if(a==='dl'){const p=b.dataset.part;b.disabled=true;const t=document.querySelectorAll('.task');t.forEach(x=>{x.classList.add('run');x.querySelector('.icon').textContent='progress_activity'});
    download(p).then(()=>{S['printed'+p]=true;render()}).catch(e=>failed(b,e))}
  else if(a==='src'){S.src=b.dataset.src;render()}
  else if(a==='count'){if(S.last!==+b.dataset.n){S.last=+b.dataset.n;resetPrint()}render()}
  else if(a==='toreg'){S.step=MORE.findIndex(s=>s.id==='register');wipeSeed();render()}
  else if(a==='tomore'){S.flow='more';S.step=1;render()}
  else if(a==='mchip'){const k=b.dataset.k,f=Math.max(1,S.mfrom||1);S.mto=k==='all'?255:Math.min(255,Math.ceil((f+ +k)/16)*16-1);resetMore();render()}
  else if(a==='mdl'){const p=b.dataset.part;b.disabled=true;
    (async()=>BCBook.save(`bitcheque-part-${p}-cheques-${S.mfrom}-${S.mto}.html`,await BCBook.sheet({part:p,seed:S.mseed,first:S.mfrom,last:S.mto,mod:await WASM,base:siteBase()}),'text/html'))()
      .then(()=>{S['m'+p]=true;render()}).catch(e=>failed(b,e))}
  else if(a==='msavereg'){b.disabled=true;(async()=>{S.reg=await BCBook.registration({seed:S.mseed,first:S.mfrom,last:S.mto,mod:await WASM});S.code=S.reg.code;S.sent=false;S.honest=false;S.checked.rg0=false;
      BCBook.save(BCBook.regName(S.reg),JSON.stringify(S.reg),'application/json')})().then(()=>{S.mR=true;render()}).catch(e=>failed(b,e))}
  else if(a==='mkdice'){const why=diceBad(S.rolls);if(why){qs('#rerr').textContent=why;return}b.disabled=true;makeSeed(new TextEncoder().encode(S.rolls))}
  else if(a==='reseed'){Object.assign(S,{seed:null,ent:'',rolls:'',moves:0,pool:[]});for(const o of [S.quiz,S.qopts])for(const k in o)if(k[0]==='A')delete o[k];S.checked.sA0=S.checked.sA1=false;resetPrint();render()}
  else if(a==='reveal'){qs('#'+b.dataset.target).classList.remove('blur')}
  else if(a==='doreg'){b.disabled=true;register(b)}
  else if(a==='savereg'){b.disabled=true;saveReg().catch(e=>failed(b,e))}
  else if(a==='qrdl'){qrDownload(S.code)}
  else if(a==='pcheck'){b.disabled=true;paperCheck().then(render)}
});
document.addEventListener('change',e=>{const c=e.target.closest('[data-ck]');if(!c)return;S.checked[c.dataset.ck]=c.checked;const lab=c.closest('.pi');if(lab)lab.classList.toggle('on',c.checked);const st=steps()[S.step].id;
  if(st==='register'){const b=qs('[data-act="doreg"]');if(b)b.disabled=!(S.reg&&S.checked.rg0);return}
  const need={clean:['cl',4],domainA:['dA',4],seedA:['sA',2],domainB:['sB',2],mprint:['mP',2]}[st];if(!need)return;
  let ok=allChecked(need[0],need[1]);qs('[data-act="next"]').disabled=!ok});
document.addEventListener('input',async e=>{
  // the seed for printing more: re-render only when it turns valid or invalid, so typing keeps its place
  if(e.target.id==='mseed'){S.mwords=e.target.value;const n=S.mwords.trim().split(/\s+/).filter(Boolean).length,was=!!S.mseed;
    S.mseed=n===24?await BCBook.seedFromWords(S.mwords):null;resetMore();
    if(S.mseed){S.mcode=await BCBook.lookupCode(S.mseed,await WASM)}
    if(!!S.mseed!==was){render();const t=qs('#mseed');if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length)}}
    else qs('#mcnt').textContent=n===24&&!S.mseed?T('These words are not a valid seed: check the spelling and the order.','這些字不是有效的種子：請檢查拼字和順序。',{hans:"这些词不是有效的种子：请检查拼写和顺序。",es:"Estas palabras no son una semilla válida: revisa la ortografía y el orden.",pt:"Estas palavras não formam uma semente válida: confira a ortografia e a ordem.",fr:"Ces mots ne forment pas une graine valide : vérifiez l’orthographe et l’ordre.",de:"Diese Wörter sind kein gültiger Seed: Prüf Schreibweise und Reihenfolge.",it:"Queste parole non sono un seed valido: controlla l'ortografia e l'ordine.",ja:"これらの語は有効なシードではありません。綴りと順番を確認してください。",ko:"이 단어들은 유효한 시드가 아닙니다. 철자와 순서를 확인하세요.",ru:"Эти слова не являются верной сид-фразой: проверьте написание и порядок.",tr:"Bu kelimeler geçerli bir tohum değil: yazımı ve sırayı kontrol edin.",id:"Kata-kata ini bukan seed yang valid: periksa ejaan dan urutannya.",vi:"Những từ này không phải hạt giống hợp lệ: hãy kiểm tra chính tả và thứ tự."}):`${n} / 24`}
  if(e.target.dataset.pb&&S.paper){S.paper.words[+e.target.dataset.pb]=e.target.value;paperMark()}
  if(e.target.id==='mfrom'||e.target.id==='mto'){S[e.target.id]=+e.target.value;resetMore();qs('#mrinfo').textContent=mrangeInfo();const nx=qs('[data-act="next"]');if(nx)nx.disabled=!mrangeOk()}
  if(e.target.id==='rolls'){const t=e.target,v=t.value.replace(/[^1-6]/g,'');S.rolls=v;qs('#rerr').textContent='';if(t.value.replace(/\s/g,'')!==v)t.value=v;
    qs('#rcnt').textContent=`${v.length} / ${ROLLS}`;qs('#rbar').style.width=Math.min(100,v.length/ROLLS*100)+'%';qs('[data-act="mkdice"]').disabled=v.length<ROLLS}});
// Rolls that are plainly not from a fair die are refused: one face far too often or too rarely (chi-square over the six
// faces above 20.5, which fair rolls reach about once in a thousand), the same face nine or more times in a row, or a
// pattern: 99 fair rolls show about 34 of the 36 possible neighbouring pairs, and fewer than 24 almost never.
function diceBad(r){const n=r.length,e=n/6,cnt=[1,2,3,4,5,6].map(f=>r.split(String(f)).length-1);
  if(cnt.reduce((a,c)=>a+(c-e)*(c-e)/e,0)>20.5)return T('These rolls are too uneven to come from a fair die: some faces turn up far too often or too rarely. Roll again with a real die, and type every result as it lands.','這些骰子結果太不平均，不像來自公正的骰子：有些點數出現得太多或太少。請用真正的骰子重擲，每擲一次就輸入結果。',{hans:"这些掷骰结果太不均匀，不像来自公正的骰子：有些点数出现得太多或太少。请用真正的骰子重掷，每掷一次就输入结果。",es:"Estas tiradas son demasiado desiguales para venir de un dado justo: algunas caras salen demasiadas veces o demasiado pocas. Vuelve a tirar con un dado de verdad y escribe cada resultado en cuanto salga.",pt:"Estes lançamentos são desiguais demais para vir de um dado honesto: algumas faces aparecem vezes demais ou de menos. Jogue de novo com um dado de verdade e digite cada resultado assim que ele sair.",fr:"Ces lancers sont trop inégaux pour venir d’un dé équilibré : certaines faces sortent bien trop souvent ou trop rarement. Relancez avec un vrai dé, et tapez chaque résultat dès qu’il tombe.",de:"Diese Würfe sind zu ungleichmäßig für einen fairen Würfel: Manche Augenzahlen kommen viel zu oft oder zu selten. Würfle neu mit einem echten Würfel und tippe jedes Ergebnis ein, sobald es fällt.",it:"Questi lanci sono troppo irregolari per venire da un dado equo: alcune facce escono troppo spesso o troppo di rado. Rilancia con un dado vero e scrivi ogni risultato appena esce.",ja:"これらの出目は偏りが大きすぎて、公正なサイコロのものとは思えません。出すぎる目や少なすぎる目があります。本物のサイコロで振り直し、出た目をそのつど入力してください。",ko:"이 주사위 결과는 너무 고르지 않아 공정한 주사위에서 나온 것으로 보기 어렵습니다. 어떤 눈은 너무 자주, 어떤 눈은 너무 드물게 나왔습니다. 진짜 주사위로 다시 굴리고, 나올 때마다 결과를 입력하세요.",ru:"Эти броски слишком неравномерны для честного кубика: одни грани выпадают слишком часто, другие слишком редко. Бросьте заново настоящий кубик и вводите каждый результат сразу, как он выпал.",tr:"Bu atışlar adil bir zardan gelemeyecek kadar dengesiz: bazı yüzler çok sık, bazıları çok seyrek geliyor. Gerçek bir zarla yeniden atın ve her sonucu gelir gelmez yazın.",id:"Hasil lemparan ini terlalu tidak merata untuk berasal dari dadu yang adil: beberapa sisi muncul terlalu sering atau terlalu jarang. Lempar ulang dengan dadu sungguhan, dan ketik setiap hasil begitu dadu berhenti.",vi:"Các lần gieo này quá chênh lệch để đến từ một con xúc xắc công bằng: có mặt ra quá nhiều, có mặt ra quá ít. Hãy gieo lại bằng một con xúc xắc thật và nhập từng kết quả ngay khi nó dừng."});
  if(/(.)\1{8}/.test(r))return T('The same number comes up nine or more times in a row, which a fair die almost never does. Roll again with a real die, and type every result as it lands.','同一個點數連續出現九次以上，公正的骰子幾乎不會這樣。請用真正的骰子重擲，每擲一次就輸入結果。',{hans:"同一个点数连续出现九次或更多，公正的骰子几乎不会这样。请用真正的骰子重掷，每掷一次就输入结果。",es:"El mismo número sale nueve veces seguidas o más, algo que un dado justo casi nunca hace. Vuelve a tirar con un dado de verdad y escribe cada resultado en cuanto salga.",pt:"O mesmo número aparece nove vezes seguidas ou mais, algo que um dado honesto quase nunca faz. Jogue de novo com um dado de verdade e digite cada resultado assim que ele sair.",fr:"Le même nombre sort neuf fois de suite ou plus, ce qu’un dé équilibré ne fait presque jamais. Relancez avec un vrai dé, et tapez chaque résultat dès qu’il tombe.",de:"Dieselbe Zahl kommt neunmal oder öfter hintereinander, was ein fairer Würfel fast nie tut. Würfle neu mit einem echten Würfel und tippe jedes Ergebnis ein, sobald es fällt.",it:"Lo stesso numero esce nove o più volte di fila, cosa che un dado equo non fa quasi mai. Rilancia con un dado vero e scrivi ogni risultato appena esce.",ja:"同じ目が九回以上続けて出ています。公正なサイコロではまず起こりません。本物のサイコロで振り直し、出た目をそのつど入力してください。",ko:"같은 숫자가 아홉 번 이상 연속으로 나왔습니다. 공정한 주사위에서는 거의 일어나지 않는 일입니다. 진짜 주사위로 다시 굴리고, 나올 때마다 결과를 입력하세요.",ru:"Одно и то же число выпало девять раз подряд или больше, чего у честного кубика почти не бывает. Бросьте заново настоящий кубик и вводите каждый результат сразу, как он выпал.",tr:"Aynı sayı art arda dokuz kez ya da daha fazla geliyor; adil bir zar bunu neredeyse hiç yapmaz. Gerçek bir zarla yeniden atın ve her sonucu gelir gelmez yazın.",id:"Angka yang sama muncul sembilan kali berturut-turut atau lebih, hal yang hampir tidak pernah terjadi pada dadu yang adil. Lempar ulang dengan dadu sungguhan, dan ketik setiap hasil begitu dadu berhenti.",vi:"Cùng một số xuất hiện chín lần liên tiếp trở lên, điều mà xúc xắc công bằng gần như không bao giờ làm. Hãy gieo lại bằng một con xúc let cur=0, startT=performance.now(), paused=false;
const DUR=5200;
function drawSlides(){const sl=SL();
  qs('#slides').innerHTML=sl.map((s,i)=>`<div class="slide ${i===cur?'on':''}"><div class="scene">${s.html}</div><p class="cap">${s.cap}<small>${s.sub}</small></p></div>`).join('');
  qs('#st').textContent=String(sl.length).padStart(2,'0');show();
  const [pv,nx]=qs('#segs').querySelectorAll('button');pv.setAttribute('aria-label',T('Previous slide','上一張',{hans:"上一张",es:"Diapositiva anterior",pt:"Slide anterior",fr:"Diapositive précédente",de:"Vorherige Folie",it:"Diapositiva precedente",ja:"前のスライド",ko:"이전 슬라이드",ru:"Предыдущий слайд",tr:"Önceki slayt",id:"Slide sebelumnya",vi:"Trang trước"}));nx.setAttribute('aria-label',T('Next slide','下一張',{hans:"下一张",es:"Diapositiva siguiente",pt:"Próximo slide",fr:"Diapositive suivante",de:"Nächste Folie",it:"Diapositiva successiva",ja:"次のスライド",ko:"다음 슬라이드",ru:"Следующий слайд",tr:"Sonraki slayt",id:"Slide berikutnya",vi:"Trang tiếp"}))}
qs('#segs').querySelectorAll('button').forEach(b=>b.onclick=()=>{const n=SL().length;cur=(cur+ +b.dataset.d+n)%n;startT=performance.now();show()});
function show(){qs('#sn').textContent=String(cur+1).padStart(2,'0');qs('#slides').querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('on',i===cur));qs('#story').classList.toggle('alt',cur%2===1)}
function tick(now){
  if(!paused){const p=(now-startT)/DUR;if(p>=1){cur=(cur+1)%SL().length;startT=now;show()}}
  requestAnimationFrame(tick)}
const story=qs('#story');story.addEventListener('mouseenter',()=>{paused=true;story._pt=performance.now()});story.addEventListener('mouseleave',()=>{paused=false;startT+=performance.now()-(story._pt||performance.now())});

document.addEventListener('langchange',()=>{drawSlides();render()});
// leaving the page (or Back from another page) forgets the seed, the dice rolls and typed boxes, and clears them from the
// page, so a copy restored from the browser's back-forward cache holds none of them
addEventListener('pagehide',()=>{wipeSeed();if(S.paper)S.paper.words={};document.querySelectorAll('#rolls,#mseed,[data-pb]').forEach(t=>t.value='');qs('#view').innerHTML=''});
addEventListener('pageshow',e=>{if(e.persisted)go(0)});
// #more (and the old #restore) open the print-more flow, #register its register step; other hashes pick a create step
if(['#more','#restore','#register'].includes(location.hash)){S.flow='more';S.step=location.hash==='#register'?MORE.findIndex(s=>s.id==='register'):1}
else{const i=CREATE.findIndex(s=>'#'+s.id===location.hash);if(i>0)S.step=['confirmA','printA','domainB'].includes(CREATE[i].id)?CREATE.findIndex(s=>s.id==='seedA'):i}
document.addEventListener('DOMContentLoaded',()=>{drawSlides();render();if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(tick)});
})();
