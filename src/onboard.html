// registration file never goes stale: io = registration || anchor (32, GET /tip unhexed as given) || target (32).
const anchored=mod=>WebAssembly.Module.exports(mod).some(e=>e.name==='commits');
async function mineInput(base,mod,txHex,target){

  if(!(+(await (await fetch(base+'/height')).text())>=1))throw new Error(T('the network has no block after genesis yet; wait for block 1','網路在創世區塊之後還沒有區塊；請等第 1 個區塊'));
  const tip=(await (await fetch(base+'/tip')).text()).trim();

async function register(btn){const l=qs('#pow-l'),bar=qs('#pow');

    const limbs=(await (await fetch(base+'/regtarget')).text()).trim().split(/\s+/);
    const target=Uint8Array.from(limbs.flatMap(h=>h.match(/../g).reverse().map(x=>parseInt(x,16))));
    const expect=Math.pow(2,256)/limbs.reduceRight((a,h)=>a*2**64+parseInt(h,16),0),total=expect*txs.length;
    const cores=Math.max(1,Math.min(16,(navigator.hardwareConcurrency||4)-1)),url=URL.createObjectURL(new Blob([WORKER],{type:'text/javascript'}));

            else if(d.done){done+=d.done;const s=(Date.now()-t0)/1000,rate=done/s;bar.style.width=Math.min(97,done/total*100)+'%';
              const tries=(done/1e6).toFixed(0),secs=Math.max(1,Math.round((total-done)/rate)),n=i+1,of=txs.length;

  qs('.dbody').scrollTop=0;
}
function go(d){do{S.step=Math.max(0,Math.min(steps().length-1,S.step+d))}while(skip(steps()[S.step].id)&&S.step>0&&S.step<steps().length-1);
  const id=steps()[S.step].id;if(['register','honesty','paper','done','mdone'].includes(id))wipeSeed();
  if(!S.seed&&['confirmA','printA','domainB'].includes(id))S.step=CREATE.findIndex(s=>s.id==='seedA');
  if(!S.mseed&&id==='mprint')S.step=MORE.findIndex(s=>s.id==='mseed');
  render()}

      BCBook.save(BCBook.regName(S.reg),JSON.stringify(S.reg),'application/json')})().then(()=>{S.mR=true;render()}).catch(e=>failed(b,e))}
  else if(a==='mkdice'){const why=diceBad(S.rolls);if(why){qs('#rerr').textContent=why;return}b.disabled=true;makeSeed(new TextEncoder().encode(S.rolls))}
  else if(a==='reseed'){Object.assign(S,{seed:null,ent:'',rolls:'',moves:0,pool:[]});for(const k in S.quiz)if(k[0]==='A')delete S.quiz[k];S.checked.sA0=S.checked.sA1=false;resetPrint();render()}
  else if(a==='reveal'){qs('#'+b.dataset.target).classList.remove('blur')}

  if(e.target.id==='rolls'){const t=e.target,v=t.value.replace(/[^1-6]/g,'');S.rolls=v;qs('#rerr').textContent='';if(t.value.replace(/\s/g,'')!==v)t.value=v;

// Rolls that are plainly not from a fair die are refused: one face far too often or too rarely (chi-square over the six
// faces above 20.5, which fair rolls reach about once in a thousand), the same face nine or more times in a row, or a
// pattern: 99 fair rolls show about 34 of the 36 possible neighbouring pairs, and fewer than 24 almost never.
function diceBad(r){const n=r.length,e=n/6,cnt=[1,2,3,4,5,6].map(f=>r.split(String(f)).length-1);
  if(cnt.reduce((a,c)=>a+(c-e)*(c-e)/e,0)>20.5)return T('These rolls are too uneven to come from a fair die: some faces turn up far too often or too rarely. Roll again with a real die, and type every result as it lands.','這些骰子結果太不平均，不像來自公正的骰子：有些點數出現得太多或太少。請用真正的骰子重擲，每擲一次就輸入結果。');
  if(/(.)\1{8}/.test(r))return T('The same number comes up nine or more times in a row, which a fair die almost never does. Roll again with a real die, and type every result as it lands.','同一個點數連續出現九次以上，公正的骰子幾乎不會這樣。請用真正的骰子重擲，每擲一次就輸入結果。');
  if(new Set([...r].slice(1).map((x,i)=>r[i]+x)).size<24)return T('These rolls follow a pattern, which a fair die does not make. Roll again with a real die, and type every result as it lands.','這些骰子結果有規律，公正的骰子不會這樣。請用真正的骰子重擲，每擲一次就輸入結果。');
  return ''}

const mg=(digits)=>`<div class="mg">${[...Array(10)].map((_,r)=>[...Array(18)].map((_,c)=>`<i class="${digits&&digits[c]==String(r)?'y':''}"></i>`).join('')).join('')}</div>`;
const SL=()=>[
 {cap:T('Your keys, on paper','你的金鑰，寫在紙上'),sub:T('One book, up to 255 cheques, printed as you need them.','一本簿子，最多 255 張支票，需要時再印。'),html:`<img class="sx" src="assets/engr/vault.webp" alt="">
  
  <div class="dc tex f1" style="left:22%;top:26%;width:58%;height:32%"><div class="row"><span class="av" style="background:#1d222b"></span><span class="t">${T('Your cheque book','你的支票簿')}</span></div><div class="bar" style="width:22%;margin-top:22px"></div><div class="big">21.00000000</div><div class="t" style="margin-top:2px">12CD-29D7-915E</div></div>
  
  <div class="dc" style="left:16%;top:61%;width:56%"><div class="row"><span class="av" style="background:rgba(166,215,184,.15);color:#A6D7B8"><span class="icon" style="font-size:16px">check</span></span><span style="flex:1">${T('Cheque 0 · honesty check','第 0 號 · 誠實檢查')}<br><span class="g">${T('confirmed','已確認')}</span></span><span class="bar" style="width:24%"></span></div></div>
  <div class="dc" style="left:8%;top:73%;width:56%"><div class="row"><span class="av" style="background:rgba(255,147,65,.15);color:var(--brand)"><span class="icon" style="font-size:16px">edit</span></span><span style="flex:1">${T('Cheques 1 – 15','第 1 – 15 號')}<br><span class="t">${T('unused','未使用')}</span></span><span class="bar" style="width:24%"></span></div></div>`},
 {cap:T('Signed by hand','親手簽名'),sub:T('Each digit points at one cell. Copy or scan it, and you have signed.','每個數字指到一格，抄下或掃描就完成簽名。'),html:`<img class="sx" src="assets/engr/sign.webp" alt="">
  
  <div class="dc tex f1" style="left:10%;top:22%;width:80%"><div class="row"><span class="t">${T('Cheque No. 7','支票 第 7 號')}</span><span style="margin-left:auto" class="t mono">00000048213-5 · 1500e5</span></div>${mg('000000482135150052')}</div>
  `},
 {cap:T('Printed in two parts','分兩部分印出'),sub:T('One seed, two print runs: part A holds the recipient, part B the amount. Keep them apart.','一組種子、兩次列印：A 部分是收件人，B 部分是金額。分開存放。'),html:`<img class="sx" src="assets/engr/offline.webp" alt="">
  <div class="dc tex f1" style="left:22%;top:40%;width:56%;height:40%;--r:-3deg"><div class="t">${T('Part A · recipient','A 部分 · 收件帳號')}</div><div class="big" style="font-size:22px">A</div>${mg()}</div>
  <div class="dc tex f2" style="left:58%;top:52%;width:34%;height:34%;--r:5deg"><div class="t">${T('Part B · amount','B 部分 · 金額')}</div><div class="big" style="font-size:22px">B</div></div>`},
 {cap:T('Checked by hashes only','只用雜湊驗證'),sub:T('No signature algorithm. The chain compares SHA-256 results.','沒有簽章演算法，鏈只比對 SHA-256 結果。'),html:`<img class="sx" src="assets/engr/seal.webp" alt="">
  
  <div class="dc tex f1" style="left:14%;top:28%;width:72%">${[['P1·0','9f1c…0b2a'],['P2·0','77e0…41cd'],['P12·5','03a4…9ef1'],['D1·1','5e5e…c3a0']].map(r=>`<div class="row" style="margin:8px 0"><span class="mono t" style="width:46px">${r[0]}</span><span class="mono" style="flex:1">${r[1]}</span><span class="g"><span class="icon" style="font-size:16px">check_circle</span></span></div>`).join('')}</div>
  `},
 {cap:T('Quantum-safe by construction','天生抗量子'),sub:T('No elliptic curves anywhere. 2^128 classical, 2^64 quantum steps.','完全沒有橢圓曲線。傳統 2^128，量子 2^64 步。'),html:`<img class="sx" src="assets/engr/quantum.webp" alt="">
  
  <div class="dc tex f1" style="left:16%;top:30%;width:60%;text-align:center;padding:26px"><span class="icon" style="font-size:44px;color:var(--brand)">shield</span><div class="big" style="margin-top:8px">SHA-256</div><div class="t">${T('0 curves · 0 dependencies','0 條曲線 · 0 依賴')}</div></div>`},
 {cap:T('Recorded on the chain','記錄在鏈上'),sub:T('The chain remembers which cheques are used, so you never have to.','鏈記住哪些支票已用，你永遠不必記。'),html:`<img class="sx" src="assets/engr/chain.webp" alt="">
  ${[0,1,2,3,4].map(k=>`<div class="cube ${k===4?'f1':''}" style="left:${8+k*17}%;top:${54-k*8}%"><svg viewBox="0 0 46 46"><path d="M23 3 42 13 42 33 23 43 4 33 4 13Z" fill="${k===4?'#FF9341':'#0C0F14'}" stroke="#0C0F14" stroke-width="2"/><path d="M4 13 23 23 42 13M23 23V43" stroke="${k===4?'#0C0F14':'rgba(245,248,255,.25)'}" stroke-width="2" fill="none"/></svg></div>`).join('')}
  <div class="dc f2" style="left:44%;top:16%;width:46%"><div class="t">${T('Block','區塊')} #1,204</div><div class="row" style="margin-top:8px"><span class="mono">piece ×18</span><span class="g" style="margin-left:auto">${T('confirmed','已確認')}</span></div></div>`}];
let cur=0, startT=performance.now(), paused=false;
const DUR=5200;
function drawSlides(){const sl=SL();
  qs('#slides').innerHTML=sl.map((s,i)=>`<div class="slide ${i===cur?'on':''}"><div class="scene">${s.html}</div><p class="cap">${s.cap}<small>${s.sub}</small></p></div>`).join('');
  qs('#st').textContent=String(sl.length).padStart(2,'0');show();
  const [pv,nx]=qs('#segs').querySelectorAll('button');pv.setAttribute('aria-label',T('Previous slide','上一張'));nx.setAttribute('aria-label',T('Next slide','下一張'))}
qs('#segs').querySelectorAll('button').forEach(b=>b.onclick=()=>{const n=SL().length;cur=(cur+ +b.dataset.d+n)%n;startT=performance.now();show()});
function show(){qs('#sn').textContent=String(cur+1).padStart(2,'0');qs('#slides').querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('on',i===cur));qs('#story').classList.toggle('alt',cur%2===1)}
function tick(now){
  if(!paused){const p=(now-startT)/DUR;if(p>=1){cur=(cur+1)%SL().length;startT=now;show()}}
  requestAnimationFrame(tick)}
const story=qs('#story');story.addEventListener('mouseenter',()=>{paused=true;story._pt=performance.now()});story.addEventListener('mouseleave',()=>{paused=false;startT+=performance.now()-(story._pt||performance.now())});

document.addEventListener('langchange',()=>{drawSlides();render()});
// leaving the page (or Back from another page) forgets the seed, the dice rolls and typed boxes, and clears them from the
// page, so a copy restored from the browser's back-forward cache holds none of them
addEventListener('pagehide',()=>{wipeSeed();if(S.paper)S.paper.words={};document.querySelectorAll('#rolls,#mseed,[data-pb]').forEach(t=>t.value='');qs('#view').innerHTML=''});
addEventListener('pageshow',e=>{if(e.persisted)go(0)});
// #more (and the old #restore) open the print-more flow, #register its register step; other hashes pick a create step
if(['#more','#restore','#register'].includes(location.hash)){S.flow='more';S.step=location.hash==='#register'?MORE.findIndex(s=>s.id==='register'):1}
else{const i=CREATE.findIndex(s=>'#'+s.id===location.hash);if(i>0)S.step=['confirmA','printA','domainB'].includes(CREATE[i].id)?CREATE.findIndex(s=>s.id==='seedA'):i}
document.addEventListener('DOMContentLoaded',()=>{drawSlides();render();if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(tick)});
})();
</script>
<button class="lang-btn lang-btn-hidden" type="button" hidden></button>
</body></html>
