<script>
(function(){
const T=(en,zh,o)=>window.bcT(en,zh,o);
const DAMM=[[0,3,1,7,5,9,8,6,4,2],[7,0,9,2,1,5,4,8,6,3],[4,2,0,6,8,7,1,3,5,9],[1,7,5,0,9,8,3,4,2,6],[6,1,2,3,0,4,5,9,7,8],[3,6,7,4,2,0,9,5,8,1],[5,8,6,9,7,2,0,1,3,4],[8,9,4,5,3,6,2,0,1,7],[9,4,3,8,6,1,7,2,0,5],[2,5,8,1,4,3,6,7,9,0]];

// Seed: 32 bytes of entropy as 24 BIP-39 words (256 bits + 8-bit checksum). The 32 bytes are the

const POOL=window.BIP39;

async function toWords(ent){const h=await sha(ent);let bits='';for(const x of ent)bits+=x.toString(2).padStart(8,'0');bits+=h[0].toString(2).padStart(8,'0');
  return [...Array(24)].map((_,i)=>POOL[parseInt(bits.slice(i*11,i*11+11),2)])}
const hex=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join('');

// The browser wallet: the node's own Rust (web/wasm) compiled to WebAssembly, so the registration and
// cheque 0 are built by exactly the code the chain checks them with. Inputs go in through `io`.
const WASM=fetch('assets/bitcheque.wasm').then(r=>r.arrayBuffer()).then(b=>WebAssembly.compile(b));
async function wcall(fn,input,raw){const x=(await WebAssembly.instantiate(await WASM,{})).exports;return wrun(x,fn,input,raw)}
function wrun(x,fn,input,raw){const p=x.io_reserve(input.length);new Uint8Array(x.memory.buffer,p,input.length).set(input);const n=x[fn]();if(!n)throw new Error(fn);
  const o=new Uint8Array(x.memory.buffer,x.io_ptr(),n).slice();return raw?o:new TextDecoder().decode(o)}
// the lookup code: the start of the account id (public), printed on the sheets and scanned to find the number once it is final
const fmtCode=c=>c.toUpperCase().match(/.{1,4}/g).join('-');
const findURL=c=>new URL('explorer.html#code='+fmtCode(c),/^https?:/.test(location.protocol)?location.href:'https://bitcheque.org/').href;
async function qrSvg(text,dark='#02050A'){const m=await wcall('qr',enc.encode(text),true),n=m[0],q=4;let d='';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(m[1+y*n+x])d+=`M${x+q} ${y+q}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+2*q} ${n+2*q}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path fill="${dark}" d="${d}"/></svg>`}
async function qrDownload(code){const svg=await qrSvg(findURL(code)),img=new Image(),c=document.createElement('canvas');c.width=c.height=720;

const regTxs=r=>r.txs||[r.tx];
const validReg=r=>r&&r.bitcheque==='registration'&&/^[0-9a-f]{12}$/.test(r.code)&&regTxs(r).length>0&&regTxs(r).every(t=>/^[0-9a-f]+$/.test(t))&&(r.honesty===undefined||(Array.isArray(r.honesty)&&r.honesty.length===18));

  catch(_){qs('#regerr').textContent=T('That is not a Bitcheque registration file.','這不是 Bitcheque 登記檔。')}});
// Proof of work on every core: each worker grinds its own nonce range with the wasm miner and reports progress.
const WORKER=`let x;onmessage=async e=>{const d=e.data;if(d.mod){x=(await WebAssembly.instantiate(d.mod,{})).exports;const p=x.io_reserve(d.input.length);new Uint8Array(x.memory.buffer,p,d.input.length).set(d.input);postMessage({ready:x.reg_prepare()});return}
  let n=d.start;for(;;){const r=x.reg_mine(n>>>0,Math.floor(n/4294967296),d.step);if(r){postMessage({found:n+r-1});return}n+=d.step;postMessage({done:d.step})}}`;
// A batch or cheque 0 the chain already has is refused as a duplicate, which means it is done.
const DONE=['ok','already in mempool','account exists','batch overlaps','cheque number already consumed'];
async function register(btn){const l=qs('#pow-l'),bar=qs('#pow');
  try{const base=(await window.bcNode()).replace(/\/$/,''),txs=regTxs(S.reg),mod=await WASM;
    const limbs=(await (await fetch(base+'/regtarget')).text()).trim().split(/\s+/);
    const target=Uint8Array.from(limbs.flatMap(h=>h.match(/../g).reverse().map(x=>parseInt(x,16))));
    const expect=Math.pow(2,256)/limbs.reduceRight((a,h)=>a*2**64+parseInt(h,16),0),total=expect*txs.length;
    const cores=Math.max(1,Math.min(16,(navigator.hardwareConcurrency||4)-1)),url=URL.createObjectURL(new Blob([WORKER],{type:'text/javascript'}));
    let done=0;const t0=Date.now();
    for(let i=0;i<txs.length;i++){const input=Uint8Array.from([...unhex(txs[i]),...target]);
      const nonce=await new Promise((ok,bad)=>{const ws=[];
        for(let k=0;k<cores;k++){const w=new Worker(url);ws.push(w);
          w.onmessage=e=>{const d=e.data;
            if('ready' in d){if(!d.ready){ws.forEach(x=>x.terminate());bad(new Error('prepare'))}else w.postMessage({start:k*2**36,step:200000})}
            else if(d.done){done+=d.done;const s=(Date.now()-t0)/1000,rate=done/s;bar.style.width=Math.min(97,done/total*100)+'%';
              const tries=(done/1e6).toFixed(0),secs=Math.max(1,Math.round((total-done)/rate)),n=i+1,of=txs.length;
              l.textContent=of>1?T(`Computing batch ${n} of ${of}: ${tries} million tries, about ${secs} s left`,`運算第 ${n} 批（共 ${of} 批）：已試 ${tries} 百萬次，約剩 ${secs} 秒`):T(`Computing: ${tries} million tries, about ${secs} s left`,`運算中：已試 ${tries} 百萬次，約剩 ${secs} 秒`)}
            else if('found' in d){ws.forEach(x=>x.terminate());ok(d.found)}};
          w.postMessage({mod,input})}});
      // re-run the winning nonce here: the wasm leaves it in place, and the result is checked again before anything is sent
      const x=(await WebAssembly.instantiate(mod,{})).exports;wrun(x,'reg_prepare',input,true);
      if(x.reg_mine(nonce>>>0,Math.floor(nonce/4294967296),1)!==1)throw new Error('nonce');
      const len=x.reg_result(),reg=new TextDecoder().decode(new Uint8Array(x.memory.buffer,x.io_ptr(),len).slice());   // read memory only after the call: it may grow and move
      const r=(await (await fetch(base+'/tx',{method:'POST',body:reg})).text()).trim();if(!DONE.includes(r))throw new Error(r);
      done=Math.max(done,expect*(i+1))}
    bar.style.width='100%';l.textContent=T('Sending…','送出中…');
    for(const tx of S.reg.honesty||[]){const r=(await (await fetch(base+'/tx',{method:'POST',body:tx})).text()).trim();if(!DONE.includes(r))throw new Error(r)}
    S.sent=true;render()}
  catch(e){btn.disabled=false;l.textContent=T(`Not registered: ${e.message}. Check the connection and try again.`,`未登記：${e.message}。請檢查連線後再試一次。`)}}

function offline(){return ''}
function landing(){
  qs('#back').hidden=true; qs('#prog').hidden=true;
  qs('#view').className='inner land';
  qs('#view').innerHTML=`<h1>${T('Blockchain you<br>sign by hand','親手<br>簽名的區塊鏈')}</h1><p class="s">${T('Safe. Simple. On paper.','安全。簡單。寫在紙上。')}</p>
   <button class="btn primary pbtn" data-act="flow" data-flow="create">${T('Get started','開始')}</button>
   <button class="btn pbtn dk" data-act="flow" data-flow="more">${T('Print more cheques','印更多支票')}</button>
   <p class="note"><span class="icon">science</span>${T('Your first book: about 20 minutes offline','你的第一本簿子：離線約 20 分鐘')}</p>`;
}
function render(){
  if(S.step===0){landing();return}
  const st=steps(), cur=st[S.step];
  qs('#back').hidden=false; qs('#prog').hidden=false;
  qs('#prog').innerHTML=st.slice(1).map((_,i)=>`<i class="${i<S.step?'on':''}"></i>`).join('');
  qs('#view').className='inner step';
  qs('#view').innerHTML=R[cur.id]();
  qs('#view').querySelectorAll('[data-qr]').forEach(async el=>{el.innerHTML=await qrSvg(el.dataset.qr)});
  if(cur.id==='honesty')watchHonesty();
  if(cur.id==='register')window.bcNodeNote(qs('#ob-node'));   // drawn by the wasm encoder after the step is on screen
  qs('.dbody').scrollTop=0;
}
function go(d){do{S.step=Math.max(0,Math.min(steps().length-1,S.step+d))}while(skip(steps()[S.step].id)&&S.step>0&&S.step<steps().length-1);render()}
qs('#back').onclick=()=>go(-1);
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-q]');if(!b)return;
  if(b.dataset.q){if(b.dataset.w===b.dataset.ans){S.quiz[b.dataset.q]=b.dataset.w;render()}else{b.classList.remove('no');void b.offsetWidth;b.classList.add('no')}return}
  const a=b.dataset.act;
  if(a==='next')go(1); else if(a==='back')go(-1);
  else if(a==='flow'){S.flow=b.dataset.flow;S.step=1;render()}
  else if(a==='dl'){const p=b.dataset.part;b.disabled=true;const t=document.querySelectorAll('.task');t.forEach(x=>{x.classList.add('run');x.querySelector('.icon').textContent='progress_activity'});
    download(p).then(()=>{S['printed'+p]=true;render()}).catch(()=>{b.disabled=false;t.forEach(x=>x.classList.remove('run'))})}
  else if(a==='src'){S.src=b.dataset.src;render()}
  else if(a==='count'){S.last=+b.dataset.n;render()}
  else if(a==='mkdice'){b.disabled=true;makeSeed(new TextEncoder().encode(S.rolls))}
  else if(a==='reseed'){Object.assign(S,{seed:null,ent:'',rolls:'',moves:0,pool:[]});for(const k in S.quiz)if(k[0]==='A')delete S.quiz[k];S.checked.sA0=S.checked.sA1=false;render()}
  else if(a==='reveal'){qs('#'+b.dataset.target).classList.remove('blur')}
  else if(a==='doreg'){b.disabled=true;register(b)}
  else if(a==='savereg'){saveReg()}
  else if(a==='qrdl'){qrDownload(S.code)}
});
document.addEventListener('change',e=>{const c=e.target.closest('[data-ck]');if(!c)return;S.checked[c.dataset.ck]=c.checked;const lab=c.closest('.pi');if(lab)lab.classList.toggle('on',c.checked);const st=steps()[S.step].id;
  const need={clean:['cl',4],domainA:['dA',4],seedA:['sA',2],domainB:['sB',2]}[st];if(!need)return;
  let ok=allChecked(need[0],need[1]);qs('[data-act="next"]').disabled=!ok});
document.addEventListener('input',e=>{
  if(e.target.id==='rolls'){const t=e.target,v=t.value.replace(/[^1-6]/g,'');S.rolls=v;if(t.value.replace(/\s/g,'')!==v)t.value=v;
    qs('#rcnt').textContent=`${v.length} / ${ROLLS}`;qs('#rbar').style.width=Math.min(100,v.length/ROLLS*100)+'%';qs('[data-act="mkdice"]').disabled=v.length<ROLLS}});
// dice: seed = SHA-256(ASCII rolls). mouse: seed = SHA-256(movements || 32 bytes from the system CSPRNG).
async function makeSeed(bytes){const e=await sha(bytes);S.ent=hex(e);S.seed=await toWords(e);render()}
let lastMv=null;
document.addEventListener('pointermove',e=>{if(S.seed||S.src!=='mouse'||!e.target.closest('#pad'))return;
  const k=e.clientX+','+e.clientY;if(k===lastMv)return;lastMv=k;S.pool.push(e.clientX,e.clientY,performance.now(),e.pressure||0);S.moves++;
  const p=Math.min(100,S.moves/MOVES*100);qs('#mbar').style.width=p+'%';qs('#mcnt').textContent=Math.round(p)+'%';
  if(S.moves===MOVES){const sys=crypto.getRandomValues(new Uint8Array(32)),mv=new Uint8Array(new Float64Array(S.pool).buffer),all=new Uint8Array(mv.length+32);all.set(mv);all.set(sys,mv.length);S.pool=[];makeSeed(all)}});

const DUR=5200;
function drawSlides(){const sl=SL();
  qs('#slides').innerHTML=sl.map((s,i)=>`<div class="slide ${i===cur?'on':''}"><div class="scene">${s.html}</div><p class="cap">${s.cap}<small>${s.sub}</small></p></div>`).join('');
  qs('#st').textContent=String(sl.length).padStart(2,'0');show();
  const [pv,nx]=qs('#segs').querySelectorAll('button');pv.setAttribute('aria-label',T('Previous slide','上一張'));nx.setAttribute('aria-label',T('Next slide','下一張'))}
qs('#segs').querySelectorAll('button').forEach(b=>b.onclick=()=>{const n=SL().length;cur=(cur+ +b.dataset.d+n)%n;startT=performance.now();show()});
function show(){qs('#sn').textContent=String(cur+1).padStart(2,'0');qs('#slides').querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('on',i===cur));qs('#story').classList.toggle('alt',cur%2===1)}
function tick(now){
  if(!paused){const p=(now-startT)/DUR;if(p>=1){cur=(cur+1)%SL().length;startT=now;show()}}
  requestAnimationFrame(tick)}
const story=qs('#story');story.addEventListener('mouseenter',()=>{paused=true;story._pt=performance.now()});story.addEventListener('mouseleave',()=>{paused=false;startT+=performance.now()-(story._pt||performance.now())});

document.addEventListener('langchange',()=>{drawSlides();render()});
// #more (and the old #restore) open the print-more flow, #register its register step; other hashes pick a create step
if(['#more','#restore','#register'].includes(location.hash)){S.flow='more';S.step=location.hash==='#register'?MORE.findIndex(s=>s.id==='register'):1}
else{const i=CREATE.findIndex(s=>'#'+s.id===location.hash);if(i>0)S.step=i}
document.addEventListener('DOMContentLoaded',()=>{drawSlides();render();if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(tick)});
})();
</script>
<button class="lang-btn lang-btn-hidden" type="button" hidden></button>
</body></html>
